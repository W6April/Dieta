<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Diety</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f3f4f6; color: #1f2937; padding-bottom: 70px; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background: #2563eb; color: #fff; padding: 16px; }
        .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .content { padding: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .card-blue { background: #eff6ff; border-color: #bfdbfe; }
        .card-gray { background: #f9fafb; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        label { display: block; font-size: 11px; color: #4b5563; margin-bottom: 2px; font-weight: bold; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; text-align: center; }
        .btn-orange { background: #f97316; }
        .btn-green { background: #059669; }
        .btn-full { width: 100%; display: block; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
        .del-btn { background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 14px; padding: 2px 6px; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
        .nav-btn { background: none; border: none; font-size: 12px; font-weight: bold; color: #6b7280; cursor: pointer; }
        .nav-btn.active { color: #2563eb; }
        .text-green { color: #16a34a; }
        .text-red { color: #dc2626; }
        .text-orange { color: #ea580c; }
    </style>
</head>
<body>
    <div id="app" class="container"></div>

    <script>
        const INITIAL_PRODUCTS = [
            { id: "p1", name: "Skyr naturalny (kubek 150g)", baseWeight: 150, baseKcal: 98, baseP: 18, baseF: 0, baseC: 6.2 },
            { id: "p2", name: "Skyr pitny (butelka 360g)", baseWeight: 360, baseKcal: 225, baseP: 36, baseF: 1, baseC: 16 },
            { id: "p3", name: "Protein Pudding (kubek 200g)", baseWeight: 200, baseKcal: 152, baseP: 20, baseF: 3, baseC: 11 },
            { id: "p4", name: "Pierś z kurczaka (surowa)", baseWeight: 100, baseKcal: 98, baseP: 21.5, baseF: 1.3, baseC: 0 },
            { id: "p5", name: "Ryż basmati (przed ugotowaniem)", baseWeight: 50, baseKcal: 175, baseP: 3.8, baseF: 0.4, baseC: 38.5 },
            { id: "p6", name: "Jajko kurze (1 sztuka)", baseWeight: 55, baseKcal: 77, baseP: 6.9, baseF: 5.3, baseC: 0.3 },
            { id: "p7", name: "Płatki owsiane", baseWeight: 50, baseKcal: 188, baseP: 6, baseF: 3.6, baseC: 31.2 },
            { id: "p8", name: "Masło orzechowe", baseWeight: 15, baseKcal: 88, baseP: 3.9, baseF: 7.5, baseC: 2.1 },
            { id: "p9", name: "Twaróg chudy", baseWeight: 100, baseKcal: 86, baseP: 19.8, baseF: 0.5, baseC: 3.5 },
            { id: "p10", name: "Banany", baseWeight: 120, baseKcal: 116, baseP: 1.2, baseF: 0.4, baseC: 26.2 }
        ];

        function loadStorage(key, fallback) {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        const state = {
            tab: 'dziennik',
            users: loadStorage('diet_users', [{ id: 'u1', name: 'Ja' }, { id: 'u2', name: 'Zona' }]),
            userId: localStorage.getItem('diet_user') || 'u1',
            products: loadStorage('diet_products', INITIAL_PRODUCTS),
            diaries: loadStorage('diet_diaries', {}),
            date: new Date().toISOString().split('T')[0],
            selectedProd: '',
            weightInput: ''
        };

        function save() {
            try {
                localStorage.setItem('diet_users', JSON.stringify(state.users));
                localStorage.setItem('diet_user', state.userId);
                localStorage.setItem('diet_products', JSON.stringify(state.products));
                localStorage.setItem('diet_diaries', JSON.stringify(state.diaries));
            } catch (e) {}
        }

        function getDay() {
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][state.date]) {
                state.diaries[state.userId][state.date] = {
                    goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 },
                    meals: [], workouts: [], weight: ''
                };
            }
            return state.diaries[state.userId][state.date];
        }

        function render() {
            const app = document.getElementById('app');
            const day = getDay();
            const user = state.users.find(u => u.id === state.userId) || state.users[0];

            let eatenKcal = 0, eatenP = 0, eatenF = 0, eatenC = 0;
            day.meals.forEach(m => { eatenKcal += m.kcal; eatenP += m.p; eatenF += m.f; eatenC += m.c; });
            const burned = day.workouts.reduce((s, w) => s + w.kcal, 0);
            const left = day.goals.kcal - eatenKcal + burned;

            let html = `
                <div class="header">
                    <div class="row" style="margin-bottom:8px;">
                        <b>Dziennik Diety</b>
                        <span style="font-size:11px; background:#1d4ed8; padding:3px 8px; border-radius:4px;">Profil: ${user.name}</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        ${state.users.map(u => `<button onclick="switchUser('${u.id}')" style="flex:1; padding:4px; border:none; border-radius:4px; font-weight:bold; background:${state.userId === u.id ? '#fff' : '#1d4ed8'}; color:${state.userId === u.id ? '#2563eb' : '#fff'}">${u.name}</button>`).join('')}
                    </div>
                </div>
                <div class="content">
            `;

            if (state.tab === 'dziennik') {
                html += `
                    <div class="card">
                        <div class="row">
                            <div style="flex:1;"><label>Data</label><input type="date" value="${state.date}" onchange="changeDate(this.value)" /></div>
                            <div style="width:100px;"><label>Waga (kg)</label><input type="number" step="0.1" value="${day.weight}" onchange="changeWeight(this.value)" /></div>
                        </div>
                    </div>
                    <div class="card card-blue">
                        <div class="row" style="font-size:12px; margin-bottom:4px;"><b>Cel: ${day.goals.kcal} kcal</b><span>B: ${day.goals.p}g | T: ${day.goals.f}g | W: ${day.goals.c}g</span></div>
                    </div>
                    <div class="card card-gray">
                        <div class="row">
                            <div><div style="font-size:10px; color:#6b7280;">ZJEDZONO</div><div style="font-size:22px; font-weight:bold;">${Math.round(eatenKcal)} kcal</div></div>
                            <div style="text-align:right;"><div style="font-size:10px; color:#6b7280;">POZOSTAŁO</div><div style="font-size:22px; font-weight:bold;" class="${left < 0 ? 'text-red' : 'text-green'}">${Math.abs(Math.round(left))} kcal</div></div>
                        </div>
                    </div>
                    <div class="card">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px;">Dodaj posiłek</div>
                        <div class="row">
                            <select id="selProd" onchange="selectProd(this.value)" style="flex:1;">
                                <option value="">Wybierz produkt...</option>
                                ${state.products.map(p => `<option value="${p.id}" ${state.selectedProd === p.id ? 'selected' : ''}>${p.name} (${p.baseWeight}g / ${p.baseKcal}kcal)</option>`).join('')}
                            </select>
                            <input id="inpW" type="number" placeholder="Gramy" value="${state.weightInput}" oninput="state.weightInput = this.value" style="width:80px;" />
                            <button onclick="addMeal()" class="btn">+</button>
                        </div>
                        <div style="margin-top:10px;">
                            ${day.meals.map(m => `<div class="item-row"><div><b>${m.name}</b><div style="font-size:11px; color:#6b7280;">${m.weight}g | B:${m.p} T:${m.f} W:${m.c}</div></div><div class="row"><b>${m.kcal} kcal</b><button onclick="delMeal(${m.id})" class="del-btn">X</button></div></div>`).join('')}
                        </div>
                    </div>
                    <div class="card">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px;" class="text-orange">Treningy (-${burned} kcal)</div>
                        <div class="row" style="margin-bottom:6px;">
                            <input id="wName" placeholder="Nazwa" style="flex:1;" />
                            <input id="wTime" type="number" placeholder="Min" style="width:60px;" />
                            <input id="wKcal" type="number" placeholder="Kcal" style="width:65px;" />
                            <button onclick="addWorkout()" class="btn btn-orange">+</button>
                        </div>
                        <div>
                            ${day.workouts.map(w => `<div class="item-row"><span><b>${w.name}</b> (${w.time}min)</span><div class="row"><span class="text-orange"><b>${w.kcal} kcal</b></span><button onclick="delWorkout(${w.id})" class="del-btn">X</button></div></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (state.tab === 'baza') {
                html += `
                    <div class="card card-blue">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px;">Dodaj produkt do bazy</div>
                        <input id="pName" placeholder="Nazwa" style="margin-bottom:6px;" />
                        <div class="row" style="margin-bottom:6px;">
                            <div><label>Waga bazowa (g)</label><input id="pW" type="number" value="100" /></div>
                            <div><label>Kalorie</label><input id="pK" type="number" placeholder="Kcal" /></div>
                        </div>
                        <div class="row" style="margin-bottom:8px;">
                            <div><label>Białko</label><input id="pP" type="number" step="0.1" value="0" /></div>
                            <div><label>Tłuszcz</label><input id="pF" type="number" step="0.1" value="0" /></div>
                            <div><label>Węglo</label><input id="pC" type="number" step="0.1" value="0" /></div>
                        </div>
                        <button onclick="addProd()" class="btn btn-full">Zapisz produkt</button>
                    </div>
                    <div class="card">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px;">Baza produktów (${state.products.length})</div>
                        ${state.products.map(p => `<div class="item-row"><div><b>${p.name}</b> <span style="color:#2563eb;">(${p.baseWeight}g)</span><div style="font-size:11px; color:#6b7280;">B:${p.baseP} T:${p.baseF} W:${p.baseC}</div></div><div class="row"><b class="text-green">${p.baseKcal} kcal</b><button onclick="delProd('${p.id}')" class="del-btn">X</button></div></div>`).join('')}
                    </div>
                `;
            } else if (state.tab === 'kopia') {
                html += `
                    <div class="card">
                        <div style="font-weight:bold; margin-bottom:6px; font-size:13px;">Kopia zapasowa</div>
                        <button onclick="exportJson()" class="btn btn-full" style="margin-bottom:8px;">Pobierz plik kopii (.json)</button>
                        <textarea id="jsonArea" rows="4" placeholder="Wklej kod JSON..." style="margin-bottom:6px;"></textarea>
                        <button onclick="importJson()" class="btn btn-green btn-full">Wgraj wklejony JSON</button>
                    </div>
                `;
            }

            html += `
                </div>
                <div class="bottom-nav">
                    <button onclick="switchTab('dziennik')" class="nav-btn ${state.tab === 'dziennik' ? 'active' : ''}">Dziennik</button>
                    <button onclick="switchTab('baza')" class="nav-btn ${state.tab === 'baza' ? 'active' : ''}">Baza</button>
                    <button onclick="switchTab('kopia')" class="nav-btn ${state.tab === 'kopia' ? 'active' : ''}">Kopia</button>
                </div>
            `;
            app.innerHTML = html;
        }

        window.switchTab = (t) => { state.tab = t; render(); };
        window.switchUser = (u) => { state.userId = u; save(); render(); };
        window.changeDate = (d) => { state.date = d; render(); };
        window.changeWeight = (w) => { getDay().weight = w; save(); };

        window.selectProd = (id) => {
            state.selectedProd = id;
            const p = state.products.find(x => x.id === id);
            state.weightInput = p ? p.baseWeight : '';
            const el = document.getElementById('inpW');
            if (el) el.value = state.weightInput;
        };

        window.addMeal = () => {
            const p = state.products.find(x => x.id === state.selectedProd);
            const w = parseFloat(state.weightInput);
            if (!p || !w) return alert('Wybierz produkt i wagę!');
            const r = w / p.baseWeight;
            getDay().meals.push({
                id: Date.now(), name: p.name, weight: w,
                kcal: Math.round(p.baseKcal * r),
                p: Math.round(p.baseP * r * 10) / 10,
                f: Math.round(p.baseF * r * 10) / 10,
                c: Math.round(p.baseC * r * 10) / 10
            });
            state.selectedProd = ''; state.weightInput = '';
            save(); render();
        };

        window.delMeal = (id) => {
            const day = getDay();
            day.meals = day.meals.filter(x => x.id !== id);
            save(); render();
        };

        window.addWorkout = () => {
            const name = document.getElementById('wName').value;
            const time = parseInt(document.getElementById('wTime').value) || 0;
            const kcal = parseInt(document.getElementById('wKcal').value) || 0;
            if (!name || !kcal) return;
            getDay().workouts.push({ id: Date.now(), name, time, kcal });
            save(); render();
        };

        window.delWorkout = (id) => {
            const day = getDay();
            day.workouts = day.workouts.filter(x => x.id !== id);
            save(); render();
        };

        window.addProd = () => {
            const name = document.getElementById('pName').value;
            const w = parseFloat(document.getElementById('pW').value) || 100;
            const p = parseFloat(document.getElementById('pP').value) || 0;
            const f = parseFloat(document.getElementById('pF').value) || 0;
            const c = parseFloat(document.getElementById('pC').value) || 0;
            const k = document.getElementById('pK').value;
            const kcal = k !== '' ? parseFloat(k) : Math.round(p*4 + c*4 + f*9);
            if (!name) return alert('Podaj nazwę!');
            state.products.unshift({ id: String(Date.now()), name, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c });
            save(); render();
        };

        window.delProd = (id) => {
            if (confirm('Usunąć?')) {
                state.products = state.products.filter(x => x.id !== id);
                save(); render();
            }
        };

        window.exportJson = () => {
            const blob = new Blob([JSON.stringify({ products: state.products, diaries: state.diaries }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dieta_kopia.json';
            a.click();
        };

        window.importJson = () => {
            try {
                const data = JSON.parse(document.getElementById('jsonArea').value);
                if (data.products) state.products = data.products;
                if (data.diaries) state.diaries = data.diaries;
                save(); render();
                alert('Wgrano pomyślnie!');
            } catch(e) {
                alert('Błąd JSON!');
            }
        };

        render();
    </script>
</body>
</html>

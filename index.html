        function loadStorage(key, fallback) {
            try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : fallback; } 
            catch (e) { return fallback; }
        }

        const state = {
            tab: 'dziennik',
            users: loadStorage('diet_v9_users', loadStorage('diet_v8_users', [
                { id: 'u1', name: 'Ja', startDate: new Date().toISOString().split('T')[0] }, 
                { id: 'u2', name: 'Żona', startDate: new Date().toISOString().split('T')[0] }
            ])),
            userId: localStorage.getItem('diet_v9_curr_user') || localStorage.getItem('diet_v8_curr_user') || 'u1',
            products: [], 
            workoutsDb: loadStorage('diet_v9_workouts_db', loadStorage('diet_v8_workouts_db', [])),
            diaries: loadStorage('diet_v9_diaries', loadStorage('diet_v8_diaries', {})),
            settings: loadStorage('diet_v9_settings', loadStorage('diet_v8_settings', { startOfWeek: 1, geminiApiKey: '', lastBackup: '' })),
            date: new Date().toISOString().split('T')[0],
            isEditingGoals: false,
            importMode: 'full',
            statusMsg: '',
            
            prodSearch: '', prodResults: [], selectedProdId: '', inputWeight: '',
            wSearch: '', wResults: [], wInputTime: '', wInputKcal: '',
            
            chatOpen: false, chatHistory: [], chatLoading: false
        };
        function initData() {
            let saved = loadStorage('diet_v9_products', loadStorage('diet_v8_products', []));
            const names = new Set(saved.map(p => p.name.trim().toLowerCase()));
            FULL_PRODUCTS.forEach(bp => {
                if (!names.has(bp.name.trim().toLowerCase())) { saved.push(bp); names.add(bp.name.trim().toLowerCase()); }
            });
            state.products = saved;

            if(state.settings.geminiApiKey === undefined) state.settings.geminiApiKey = '';
            if(state.settings.lastBackup === undefined) state.settings.lastBackup = '';
            
            // Add messages to chat if empty
            if(state.chatHistory.length === 0) {
                state.chatHistory.push({ role: 'model', text: 'Cześć! Jestem Twoim dietetycznym asystentem Gemini AI. Powiedz mi co zjadłeś (np. "zjadłem burgera drwala i duże frytki"), a ja oszacuję kalorie i pozwolę Ci dodać to do dziennika!' });
            }
        }
        initData();

        function saveState() {
            localStorage.setItem('diet_v9_users', JSON.stringify(state.users));
            localStorage.setItem('diet_v9_curr_user', state.userId);
            localStorage.setItem('diet_v9_products', JSON.stringify(state.products));
            localStorage.setItem('diet_v9_workouts_db', JSON.stringify(state.workoutsDb));
            localStorage.setItem('diet_v9_diaries', JSON.stringify(state.diaries));
            localStorage.setItem('diet_v9_settings', JSON.stringify(state.settings));
        }

        function getDayData() {
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][state.date]) {
                state.diaries[state.userId][state.date] = {
                    goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 },
                    meals: [], workouts: [], weight: '', water: 0, measurements: { waist: '', biceps: '', chest: '', thigh: '' }
                };
            }
            // Ensure backwards compatibility for new fields
            if(state.diaries[state.userId][state.date].water === undefined) state.diaries[state.userId][state.date].water = 0;
            if(state.diaries[state.userId][state.date].measurements === undefined) state.diaries[state.userId][state.date].measurements = { waist: '', biceps: '', chest: '', thigh: '' };
            
            return state.diaries[state.userId][state.date];
        }

        function getDietDaysCounter() {
            const user = state.users.find(u => u.id === state.userId);
            const start = new Date(user.startDate);
            const current = new Date(state.date);
            const diff = Math.floor((current - start) / (1000 * 60 * 60 * 24));
            return diff >= 0 ? diff + 1 : 0;
        }

        function renderWeightChart() {
            const userDiary = state.diaries[state.userId] || {};
            const dates = Object.keys(userDiary).sort((a,b) => new Date(a) - new Date(b));
            
            // Pobierz ostatnie 14 wpisów wagi
            const weights = [];
            dates.forEach(d => {
                const w = parseFloat(userDiary[d].weight);
                if(w && !isNaN(w)) weights.push({ date: d, val: w });
            });
            
            const last14 = weights.slice(-14);
            if(last14.length < 2) return `<div class="text-xs text-gray-400 text-center py-6 border border-dashed border-gray-200 rounded-xl">Dodaj wagę przez min. 2 dni, by wygenerować wykres.</div>`;

            const minW = Math.min(...last14.map(w => w.val));
            const maxW = Math.max(...last14.map(w => w.val));
            const range = (maxW - minW) || 1;
            
            const w = 340; const h = 100; const padX = 20; const padY = 20;
            const usableW = w - (padX * 2);
            const usableH = h - (padY * 2);
            const stepX = usableW / (last14.length - 1);

            let points = last14.map((pt, i) => {
                const x = padX + (i * stepX);
                const y = h - padY - (((pt.val - minW) / range) * usableH);
                return `${x},${y}`;
            }).join(' ');

            return `
                <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto drop-shadow-md bg-white rounded-xl border border-indigo-100 p-2">
                    <polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,${h-padY} ${w},${h-padY}" />
                    <polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,${padY} ${w},${padY}" />
                    <polyline fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
                    ${last14.map((pt, i) => {
                        const x = padX + (i * stepX);
                        const y = h - padY - (((pt.val - minW) / range) * usableH);
                        return `<circle cx="${x}" cy="${y}" r="3" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
                                ${i === 0 || i === last14.length - 1 ? `<text x="${x}" y="${y - 8}" font-size="8" font-weight="bold" fill="#4f46e5" text-anchor="middle">${pt.val}</text>` : ''}`;
                    }).join('')}
                </svg>
            `;
        }

        function checkBackupReminder() {
            const now = new Date();
            const isSunday = now.getDay() === 0;
            const isAfternoon = now.getHours() >= 12;
            const todayStr = now.toISOString().split('T')[0];
            return isSunday && isAfternoon && state.settings.lastBackup !== todayStr;
        }

        function render() {
            const app = document.getElementById('app');
            const day = getDayData();
            const user = state.users.find(u => u.id === state.userId);

            let eatenKcal = 0, eatenP = 0, eatenF = 0, eatenC = 0;
            day.meals.forEach(m => { eatenKcal += m.kcal; eatenP += m.p; eatenF += m.f; eatenC += m.c; });
            const burned = day.workouts.reduce((s, w) => s + w.kcal, 0);
            
            const nettoKcal = Math.max(0, eatenKcal - burned);
            const left = day.goals.kcal - nettoKcal;
            
            let statusLabel = 'Zostało na dziś';
            let statusColor = 'text-emerald-500';
            let bgClass = 'bg-gray-50';

            if (left < 0) {
                statusLabel = 'Nadwyżka';
                statusColor = 'text-red-500';
                bgClass = 'bg-red-50 border-red-100';
            } else if (eatenKcal > day.goals.kcal && left >= 0) {
                statusLabel = 'Zostało z treningu';
                statusColor = 'text-blue-500';
                bgClass = 'bg-blue-50 border-blue-100';
            }

            const showReminder = checkBackupReminder();

            let html = `
                ${showReminder ? `<div class="bg-yellow-400 text-yellow-900 text-[10px] font-bold text-center py-1.5 px-4 shadow-sm z-50">⚠️ Jest niedziela po południu! Zrób tygodniową kopię zapasową w zakładce Ustawienia.</div>` : ''}

                    <div class="flex justify-between items-center mb-3">
                        <h1 class="text-xl font-bold tracking-tight">Dziennik Diety</h1>
                        <div class="flex items-center space-x-1 bg-blue-800 px-2 py-1 rounded-full shadow-inner text-xs font-bold">
                            <span>Dzień:</span>
                            <input type="number" value="${getDietDaysCounter()}" onchange="setDayCounter(this.value)" class="w-10 bg-transparent text-white text-center outline-none border-b border-blue-400" />
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 bg-blue-700 p-1.5 rounded-lg shadow-inner">
                        <span class="text-[10px] text-blue-200 pl-2 font-bold uppercase tracking-wider">Profil:</span>
                        <div class="flex space-x-1 flex-1">
                            ${state.users.map(u => `
                                <button onclick="switchUser('${u.id}')" class="flex-1 py-1.5 rounded-md text-xs font-bold transition-colors truncate ${state.userId === u.id ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-500'}">
                                    ${u.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
                <div class="p-3 w-full flex-1 overflow-x-hidden relative">
            `;
             if (state.tab === 'dziennik') {
                html += `
                    <div class="flex space-x-2 mb-3">
                        <div class="flex-1 bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 min-w-0">
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-0.5 block">Data</label>
                            <input type="date" value="${state.date}" onchange="changeDate(this.value)" class="w-full text-xs font-bold text-gray-700 bg-transparent outline-none" />
                        </div>
                        <div class="w-24 bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 shrink-0">
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-0.5 block">Waga (kg)</label>
                            <input type="number" step="0.1" value="${day.weight}" onchange="changeWeight(this.value)" class="w-full text-xs font-bold text-gray-700 text-center bg-transparent outline-none" />
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-blue-900 text-xs">🎯 Cel (${user.name}): ${day.goals.kcal} kcal</span>
                            <button onclick="toggleGoals()" class="text-[10px] bg-blue-600 text-white px-2 py-1 rounded font-bold shadow-sm hover:bg-blue-700">
                                ${state.isEditingGoals ? 'Zamknij' : 'Edytuj'}
                            </button>
                        </div>
                        ${state.isEditingGoals ? `
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <div><label class="text-[10px] font-bold text-blue-700">Kcal</label><input id="gKcal" type="number" value="${day.goals.kcal}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Białko (g)</label><input id="gP" type="number" value="${day.goals.p}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Tłuszcz (g)</label><input id="gF" type="number" value="${day.goals.f}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Węglo (g)</label><input id="gC" type="number" value="${day.goals.c}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                            </div>
                            <button onclick="saveGoals()" class="w-full bg-blue-600 text-white py-1.5 rounded font-bold text-xs">Zapisz cel</button>
                        ` : ''}
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-center w-1/3">
                                <p class="text-[9px] font-bold text-gray-400 uppercase">Zjedzono</p>
                                <p class="text-lg font-black text-gray-800">${Math.round(eatenKcal)}</p>
                            </div>
                            <div class="text-center w-1/3 border-x border-gray-100">
                                <p class="text-[9px] font-bold text-orange-400 uppercase">Spalone</p>
                                <p class="text-lg font-black text-orange-500">-${burned}</p>
                            </div>
                            <div class="text-center w-1/3">
                                <p class="text-[9px] font-bold text-blue-400 uppercase">Kcal Netto</p>
                                <p class="text-lg font-black text-blue-600">${Math.round(nettoKcal)}</p>
                            </div>
                        </div>

                                ${state.chatHistory.map(msg => `
                                    <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                        <div class="max-w-[85%] rounded-2xl p-3 ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-sm' : 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm shadow-sm text-sm'}">
                                            ${msg.text}
                                            ${msg.parsedFood ? `
                                                <div class="mt-3 pt-3 border-t border-gray-100">
                                                    <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Znaleziono Posiłek:</p>
                                                    <p class="font-bold text-blue-700 text-xs">${msg.parsedFood.name} (${msg.parsedFood.kcal} kcal)</p>
                                                    <p class="text-[10px] text-gray-500">B:${msg.parsedFood.p} T:${msg.parsedFood.f} W:${msg.parsedFood.c}</p>
                                                    <button onclick="addGeminiMeal('${encodeURIComponent(JSON.stringify(msg.parsedFood))}')" class="mt-2 w-full bg-blue-50 text-blue-600 border border-blue-200 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors">➕ Dodaj do dziennika</button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                                ${state.chatLoading ? `<div class="flex justify-start"><div class="bg-white border border-gray-200 rounded-2xl p-3 rounded-tl-sm shadow-sm text-sm text-gray-400 animate-pulse">Gemini myśli...</div></div>` : ''}
                            </div>
                            
                            <div class="p-3 bg-white border-t border-gray-200 pb-safe">
                                <div class="flex space-x-2">
                                    <input id="chatInput" type="text" placeholder="Co dziś zjadłeś?" class="flex-1 bg-gray-100 border-none rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key==='Enter') sendChat()" />
                                    <button onclick="sendChat()" class="bg-blue-600 text-white px-4 rounded-xl font-bold active:scale-95 transition-transform">➤</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `
                </div>
                <div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur border-t border-gray-200 grid grid-cols-5 p-1 pb-safe z-50">
                    <button onclick="switchTab('dziennik')" class="flex flex-col items-center justify-center p-1.5 rounded-lg transition-colors min-w-0 ${state.tab === 'dziennik' ? 'text-blue-600' : 'text-gray-400'}">
                        <span class="text-xl mb-0.5">📅</span><span class="text-[9px] font-bold truncate w-full text-center">Dziennik</span>
                    </button>
                    <button onclick="switchTab('baza')" class="flex flex-col items-center justify-center p-1.5 rounded-lg transition-colors min-w-0 ${state.tab === 'baza' ? 'text-blue-600' : 'text-gray-400'}">
                        <span class="text-xl mb-0.5">🍎</span><span class="text-[9px] font-bold truncate w-full text-center">Baza</span>
                    </button>
                    <button onclick="switchTab('trening')" class="flex flex-col items-center justify-center p-1.5 rounded-lg transition-colors min-w-0 ${state.tab === 'trening' ? 'text-blue-600' : 'text-gray-400'}">
                        <span class="text-xl mb-0.5">💪</span><span class="text-[9px] font-bold truncate w-full text-center">Ciało</span>
                    </button>
                    <button onclick="switchTab('podsumowanie')" class="flex flex-col items-center justify-center p-1.5 rounded-lg transition-colors min-w-0 ${state.tab === 'podsumowanie' ? 'text-blue-600' : 'text-gray-400'}">
                        <span class="text-xl mb-0.5">📊</span><span class="text-[9px] font-bold truncate w-full text-center">Tydzień</span>
                    </button>
                    <button onclick="switchTab('kopia')" class="flex flex-col items-center justify-center p-1.5 rounded-lg transition-colors min-w-0 ${state.tab === 'kopia' ? 'text-blue-600' : 'text-gray-400'}">
                        <span class="text-xl mb-0.5">⚙️</span><span class="text-[9px] font-bold truncate w-full text-center">Kopia</span>
                    </button>
                </div>
            `;
            app.innerHTML = html;

            if(state.chatOpen) {
                const cb = document.getElementById('chatBox');
                if(cb) cb.scrollTop = cb.scrollHeight;
            }
        }

        window.switchTab = (t) => { state.tab = t; state.statusMsg = ''; state.prodResults = []; state.wResults = []; render(); };
        window.switchUser = (u) => { state.userId = u; saveState(); render(); };
        window.changeDate = (d) => { state.date = d; render(); };
        window.changeWeight = (w) => { getDayData().weight = w; saveState(); };
        window.toggleGoals = () => { state.isEditingGoals = !state.isEditingGoals; render(); };
        window.changeStartOfWeek = (val) => { state.settings.startOfWeek = parseInt(val); saveState(); render(); };
        window.changeGeminiKey = (val) => { state.settings.geminiApiKey = val.trim(); saveState(); };
        
        window.toggleWater = (idx) => {
            const d = getDayData();
            if (idx === d.water - 1) d.water -= 1; // click last active to remove
            else d.water = idx + 1;
            saveState(); render();
        };

        window.updateMeasurement = (key, val) => {
            getDayData().measurements[key] = val;
            saveState();
        };

        window.changeUserName = (id, newName) => {
            const u = state.users.find(x => x.id === id);
            if (u && newName.trim()) { u.name = newName.trim(); saveState(); render(); }
        };

        window.setDayCounter = (val) => {
            const days = parseInt(val);
            if(isNaN(days) || days < 0) return;
            const user = state.users.find(u => u.id === state.userId);
            const current = new Date(state.date);
            current.setDate(current.getDate() - (days > 0 ? days - 1 : 0));
            user.startDate = current.toISOString().split('T')[0];
            saveState(); render();
        };

        // Custom Wyszukiwarka Produktów
        window.searchProd = (val) => {
            state.prodSearch = val;
            if (val.trim().length > 0) {
                state.prodResults = state.products.filter(p => p.name.toLowerCase().includes(val.trim().toLowerCase())).slice(0, 15);
            } else {
                state.prodResults = [];
            }
            render();
            setTimeout(() => { const el = document.getElementById('pSearchInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectProdDrop = (id) => {
            const p = state.products.find(x => x.id === id);
            if (p) {
                state.selectedProdId = id;
                state.prodSearch = p.name;
                state.inputWeight = p.baseWeight;
                state.prodResults = [];
                render();
            }
        };

        window.addMeal = () => {
            let p = state.products.find(x => x.id === state.selectedProdId);
            if (!p) {
                p = state.products.find(x => x.name.toLowerCase() === state.prodSearch.trim().toLowerCase());
            }
            const w = parseFloat(state.inputWeight);
            if (!p || !w) return alert('Wybierz produkt z podpowiedzi i podaj wagę!');
            const r = w / p.baseWeight;
            getDayData().meals.push({ id: Date.now(), name: p.name, weight: w, kcal: Math.round(p.baseKcal * r), p: Math.round(p.baseP * r * 10) / 10, f: Math.round(p.baseF * r * 10) / 10, c: Math.round(p.baseC * r * 10) / 10 });
            state.prodSearch = ''; state.inputWeight = ''; state.selectedProdId = '';
            saveState(); render();
        };

        window.delMeal = (id) => { getDayData().meals = getDayData().meals.filter(x => x.id !== id); saveState(); render(); };

        // Custom Wyszukiwarka Treningów
        window.searchWorkout = (val) => {
            state.wSearch = val;
            if (val.trim().length > 0) {
                state.wResults = state.workoutsDb.filter(w => w.name.toLowerCase().includes(val.trim().toLowerCase())).slice(0, 5);
            } else {
                state.wResults = [];
            }
            render();
            setTimeout(() => { const el = document.getElementById('wNameInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectWorkoutDrop = (name) => {
            const w = state.workoutsDb.find(x => x.name === name);
            if (w) {
                state.wSearch = w.name;
                state.wInputTime = w.time;
                state.wInputKcal = w.kcal;
                state.wResults = [];
                render();
            }
        };

        window.addWorkout = () => {
            const name = state.wSearch.trim();
            const time = parseInt(state.wInputTime) || 0;
            const kcal = parseInt(state.wInputKcal) || 0;
            if (!name || !kcal) return alert('Podaj nazwę i spalone kalorie!');
            
            const existing = state.workoutsDb.find(w => w.name.toLowerCase() === name.toLowerCase());
            if (!existing) {
                state.workoutsDb.push({ name, time, kcal });
            }

            getDayData().workouts.push({ id: Date.now(), name, time, kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = [];
            saveState(); render();
        };

        window.delWorkout = (id) => { getDayData().workouts = getDayData().workouts.filter(x => x.id !== id); saveState(); render(); };

        window.saveGoals = () => {
            const kcal = parseFloat(document.getElementById('gKcal').value) || 0;
            const p = parseFloat(document.getElementById('gP').value) || 0;
            const f = parseFloat(document.getElementById('gF').value) || 0;
            const c = parseFloat(document.getElementById('gC').value) || 0;
            state.isEditingGoals = false; getDayData().goals = { kcal, p, f, c };
            saveState(); render();
        };
        window.addProd = () => {
            const name = document.getElementById('pName').value;
            const w = parseFloat(document.getElementById('pW').value) || 100;
            const p = parseFloat(document.getElementById('pP').value) || 0;
            const f = parseFloat(document.getElementById('pF').value) || 0;
            const c = parseFloat(document.getElementById('pC').value) || 0;
            const k = document.getElementById('pK').value;
            const kcal = k !== '' ? parseFloat(k) : Math.round(p*4 + c*4 + f*9);
            if (!name) return alert('Podaj nazwę!');
            state.products.unshift({ id: String(Date.now()), name, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c });
            saveState(); render();
        };

        window.delProd = (id) => { if (confirm('Usunąć?')) { state.products = state.products.filter(x => x.id !== id); saveState(); render(); } };

        window.exportFullJson = () => {
            const payload = { version: 9, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dieta_${state.date}.json`; a.click();
            
            // Zapisz date ostatniego backupu
            state.settings.lastBackup = new Date().toISOString().split('T')[0];
            saveState();
            
            state.statusMsg = 'Pobrano plik!'; render();
        };

        window.importFullJson = () => {
            try {
                const data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    const incoming = data.products || [];
                    const names = new Set(state.products.map(p => p.name.trim().toLowerCase()));
                    let added = 0;
                    incoming.forEach(p => { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = `Wgrano ${added} nowych produktów.`;
                } else {
                    if (!confirm('Nadpisać całą historię?')) return;
                    if (data.products) state.products = data.products;
                    if (data.diaries) state.diaries = data.diaries;
                    if (data.users) state.users = data.users;
                    if (data.settings) state.settings = data.settings;
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    state.statusMsg = 'Kopia wgrana pomyślnie!';
                }
                saveState(); render();
            } catch(e) { alert('Błąd JSON!'); }
        };

        // --- GEMINI AI INTEGRATION ---
        window.toggleChat = () => {
            if(!state.settings.geminiApiKey) {
                alert('Najpierw wklej klucz API z Google AI Studio w zakładce Kopia i Ustawienia!');
                switchTab('kopia');
                return;
            }
            state.chatOpen = !state.chatOpen;
            render();
            if(state.chatOpen) setTimeout(() => document.getElementById('chatInput').focus(), 100);
        };

        window.sendChat = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            state.chatHistory.push({ role: 'user', text: text });
            state.chatLoading = true;
            render();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.settings.geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: "Jesteś polskim asystentem dietetycznym. Oszacuj kalorie i makro posiłku z wiadomości. Odpowiedz krótko i naturalnie. Jeśli to posiłek, ZAWSZE na samym końcu odpowiedzi dodaj formatowany blok kodu w markdown, zawierający wyłącznie JSON. Przykład: ```json\n{\"name\":\"Kebab w tortilli\",\"kcal\":850,\"p\":40,\"f\":45,\"c\":70}\n``` Jeśli to luźna rozmowa, po prostu odpowiedz." }]},
                        contents: state.chatHistory.map(m => ({ role: m.role, parts: [{ text: m.text }] }))
                    })
                });
                
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let botText = data.candidates[0].content.parts[0].text;
                let parsedFood = null;

                // Szukanie bloku JSON w odpowiedzi
                const jsonMatch = botText.match(/```json\n([\s\S]*?)\n```/);
                if(jsonMatch) {
                    try {
                        parsedFood = JSON.parse(jsonMatch[1].trim());
                        botText = botText.replace(jsonMatch[0], ''); // usuń kod JSON z tekstu widocznego
                    } catch(e){}
                }

                state.chatHistory.push({ role: 'model', text: botText.trim(), parsedFood });
            } catch (err) {
                state.chatHistory.push({ role: 'model', text: 'Wystąpił błąd z API: ' + err.message });
            }
            
            state.chatLoading = false;
            render();
        };

        window.addGeminiMeal = (encodedJson) => {
            const food = JSON.parse(decodeURIComponent(encodedJson));
            getDayData().meals.push({ 
                id: Date.now(), name: food.name + " (AI)", 
                weight: 100, kcal: food.kcal, p: food.p, f: food.f, c: food.c 
            });
            saveState();
            state.chatOpen = false;
            render();
        };

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Dziennik Diety</title>
    <!-- Ładowanie Reacta i Tailwind CSS prosto z sieci -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dziennik');
            
            // Ładowanie danych z pamięci przeglądarki (Local Storage)
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('diet_products')) || []);
            const [diary, setDiary] = useState(() => JSON.parse(localStorage.getItem('diet_diary')) || {});
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('diet_settings')) || { startOfWeek: 1 });
            // Historia ostatnich wag dla produktów: { [productId]: ostatniaWaga }
            const [lastWeights, setLastWeights] = useState(() => JSON.parse(localStorage.getItem('diet_last_weights')) || {});
            
            const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);

            // Zapisywanie danych przy każdej zmianie
            useEffect(() => { localStorage.setItem('diet_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('diet_diary', JSON.stringify(diary)); }, [diary]);
            useEffect(() => { localStorage.setItem('diet_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('diet_last_weights', JSON.stringify(lastWeights)); }, [lastWeights]);

            // Bezpieczne pobieranie danych dla bieżącego dnia z domyślnymi celami: 2500 kcal, B:170, T:70, W:220
            const currentDayData = diary[currentDate] || { 
                goals: { kcal: 2500, p: 170, f: 70, c: 220 }, 
                meals: [], 
                workouts: [], 
                weight: '' 
            };

            const updateCurrentDay = (newData) => {
                setDiary(prev => ({ ...prev, [currentDate]: { ...currentDayData, ...newData } }));
            };

            // Licznik dni diety (od pierwszego wpisu do dzisiaj)
            const dietDaysCounter = useMemo(() => {
                const dates = Object.keys(diary).sort();
                if (dates.length === 0) return 0;
                const firstDate = new Date(dates[0]);
                const today = new Date();
                const diffTime = Math.abs(today - firstDate);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            }, [diary]);

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-20">
                    {/* Pasek nawigacji górnej */}
                    <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 class="text-xl font-bold">Dziennik Diety</h1>
                        <span class="text-sm bg-blue-700 px-2 py-1 rounded">Dzień diety: {dietDaysCounter}</span>
                    </div>

                    {/* Główna zawartość */}
                    <div class="p-4">
                        {activeTab === 'dziennik' && (
                            <DailyLog 
                                currentDate={currentDate} 
                                setCurrentDate={setCurrentDate} 
                                currentDayData={currentDayData} 
                                updateCurrentDay={updateCurrentDay} 
                                products={products} 
                                lastWeights={lastWeights}
                                setLastWeights={setLastWeights}
                            />
                        )}
                        {activeTab === 'baza' && <ProductDatabase products={products} setProducts={setProducts} />}
                        {activeTab === 'podsumowanie' && <WeeklySummary diary={diary} currentDate={currentDate} settings={settings} setSettings={setSettings} />}
                    </div>

                    {/* Pasek nawigacji dolnej */}
                    <div class="fixed bottom-0 max-w-md w-full bg-white border-t flex justify-around p-3 text-sm font-semibold text-gray-500 z-10 shadow-lg">
                        <button onClick={() => setActiveTab('dziennik')} class={activeTab === 'dziennik' ? 'text-blue-600 font-bold' : ''}>📅 Dziennik</button>
                        <button onClick={() => setActiveTab('baza')} class={activeTab === 'baza' ? 'text-blue-600 font-bold' : ''}>🍎 Baza Produktów</button>
                        <button onClick={() => setActiveTab('podsumowanie')} class={activeTab === 'podsumowanie' ? 'text-blue-600 font-bold' : ''}>📊 Tydzień</button>
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: Dziennik Dnia ---
        function DailyLog({ currentDate, setCurrentDate, currentDayData, updateCurrentDay, products, lastWeights, setLastWeights }) {
            const [selectedProduct, setSelectedProduct] = useState('');
            const [productWeight, setProductWeight] = useState('');
            const [isEditingGoals, setIsEditingGoals] = useState(false);

            // Stany do edycji celów
            const [goalKcal, setGoalKcal] = useState(currentDayData.goals.kcal);
            const [goalP, setGoalP] = useState(currentDayData.goals.p);
            const [goalF, setGoalF] = useState(currentDayData.goals.f);
            const [goalC, setGoalC] = useState(currentDayData.goals.c);

            // Aktualizacja lokalnych stanów celów przy zmianie dnia
            useEffect(() => {
                setGoalKcal(currentDayData.goals.kcal);
                setGoalP(currentDayData.goals.p);
                setGoalF(currentDayData.goals.f);
                setGoalC(currentDayData.goals.c);
            }, [currentDate, currentDayData.goals]);

            // Kiedy zmienia się wybrany produkt, podpowiadaj ostatnio użytą wagę (lub domyślną z bazy)
            const handleProductChange = (e) => {
                const prodId = e.target.value;
                setSelectedProduct(prodId);
                if (prodId) {
                    const suggestedWeight = lastWeights[prodId] !== undefined ? lastWeights[prodId] : (products.find(p => p.id === prodId)?.weight || 100);
                    setProductWeight(suggestedWeight);
                } else {
                    setProductWeight('');
                }
            };

            const saveGoals = (e) => {
                e.preventDefault();
                updateCurrentDay({
                    goals: {
                        kcal: parseFloat(goalKcal) || 0,
                        p: parseFloat(goalP) || 0,
                        f: parseFloat(goalF) || 0,
                        c: parseFloat(goalC) || 0
                    }
                });
                setIsEditingGoals(false);
            };

            // Obliczenia podsumowania dnia
            const totalEaten = currentDayData.meals.reduce((acc, meal) => {
                acc.kcal += meal.kcal; acc.p += meal.p; acc.f += meal.f; acc.c += meal.c; return acc;
            }, { kcal: 0, p: 0, f: 0, c: 0 });

            const totalBurned = currentDayData.workouts.reduce((acc, w) => acc + w.kcal, 0);
            
            // Bilans z uwzględnieniem treningów
            const kcalLeft = currentDayData.goals.kcal - totalEaten.kcal + totalBurned;

            const addMeal = () => {
                if (!selectedProduct || !productWeight) return alert('Wybierz produkt i podaj wagę!');
                const prod = products.find(p => p.id === selectedProduct);
                if (!prod) return;

                const weightNum = parseFloat(productWeight);
                // Przeliczanie na podstawie wartości per 100g zapisanego w bazie
                const multiplier = weightNum / 100;
                
                const newMeal = {
                    id: Date.now(),
                    name: prod.name,
                    weight: weightNum,
                    kcal: Math.round(prod.kcalPer100 * multiplier),
                    p: Math.round(prod.pPer100 * multiplier * 10) / 10,
                    f: Math.round(prod.fPer100 * multiplier * 10) / 10,
                    c: Math.round(prod.cPer100 * multiplier * 10) / 10
                };
                
                // Zapisz tę wagę jako ostatnio użytą dla tego produktu
                setLastWeights(prev => ({ ...prev, [selectedProduct]: weightNum }));

                updateCurrentDay({ meals: [...currentDayData.meals, newMeal] });
                setProductWeight('');
                setSelectedProduct('');
            };

            const removeMeal = (id) => {
                updateCurrentDay({ meals: currentDayData.meals.filter(m => m.id !== id) });
            };

            const addWorkout = (e) => {
                e.preventDefault();
                const name = e.target.wName.value;
                const time = e.target.wTime.value;
                const kcal = e.target.wKcal.value;
                if(!name || !time || !kcal) return;

                const newWorkout = { id: Date.now(), name, time: parseInt(time), kcal: parseInt(kcal) };
                updateCurrentDay({ workouts: [...currentDayData.workouts, newWorkout] });
                e.target.reset();
            };

            const removeWorkout = (id) => {
                updateCurrentDay({ workouts: currentDayData.workouts.filter(w => w.id !== id) });
            };

            return (
                <div class="space-y-6">
                    {/* Wybór daty i wagi */}
                    <div class="flex space-x-2 items-center justify-between">
                        <input type="date" value={currentDate} onChange={(e) => setCurrentDate(e.target.value)} class="border p-2 rounded flex-1 text-sm font-semibold" />
                        <div class="flex items-center space-x-1">
                            <span class="text-sm text-gray-500">Waga:</span>
                            <input type="number" step="0.1" placeholder="kg" value={currentDayData.weight} onChange={(e) => updateCurrentDay({ weight: e.target.value })} class="border p-2 rounded w-20 text-center font-semibold" />
                        </div>
                    </div>

                    {/* Sekcja Celów Dnia */}
                    <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-blue-900">🎯 Docelowe wartości na dziś:</span>
                            <button onClick={() => setIsEditingGoals(!isEditingGoals)} class="text-xs bg-blue-600 text-white px-2 py-1 rounded font-semibold">
                                {isEditingGoals ? 'Zamknij' : '⚙️ Edytuj cel'}
                            </button>
                        </div>

                        {!isEditingGoals ? (
                            <div class="flex justify-between text-xs text-blue-800 mt-2">
                                <span><b>{currentDayData.goals.kcal}</b> kcal</span>
                                <span>B: <b>{currentDayData.goals.p}g</b></span>
                                <span>T: <b>{currentDayData.goals.f}g</b></span>
                                <span>W: <b>{currentDayData.goals.c}g</b></span>
                            </div>
                        ) : (
                            <form onSubmit={saveGoals} class="mt-3 space-y-2 pt-2 border-t border-blue-200">
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-[10px] text-gray-600">Kalorie (kcal)</label>
                                        <input type="number" value={goalKcal} onChange={e => setGoalKcal(e.target.value)} class="border p-1 rounded w-full text-xs bg-white" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-600">Białko (g)</label>
                                        <input type="number" value={goalP} onChange={e => setGoalP(e.target.value)} class="border p-1 rounded w-full text-xs bg-white" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-600">Tłuszcz (g)</label>
                                        <input type="number" value={goalF} onChange={e => setGoalF(e.target.value)} class="border p-1 rounded w-full text-xs bg-white" />
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-gray-600">Węglowodany (g)</label>
                                        <input type="number" value={goalC} onChange={e => setGoalC(e.target.value)} class="border p-1 rounded w-full text-xs bg-white" />
                                    </div>
                                </div>
                                <button type="submit" class="bg-blue-600 text-white w-full py-1.5 rounded font-bold text-xs mt-1">Zapisz nowe cele</button>
                            </form>
                        )}
                    </div>

                    {/* Pasek postępu (Zjedzone vs Cel) */}
                    <div class="bg-gray-50 p-4 rounded-lg border">
                        <div class="flex justify-between items-end mb-2">
                            <div>
                                <p class="text-xs text-gray-500 uppercase">Zjedzono</p>
                                <p class="text-2xl font-bold">{totalEaten.kcal} <span class="text-sm font-normal text-gray-500">kcal</span></p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-500 uppercase">{kcalLeft >= 0 ? 'Pozostało' : 'Nadwyżka'}</p>
                                <p class={`text-2xl font-bold ${kcalLeft < 0 ? 'text-red-500' : 'text-green-600'}`}>{Math.abs(kcalLeft)} <span class="text-sm font-normal text-gray-500">kcal</span></p>
                            </div>
                        </div>
                        {/* Paski Makro */}
                        <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs">
                            <div class={`p-1.5 rounded font-semibold ${totalEaten.p > currentDayData.goals.p ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'}`}>B: {Math.round(totalEaten.p)} / {currentDayData.goals.p}g</div>
                            <div class={`p-1.5 rounded font-semibold ${totalEaten.f > currentDayData.goals.f ? 'bg-orange-100 text-orange-800' : 'bg-yellow-100 text-yellow-800'}`}>T: {Math.round(totalEaten.f)} / {currentDayData.goals.f}g</div>
                            <div class={`p-1.5 rounded font-semibold ${totalEaten.c > currentDayData.goals.c ? 'bg-orange-100 text-orange-800' : 'bg-green-100 text-green-800'}`}>W: {Math.round(totalEaten.c)} / {currentDayData.goals.c}g</div>
                        </div>
                    </div>

                    {/* Dodawanie posiłku */}
                    <div class="border rounded-lg p-3 bg-white">
                        <h3 class="font-bold mb-2 text-sm">Dodaj produkt z bazy</h3>
                        {products.length === 0 ? (
                            <p class="text-xs text-red-500">Najpierw dodaj przynajmniej jeden produkt w zakładce „Baza Produktów”!</p>
                        ) : (
                            <div class="flex space-x-2">
                                <select value={selectedProduct} onChange={handleProductChange} class="border p-2 rounded flex-1 text-sm">
                                    <option value="">Wybierz produkt...</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name} ({Math.round(p.kcalPer100)} kcal / 100g)</option>)}
                                </select>
                                <input type="number" placeholder="Waga (g)" value={productWeight} onChange={(e) => setProductWeight(e.target.value)} class="border p-2 rounded w-24 text-sm" />
                                <button onClick={addMeal} class="bg-blue-600 text-white px-3 py-2 rounded font-bold text-sm">+</button>
                            </div>
                        )}
                        {/* Lista zjedzonych */}
                        <div class="mt-4 space-y-2">
                            {currentDayData.meals.map(m => (
                                <div key={m.id} class="flex justify-between items-center text-sm border-b pb-2">
                                    <div>
                                        <p class="font-bold">{m.name}</p>
                                        <p class="text-gray-500 text-xs">{m.weight}g | B:{m.p}g T:{m.f}g W:{m.c}g</p>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="font-bold">{m.kcal} kcal</span>
                                        <button onClick={() => removeMeal(m.id)} class="text-red-400 font-bold hover:text-red-600">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Treningi */}
                    <div class="border rounded-lg p-3 bg-white">
                        <h3 class="font-bold mb-2 text-sm text-orange-600">🏋️ Treningi (-{totalBurned} kcal)</h3>
                        <form onSubmit={addWorkout} class="flex space-x-1 mb-3">
                            <input name="wName" placeholder="Nazwa treningu" class="border p-1.5 rounded w-full text-xs" />
                            <input name="wTime" type="number" placeholder="Min" class="border p-1.5 rounded w-16 text-xs" />
                            <input name="wKcal" type="number" placeholder="Kcal" class="border p-1.5 rounded w-16 text-xs" />
                            <button type="submit" class="bg-orange-500 text-white px-3 rounded font-bold">+</button>
                        </form>
                        <div class="space-y-2">
                            {currentDayData.workouts.map(w => (
                                <div key={w.id} class="flex justify-between items-center text-sm text-gray-700 border-b pb-1">
                                    <span><b>{w.name}</b> ({w.time} min)</span>
                                    <div class="flex items-center space-x-3">
                                        <span class="text-orange-600 font-semibold">🔥 {w.kcal} kcal</span>
                                        <button onClick={() => removeWorkout(w.id)} class="text-red-400 font-bold hover:text-red-600 text-xs">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: Baza Produktów ---
        function ProductDatabase({ products, setProducts }) {
            const addProduct = (e) => {
                e.preventDefault();
                const name = e.target.pName.value;
                const totalWeight = parseFlo

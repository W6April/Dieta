        async function executeGeminiFetch(fullModelName, key, promptStr) {

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
            });

            if (res.ok) {
                var data = await res.json();
                return data.candidates[0].content.parts[0].text.trim();
            }
            var errObj = await res.json().catch(function(){ return {}; });

            throw new Error(msg);
        }

        window.callGeminiSmart = async function(promptStr) {

                try {
                    return await executeGeminiFetch(state.workingModelPath, key, promptStr);
                } catch(e) {
                    state.workingModelPath = '';

            var lastError = '';
            var directModels = ['models/gemini-2.5-flash', 'models/gemini-2.0-flash', 'models/gemini-1.5-flash', 'models/gemini-1.5-pro'];
            for (var j = 0; j < directModels.length; j++) {
                try {
                    var rep = await executeGeminiFetch(directModels[j], key, promptStr);
                    if (rep) {
                        state.workingModelPath = directModels[j];
                        localStorage.setItem('diet_working_model_v44', directModels[j]);
                        return rep;
                    }
                } catch(e) {
                    lastError = e.message;
                }
            }

            try {
                var listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key));
                if (listRes.ok) {
                    var listData = await listRes.json();
                    var models = (listData.models || []).filter(function(m) {
                        return m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini');
                    });
                    for (var i = 0; i < models.length; i++) {
                        try {
                            var reply = await executeGeminiFetch(models[i].name, key, promptStr);
                            if (reply) {
                                state.workingModelPath = models[i].name;
                                localStorage.setItem('diet_working_model_v44', models[i].name);
                                return reply;
                            }
                        } catch(err) { lastError = err.message; }
                    }
                }
            } catch(e) { lastError = e.message; }

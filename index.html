        var dzis = new Date().toISOString().split('T')[0];
        window.state = {
            tab: 'dziennik',
            users: [{ id: 'u1', name: 'Ja', startDate: dzis }, { id: 'u2', name: 'Żona', startDate: dzis }],
            userId: localStorage.getItem('diet_v15_curr_user') || 'u1',
            theme: localStorage.getItem('diet_v18_theme') || 'blue', // Motyw graficzny
            products: [], workoutsDb: [], diaries: {}, settings: { startOfWeek: 1, measurements: [ { id: 'waist', name: 'Pas' }, { id: 'biceps', name: 'Biceps' }, { id: 'chest', name: 'Klatka' }, { id: 'thigh', name: 'Udo' } ] },
            date: dzis,
            weekOffset: 0,
            isEditingGoals: false, importMode: 'full', statusMsg: '',
            prodSearch: '', prodResults: [], selectedProdId: '', inputWeight: '',
            wSearch: '', wResults: [], wInputTime: '', wInputKcal: '', editProdId: null,
            isScanning: false
        };

        function initLocalDefaults() {
            FULL_PRODUCTS.forEach(function(bp) {
                if (!state.products.some(function(p) { return p.name.trim().toLowerCase() === bp.name.trim().toLowerCase(); })) {
                    state.products.push(bp);
                }
            });
        }
        initLocalDefaults();

        if (typeof db !== 'undefined') {
            db.collection("dieta").doc("dane_wspolne").onSnapshot(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    if (data.products && data.products.length > 0) { state.products = data.products; initLocalDefaults(); }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.diaries && Object.keys(data.diaries).length > 0) state.diaries = data.diaries;
                    if (data.users) state.users = data.users;
                    if (data.settings) state.settings = data.settings;
                    render();
                }
            }, function(err) { console.log("Błąd chmury:", err); });
        }

        window.saveState = function() {
            if (typeof db !== 'undefined') {
                db.collection("dieta").doc("dane_wspolne").set({
                    products: state.products,
                    workoutsDb: state.workoutsDb,
                    diaries: state.diaries,
                    users: state.users,
                    settings: state.settings
                }).catch(function(e){ console.log("Zapis do chmury nie powiódł się:", e); });
            }
            localStorage.setItem('diet_v15_curr_user', state.userId);
            localStorage.setItem('diet_v18_theme', state.theme);
        };

        window.setTheme = function(th) {
            state.theme = th;
            saveState();
            render();
        };

        window.cloudUploadOnly = function() {
            if (typeof db === 'undefined') return alert('Brak połączenia z Firebase!');
            db.collection("dieta").doc("dane_wspolne").set({
                products: state.products,
                workoutsDb: state.workoutsDb,
                diaries: state.diaries,
                users: state.users,
                settings: state.settings
            }).then(function() {
                state.statusMsg = 'Dane zostały pomyślnie wysłane do chmury!';
                render();
            }).catch(function(err) { alert('Błąd wysyłania: ' + err.message); });
        };

        window.cloudDownloadOnly = function() {
            if (typeof db === 'undefined') return alert('Brak połączenia z Firebase!');
            db.collection("dieta").doc("dane_wspolne").get().then(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    if (data.products && data.products.length > 0) { state.products = data.products; initLocalDefaults(); }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.diaries && Object.keys(data.diaries).length > 0) state.diaries = data.diaries;
                    if (data.users) state.users = data.users;
                    if (data.settings) state.settings = data.settings;
                    state.statusMsg = 'Dane zostały pobrane z chmury!';
                    render();
                } else { alert('Brak danych w chmurze.'); }
            }).catch(function(err) { alert('Błąd pobierania: ' + err.message); });
        };

        window.fetchProductByBarcode = function(barcode) {
            if (!barcode || !barcode.trim()) return alert('Wpisz lub zeskanuj kod kreskowy!');
            var cleanCode = barcode.trim();
            state.statusMsg = 'Szukam produktu w bazie Open Food Facts...';
            render();

            fetch('https://world.openfoodfacts.org/api/v0/product/' + cleanCode + '.json')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.status === 1 && data.product) {
                        var p = data.product;
                        var name = (p.product_name_pl || p.product_name || 'Produkt z kodu') + (p.brands ? ' (' + p.brands + ')' : '');
                        var nut = p.nutriments || {};
                        
                        var kcal = nut['energy-kcal_100g'] || nut['energy-kcal'] || 0;
                        var prot = nut['proteins_100g'] || 0;
                        var fat = nut['fat_100g'] || nut['fat'] || 0;
                        var carb = nut['carbohydrates_100g'] || nut['carbohydrates'] || 0;

                        document.getElementById('pName').value = name;
                        document.getElementById('pW').value = 100;
                        document.getElementById('pK').value = Math.round(kcal);
                        document.getElementById('pP').value = Math.round(prot * 10) / 10;
                        document.getElementById('pF').value = Math.round(fat * 10) / 10;
                        document.getElementById('pC').value = Math.round(carb * 10) / 10;

                        state.statusMsg = 'Znaleziono produkt! Sprawdź dane i zapisz.';
                        render();
                    } else {
                        state.statusMsg = '';
                        alert('Nie znaleziono produktu w darmowej bazie. Wpisz dane ręcznie.');
                        render();
                    }
                })
                .catch(function(err) {
                    state.statusMsg = '';
                    alert('Błąd połączenia z bazą produktów: ' + err.message);
                    render();
                });
        };

        var html5QrCode = null;
        window.startBarcodeScanner = function() {
            state.isScanning = true;
            render();
            setTimeout(function() {
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    function(decodedText, decodedResult) {
                        stopBarcodeScanner();
                        document.getElementById('barcodeInput').value = decodedText;
                        fetchProductByBarcode(decodedText);
                    },
                    function(errorMessage) {}
                ).catch(function(err) {
                    state.isScanning = false;
                    alert('Nie udało się uruchomić aparatu: ' + err);
                    render();
                });
            }, 200);
        };

        window.stopBarcodeScanner = function() {
            if (html5QrCode) {
                html5QrCode.stop().then(function() {
                    html5QrCode.clear();
                    state.isScanning = false;
                    render();
                }).catch(function(err) {
                    state.isScanning = false;
                    render();
                });
            } else {
                state.isScanning = false;
                render();
            }
        };

        window.getDayData = function(customDate) {
            var targetDate = customDate || state.date;
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][targetDate]) {
                state.diaries[state.userId][targetDate] = {
                    goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 },
                    meals: [], workouts: [], weight: '', water: 0, measurements: {}
                };
            }
            var d = state.diaries[state.userId][targetDate];
            if(d.water === undefined) d.water = 0;
            if(!d.measurements) d.measurements = {};
            if(!d.meals) d.meals = [];
            if(!d.workouts) d.workouts = [];
            return d;
        };

        // Automatyczne znajdowanie dnia pierwszego wpisu użytkownika
        window.getDietDaysCounter = function() {
            var userDiary = state.diaries[state.userId] || {};
            var allDates = Object.keys(userDiary).sort();
            var firstActiveDate = null;
            
            for (var i = 0; i < allDates.length; i++) {
                var d = userDiary[allDates[i]];
                if ((d.meals && d.meals.length > 0) || (d.workouts && d.workouts.length > 0) || d.weight || (d.water && d.water > 0)) {
                    firstActiveDate = allDates[i];
                    break;
                }
            }
            if (!firstActiveDate) firstActiveDate = state.date;

            var diff = Math.floor((new Date(state.date) - new Date(firstActiveDate)) / (1000 * 60 * 60 * 24));
            return diff >= 0 ? diff + 1 : 1;
        };

        window.changeDateOffset = function(days) {
            var curr = new Date(state.date);
            curr.setDate(curr.getDate() + days);
            state.date = curr.toISOString().split('T')[0];
            render();
        };

        window.changeWeekOffset = function(val) {
            state.weekOffset += val;
            render();
        };

        window.getWeekDates = function() {
            var curr = new Date(state.date);
            curr.setDate(curr.getDate() + (state.weekOffset * 7));
            var offset = state.settings.startOfWeek === 1 ? (curr.getDay() === 0 ? -6 : 1 - curr.getDay()) : -curr.getDay();
            var firstDay = new Date(curr.setDate(curr.getDate() + offset));
            var weekDates = [];
            for (var i = 0; i < 7; i++) { 
                var n = new Date(firstDay); 
                n.setDate(firstDay.getDate() + i); 
                weekDates.push(n.toISOString().split('T')[0]); 
            }
            return weekDates;
        };

        window.renderWeightChart = function() {
            var userDiary = state.diaries[state.userId] || {};
            var dates = Object.keys(userDiary).sort(function(a,b) { return new Date(a) - new Date(b); });
            var weights = [];
            dates.forEach(function(d) {
                var w = parseFloat(userDiary[d].weight);
                if(w && !isNaN(w)) weights.push({ date: d, val: w });
            });
            var minWGlobal = weights.length ? Math.min.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var maxWGlobal = weights.length ? Math.max.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var last14 = weights.slice(-14);
            
            if(last14.length < 2) return '<div class="text-xs text-gray-400 text-center py-6 border border-dashed border-gray-200 rounded-xl">Dodaj wagę w minimum 2 dniach, aby zobaczyć wykres.</div>';

            var minW = Math.min.apply(null, last14.map(function(w) { return w.val; }));
            var maxW = Math.max.apply(null, last14.map(function(w) { return w.val; }));
            var range = (maxW - minW) || 1;
            var w = 340, h = 100, padX = 20, padY = 20;
            var stepX = (w - padX * 2) / (last14.length - 1);
            
            var points = last14.map(function(pt, i) {
                return (padX + (i * stepX)) + ',' + (h - padY - (((pt.val - minW) / range) * (h - padY * 2)));
            }).join(' ');

            var circles = last14.map(function(pt, i) {
                var x = padX + (i * stepX), y = h - padY - (((pt.val - minW) / range) * (h - padY * 2));
                var label = (i === 0 || i === last14.length - 1) ? '<text x="' + x + '" y="' + (y - 8) + '" font-size="8" font-weight="bold" fill="#4f46e5" text-anchor="middle">' + pt.val + '</text>' : '';
                return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />' + label;
            }).join('');

            return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full h-auto drop-shadow-md bg-white rounded-xl border border-indigo-100 p-2">' +
                '<polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,' + (h-padY) + ' ' + w + ',' + (h-padY) + '" />' +
                '<polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,' + padY + ' ' + w + ',' + padY + '" />' +
                '<polyline fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + points + '" />' +
                circles + '</svg>' +
                '<div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100 px-1">' +
                '<span class="text-[10px] font-bold text-gray-400 uppercase">Min: <span class="text-blue-600 ml-1">' + minWGlobal + ' kg</span></span>' +
                '<span class="text-[10px] font-bold text-gray-400 uppercase">Max: <span class="text-red-500 ml-1">' + maxWGlobal + ' kg</span></span></div>';
        };

        window.render = function() {
            var app = document.getElementById('app');
            var day = getDayData();
            var user = state.users.find(function(u) { return u.id === state.userId; }) || state.users[0];
            var th = THEMES[state.theme] || THEMES.blue;

            var eatenKcal = 0, eatenP = 0, eatenF = 0, eatenC = 0;
            day.meals.forEach(function(m) { eatenKcal += m.kcal; eatenP += m.p; eatenF += m.f; eatenC += m.c; });
            var burned = day.workouts.reduce(function(s, w) { return s + w.kcal; }, 0);
            
            var nettoKcal = Math.max(0, eatenKcal - burned);
            var left = day.goals.kcal - nettoKcal;
            
            var statusLabel = left < 0 ? 'Nadwyżka' : (eatenKcal > day.goals.kcal ? 'Zostało z treningu' : 'Zostało na dziś');
            var statusColor = left < 0 ? 'text-red-500' : (eatenKcal > day.goals.kcal ? 'text-blue-500' : 'text-emerald-500');

                html += '<div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100"><h3 class="font-bold text-sm mb-2">Baza Produktów (' + state.products.length + ')</h3><div class="space-y-2 max-h-[50vh] overflow-y-auto pr-1 pb-4">';
                state.products.forEach(function(p) {
                    html += '<div class="bg-gray-50 border border-gray-100 p-2.5 rounded-lg flex justify-between items-center"><div class="pr-2 min-w-0"><p class="font-bold text-xs text-gray-800 truncate">' + p.name + ' <span class="' + th.accent + ' font-normal">(' + p.baseWeight + 'g)</span></p><p class="text-[9px] text-gray-500 font-bold">B:' + p.baseP + ' | T:' + p.baseF + ' | W:' + p.baseC + '</p></div><div class="flex items-center space-x-3 shrink-0"><span class="font-bold text-emerald-600 text-xs">' + p.baseKcal + ' kcal</span><button onclick="startEditProd(\'' + p.id + '\')" class="text-gray-400 font-bold">✏️</button><button onclick="delProd(\'' + p.id + '\')" class="text-red-300 font-bold">🗑️</button></div></div>';
                });
                html += '</div></div>';

            } else if (state.tab === 'podsumowanie') {
                var weekDates2 = getWeekDates();
                var tKcal = 0, tBurned = 0, dCount = 0, weightsForWeek = [];
                weekDates2.forEach(function(d) {
                    var dObj = state.diaries[state.userId] ? state.diaries[state.userId][d] : null;
                    if (dObj) {
                        var e = (dObj.meals || []).reduce(function(s, m) { return s + m.kcal; }, 0);
                        var b = (dObj.workouts || []).reduce(function(s, w) { return s + w.kcal; }, 0);
                        if (e > 0) { tKcal += e; dCount++; }
                        tBurned += b;
                        if (dObj.weight && !isNaN(parseFloat(dObj.weight))) weightsForWeek.push(parseFloat(dObj.weight));
                    }
                });
                var wDiff = weightsForWeek.length >= 2 ? (weightsForWeek[weightsForWeek.length - 1] - weightsForWeek[0]) : 0;
                var wDiffStr = (wDiff > 0 ? '+' : '') + wDiff.toFixed(1);

                html += '<div class="bg-indigo-50 border border-indigo-200 p-5 rounded-xl text-center mb-4">' +
                    '<h2 class="font-black text-lg text-indigo-900 mb-1">Podsumowanie (' + user.name + ')</h2>' +
                    '<p class="text-[10px] text-indigo-500 font-bold uppercase mb-4">' + weekDates2[0] + ' — ' + weekDates2[6] + '</p>' +
                    '<div class="grid grid-cols-2 gap-3 mb-4">' +
                    '<div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100"><p class="text-[9px] font-bold text-indigo-400 uppercase mb-1">Średnio zjedzono</p><p class="text-2xl font-black text-indigo-600">' + (dCount > 0 ? Math.round(tKcal / dCount) : 0) + ' <span class="text-xs opacity-60">kcal</span></p></div>' +
                    '<div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100"><p class="text-[9px] font-bold text-orange-400 uppercase mb-1">Spalone w tyg.</p><p class="text-2xl font-black text-orange-500">🔥 ' + tBurned + '</p></div></div>' +
                    '<div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100"><p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Zmiana wagi (7 dni)</p><p class="text-3xl font-black ' + (wDiff > 0 ? 'text-red-500' : 'text-emerald-500') + '">' + wDiffStr + ' kg</p></div></div>' +
                    '<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><h3 class="font-black text-sm text-gray-800 mb-3">📈 Wykres Wagi (Ostatnie 14 wpisów)</h3>' + renderWeightChart() + '</div>';

            } else if (state.tab === 'kopia') {
                if (state.statusMsg) html += '<div class="bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold p-3 rounded-xl mb-4 text-center">' + state.statusMsg + '</div>';
                
                // SEKCJA WYBORU MOTYWU GRAFICZNEGO
                html += '<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">' +
                    '<h3 class="font-black text-gray-800 mb-3 text-sm">🎨 Motyw Graficzny Aplikacji</h3>' +
                    '<div class="grid grid-cols-1 gap-2">';
                
                Object.keys(THEMES).forEach(function(key) {
                    var t = THEMES[key];
                    var isSelected = state.theme === key;
                    var borderCls = isSelected ? 'border-2 border-blue-600 bg-blue-50/50' : 'border border-gray-200 bg-gray-50';
                    html += '<div onclick="setTheme(\'' + key + '\')" class="p-3 rounded-xl cursor-pointer flex justify-between items-center ' + borderCls + '">' +
                        '<span class="text-xs font-bold text-gray-800">' + t.name + '</span>' +
                        '<div class="w-5 h-5 rounded-full ' + t.header + ' flex items-center justify-center text-white text-[10px]">' + (isSelected ? '✓' : '') + '</div>' +
                        '</div>';
                });
                html += '</div></div>';

                html += '<div class="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-4">' +
                    '<h3 class="font-black text-blue-900 mb-2 text-sm text-center">☁️ Synchronizacja z Chmurą</h3>' +
                    '<div class="grid grid-cols-2 gap-2">' +
                    '<button onclick="cloudUploadOnly()" class="' + th.btn + ' font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬆️ Wyślij dane</button>' +
                    '<button onclick="cloudDownloadOnly()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬇️ Pobierz dane</button>' +
                    '</div></div>';

                html += '<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4"><h3 class="font-black text-gray-800 mb-3 text-sm">👤 Ustawienia Profili</h3><div class="space-y-3 mb-4">';
                state.users.forEach(function(u, i) {
                    html += '<div><label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Imię Profilu ' + (i+1) + '</label><input type="text" value="' + u.name + '" onchange="changeUserName(\'' + u.id + '\', this.value)" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold outline-none" /></div>';
                });
                html += '</div><div><label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Pierwszy dzień tyg. statystyk</label><select onchange="changeStartOfWeek(this.value)" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold outline-none"><option value="1" ' + (state.settings.startOfWeek === 1 ? 'selected' : '') + '>Poniedziałek</option><option value="0" ' + (state.settings.startOfWeek === 0 ? 'selected' : '') + '>Niedziela</option></select></div></div>';

                html += '<div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center mb-4"><h3 class="font-black text-gray-800 mb-2 text-sm">💾 Kopia Zapasowa Danych</h3><div class="space-y-3 mt-4">' +
                    '<button onclick="exportFullJson()" class="w-full ' + th.btn + ' font-bold py-3 rounded-xl shadow-md text-xs">📥 Pobierz wszystko do pliku (.json)</button>' +
                    '<div class="text-left space-y-2 my-2 bg-gray-50 p-2 rounded-lg border border-gray-200">' +
                    '<label class="flex items-center space-x-2 text-[10px] font-bold text-gray-700"><input type="radio" name="impMode" value="products" ' + (state.importMode === 'products' ? 'checked' : '') + ' onchange="state.importMode=\'products\'" /><span>Tylko dodaj nowe produkty</span></label>' +
                    '<label class="flex items-center space-x-2 text-[10px] font-bold text-gray-700"><input type="radio" name="impMode" value="full" ' + (state.importMode === 'full' ? 'checked' : '') + ' onchange="state.importMode=\'full\'" /><span>Pełna kopia (nadpisuje wszystko)</span></label></div>' +
                    '<textarea id="jsonArea" rows="3" placeholder="Wklej skopiowany kod JSON..." class="w-full p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs outline-none"></textarea>' +
                    '<button onclick="importFullJson()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-xs">📤 Wgraj kod JSON</button></div></div>';

                html += '<div class="bg-gray-50 border border-gray-200 p-4 rounded-xl text-center mb-6">' +
                    '<h4 class="font-black text-xs text-gray-700 uppercase mb-1">ℹ️ Informacje o aplikacji</h4>' +
                    '<p class="text-xs font-bold ' + th.accent + '">Wersja: v18 (Motywy i Bilans Tygodnia)</p>' +
                    '<p class="text-[10px] text-gray-500 mt-1">Ostatnia aktualizacja: 25.02.2026, 12:10</p>' +
                    '</div>';
            }

            var tabs = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
            var icons = ['📅','🍎','💪','📊','⚙️'];
            var labels = ['Dziennik','Baza','Ciało','Tydzień','Ustaw.'];
            html += '</div><div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur border-t border-gray-200 grid grid-cols-5 p-1 z-50">';
            tabs.forEach(function(t, idx) {
                var col = state.tab === t ? th.tabActive : 'text-gray-400';
                html += '<button onclick="switchTab(\'' + t + '\')" class="flex flex-col items-center justify-center p-1.5 rounded-lg min-w-0 ' + col + '"><span class="text-xl mb-0.5">' + icons[idx] + '</span><span class="text-[9px] font-bold truncate w-full text-center">' + labels[idx] + '</span></button>';
            });
            html += '</div>';
            app.innerHTML = html;
        };

        window.switchTab = function(t) { 
            if (state.tab === 'baza' && t !== 'baza' && state.isScanning) {
                stopBarcodeScanner();
            }
            state.tab = t; state.statusMsg = ''; state.prodResults = []; state.wResults = []; render(); 
        };
        window.switchUser = function(u) { state.userId = u; saveState(); render(); };
        window.changeDate = function(d) { state.date = d; render(); };
        window.changeWeight = function(w) { getDayData().weight = w; saveState(); };
        window.toggleGoals = function() { state.isEditingGoals = !state.isEditingGoals; render(); };
        window.changeStartOfWeek = function(val) { state.settings.startOfWeek = parseInt(val); saveState(); render(); };
        window.addWater = function(amount) { if (amount === 0) getDayData().water = 0; else getDayData().water = (parseFloat(getDayData().water) || 0) + amount; saveState(); render(); };
        window.updateMeasurement = function(id, val) { getDayData().measurements[id] = val; saveState(); };
        window.promptAddMeasurement = function() { var name = prompt('Podaj nazwę nowego pomiaru (np. Łydka):'); if(name && name.trim()) { state.settings.measurements.push({ id: 'm_' + Date.now(), name: name.trim() }); saveState(); render(); } };
        window.removeMeasurement = function(id) { if(confirm('Usunąć ten pomiar?')) { state.settings.measurements = state.settings.measurements.filter(function(m) { return m.id !== id; }); saveState(); render(); } };
        window.changeUserName = function(id, newName) { var u = state.users.find(function(x) { return x.id === id; }); if (u && newName.trim()) { u.name = newName.trim(); saveState(); render(); } };

        window.searchProd = function(val) {
            state.prodSearch = val;
            if (val.trim().length > 0) state.prodResults = state.products.filter(function(p) { return p.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 15);
            else state.prodResults = [];
            render(); setTimeout(function() { var el = document.getElementById('pSearchInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectProdDrop = function(id) {
            var p = state.products.find(function(x) { return x.id === id; });
            if (p) { state.selectedProdId = id; state.prodSearch = p.name; state.inputWeight = p.baseWeight; state.prodResults = []; render(); }
        };

        window.addMeal = function() {
            var p = state.products.find(function(x) { return x.id === state.selectedProdId; }) || state.products.find(function(x) { return x.name.toLowerCase() === state.prodSearch.trim().toLowerCase(); });
            var w = parseFloat(state.inputWeight);
            if (!p || !w) return alert('Wybierz produkt z podpowiedzi i podaj wagę!');
            var r = w / p.baseWeight;
            getDayData().meals.push({ id: Date.now(), name: p.name, weight: w, kcal: Math.round(p.baseKcal * r), p: Math.round(p.baseP * r * 10) / 10, f: Math.round(p.baseF * r * 10) / 10, c: Math.round(p.baseC * r * 10) / 10 });
            state.prodSearch = ''; state.inputWeight = ''; state.selectedProdId = ''; saveState(); render();
        };

        window.delMeal = function(id) { getDayData().meals = getDayData().meals.filter(function(x) { return x.id !== id; }); saveState(); render(); };

        window.searchWorkout = function(val) {
            state.wSearch = val;
            if (val.trim().length > 0) state.wResults = state.workoutsDb.filter(function(w) { return w.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 5);
            else state.wResults = [];
            render(); setTimeout(function() { var el = document.getElementById('wNameInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectWorkoutDrop = function(name) {
            var w = state.workoutsDb.find(function(x) { return x.name === name; });
            if (w) { state.wSearch = w.name; state.wInputTime = w.time; state.wInputKcal = w.kcal; state.wResults = []; render(); }
        };

        window.addWorkout = function() {
            var name = state.wSearch.trim(), time = parseInt(state.wInputTime) || 0, kcal = parseInt(state.wInputKcal) || 0;
            if (!name || !kcal) return alert('Podaj nazwę i spalone kalorie!');
            if (!state.workoutsDb.find(function(w) { return w.name.toLowerCase() === name.toLowerCase(); })) state.workoutsDb.push({ name: name, time: time, kcal: kcal });
            getDayData().workouts.push({ id: Date.now(), name: name, time: time, kcal: kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = []; saveState(); render();
        };

        window.delWorkout = function(id) { getDayData().workouts = getDayData().workouts.filter(function(x) { return x.id !== id; }); saveState(); render(); };
        
        window.saveGoals = function() {
            state.isEditingGoals = false; 
            getDayData().goals = { kcal: parseFloat(document.getElementById('gKcal').value) || 0, p: parseFloat(document.getElementById('gP').value) || 0, f: parseFloat(document.getElementById('gF').value) || 0, c: parseFloat(document.getElementById('gC').value) || 0 }; 
            saveState(); render();
        };

        window.startEditProd = function(id) { state.editProdId = id; render(); setTimeout(function() { document.getElementById('prodForm').scrollIntoView({behavior: 'smooth'}); }, 100); };
        window.cancelEditProd = function() { state.editProdId = null; render(); };

        window.addProd = function() {
            var name = document.getElementById('pName').value.trim();
            var w = parseFloat(document.getElementById('pW').value) || 100, p = parseFloat(document.getElementById('pP').value) || 0, f = parseFloat(document.getElementById('pF').value) || 0, c = parseFloat(document.getElementById('pC').value) || 0;
            var kcal = document.getElementById('pK').value !== '' ? parseFloat(document.getElementById('pK').value) : Math.round(p*4 + c*4 + f*9);
            if (!name) return alert('Podaj nazwę!');
            if(state.editProdId) {
                var prod = state.products.find(function(x) { return x.id === state.editProdId; });
                if(prod) { prod.name = name; prod.baseWeight = w; prod.baseKcal = kcal; prod.baseP = p; prod.baseF = f; prod.baseC = c; }
                state.editProdId = null;
            } else { state.products.unshift({ id: String(Date.now()), name: name, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c }); }
            saveState(); render();
        };

        window.delProd = function(id) { if (confirm('Usunąć ten produkt z bazy?')) { state.products = state.products.filter(function(x) { return x.id !== id; }); saveState(); render(); } };

        window.exportFullJson = function() {
            var payload = { version: 18, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, theme: state.theme };
            var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = 'dieta_' + state.date + '.json'; a.click();
            state.settings.lastBackup = new Date().toISOString().split('T')[0]; saveState(); state.statusMsg = 'Pobrano plik kopii zapasowej!'; render();
        };

        window.importFullJson = function() {
            try {
                var data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    var names = new Set(state.products.map(function(p) { return p.name.trim().toLowerCase(); })); var added = 0;
                    (data.products || []).forEach(function(p) { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = 'Wgrano ' + added + ' nowych produktów.';
                } else {
                    if (!confirm('Nadpisać całą historię?')) return;
                    if (data.products) state.products = data.products; 
                    if (data.diaries) state.diaries = data.diaries;
                    if (data.users) state.users = data.users; 
                    if (data.settings) state.settings = data.settings; 
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.theme) state.theme = data.theme;
                    state.statusMsg = 'Kopia wgrana pomyślnie!';
                }
                saveState(); 
                render();
            } catch(e) { alert('Błąd odczytu JSON!'); }
        };

        var touchStartX = 0;
        var touchEndX = 0;
        var tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];

        window.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, false);

        function handleSwipeGesture() {
            var threshold = 70;
            if (touchEndX < touchStartX - threshold) {
                var idx = tabsOrder.indexOf(state.tab);
                if (idx < tabsOrder.length - 1) { switchTab(tabsOrder[idx + 1]); }
            }
            if (touchEndX > touchStartX + threshold) {
                var idx = tabsOrder.indexOf(state.tab);
                if (idx > 0) { switchTab(tabsOrder[idx - 1]); }
            }
        }

        render();
    </script>
</body>
</html>

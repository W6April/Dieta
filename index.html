        async function executeGeminiFetch(fullModelName, key, promptStr) {
            var path = fullModelName.startsWith('models/') ? fullModelName : ('models/' + fullModelName);
            var url = 'https://generativelanguage.googleapis.com/v1beta/' + path + ':generateContent';

            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
            });

            if (res.ok) {
                var data = await res.json();
                return data.candidates[0].content.parts[0].text.trim();
            }

            if (res.status === 401 || res.status === 403) {
                var resB = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                if (resB.ok) {
                    var dataB = await resB.json();
                    return dataB.candidates[0].content.parts[0].text.trim();
                }
            }
            
            var errObj = await res.json().catch(function(){ return {}; });
            var msg = (errObj.error && errObj.error.message) ? errObj.error.message : ('Status ' + res.status);
            throw new Error(msg);
        }

        window.callGeminiSmart = async function(promptStr) {
            var key = state.geminiApiKey.trim();
            if (!key) throw new Error('Wklej klucz API w zakładce Ustawienia!');

            if (state.workingModelPath) {
                try {
                    return await executeGeminiFetch(state.workingModelPath, key, promptStr);
                } catch(e) {
                    state.workingModelPath = '';
                }
            }

            var lastError = '';
            try {
                var listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
                    method: 'GET',
                    headers: { 'x-goog-api-key': key }
                });
                
                if (listRes.ok) {
                    var listData = await listRes.json();
                    var models = listData.models || [];
                    var supported = models.filter(function(m) {
                        return m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini');
                    });

                    supported.sort(function(a, b) {
                        var aFlash = a.name.includes('flash') ? 0 : 1;
                        var bFlash = b.name.includes('flash') ? 0 : 1;
                        return aFlash - bFlash;
                    });

                    for (var i = 0; i < supported.length; i++) {
                        try {
                            var candidateName = supported[i].name;
                            var reply = await executeGeminiFetch(candidateName, key, promptStr);
                            if (reply) {
                                state.workingModelPath = candidateName;
                                localStorage.setItem('diet_working_model_v44', candidateName);
                                return reply;
                            }
                        } catch(err) {
                            lastError = err.message;
                        }
                    }
                }
            } catch(e) {
                lastError = e.message;
            }

            var directModels = ['models/gemini-2.5-flash', 'models/gemini-2.0-flash', 'models/gemini-1.5-flash-latest'];
            for (var j = 0; j < directModels.length; j++) {
                try {
                    var rep = await executeGeminiFetch(directModels[j], key, promptStr);
                    if (rep) {
                        state.workingModelPath = directModels[j];
                        localStorage.setItem('diet_working_model_v44', directModels[j]);
                        return rep;
                    }
                } catch(e) {
                    lastError = e.message;
                }
            }

            throw new Error(lastError || 'Nie udało się połączyć z AI.');
        };

        window.fetchProductByBarcode = async function(barcode) {
            var codeToSearch = barcode || state.scannedBarcodeInput || '';
            var inpElem = document.getElementById('barcodeInput');
            if (!codeToSearch && inpElem) codeToSearch = inpElem.value;

            if (!codeToSearch || !String(codeToSearch).trim()) {
                return alert('Wpisz lub zeskanuj kod kreskowy!');
            }
            var cleanCode = String(codeToSearch).trim();
            state.scannedBarcodeInput = cleanCode;
            state.statusMsg = '⏳ Szukam w darmowej bazie (kod: ' + cleanCode + ')...';
            state.scannedProductData = null;
            render();

            try {
                var response = await fetch('[https://pl.openfoodfacts.org/api/v0/product/](https://pl.openfoodfacts.org/api/v0/product/)' + encodeURIComponent(cleanCode) + '.json');
                var data = await response.json();

                if (data && data.status === 1 && data.product) {
                    var p = data.product;
                    var name = (p.product_name_pl || p.product_name || 'Produkt z kodu') + (p.brands ? ' (' + p.brands + ')' : '');
                    var nut = p.nutriments || {};
                    var kcal100 = parseFloat(nut['energy-kcal_100g'] || nut['energy-kcal']) || 0;
                    var prot100 = parseFloat(nut['proteins_100g']) || 0;
                    var fat100 = parseFloat(nut['fat_100g']) || 0;
                    var carb100 = parseFloat(nut['carbohydrates_100g']) || 0;

                    var pkgWeight = 100;
                    var rawQty = p.quantity || p.product_quantity || '';
                    var match = String(rawQty).match(/(\d+)\s*(g|ml)/i);
                    if (match && match[1]) {
                        pkgWeight = parseInt(match[1]);
                    } else if (kcal100 > 0) {
                        var kcalTotal = parseFloat(nut['energy-kcal']) || 0;
                        if (kcalTotal > 0 && kcalTotal !== kcal100) pkgWeight = Math.round((kcalTotal / kcal100) * 100);
                    }

                    var ratio = pkgWeight / 100;
                    var totalKcal = Math.round(kcal100 * ratio);
                    var totalProt = Math.round((prot100 * ratio) * 10) / 10;
                    var totalFat = Math.round((fat100 * ratio) * 10) / 10;
                    var totalCarb = Math.round((carb100 * ratio) * 10) / 10;

                    state.scannedProductData = { name: name, baseWeight: pkgWeight, baseKcal: totalKcal, baseP: totalProt, baseF: totalFat, baseC: totalCarb, addWeight: pkgWeight, category: "Gotowe Posiłki" };
                    state.statusMsg = '✅ Zeskanowano pomyślnie!';
                    render();
                    return;
                }
            } catch(e) {}

            if (state.geminiApiKey) {
                var prodName = prompt("Baza darmowa nie rozpoznała kodu " + cleanCode + ".\n\nWpisz nazwę tego produktu (np. 'Jogurt naturalny Zott'), a asystent AI oszacuje jego skład i dołączy do zeskanowanego kodu:");
                
                if (prodName && prodName.trim()) {

                    try {
                        var promptStr = 'Oszacuj wartości odżywcze dla produktu o nazwie: "' + prodName.trim() + '". Zwróć odpowiedź WYŁĄCZNIE w formacie JSON bez znaczników markdown: {"name": "' + prodName.trim() + '", "weight": 100, "kcal": 100, "p": 5.0, "f": 2.0, "c": 15.0}. Załóż standardową porcję lub domyślnie 100g, jeśli nie masz pewności.';
                        var aiResponse = await callGeminiSmart(promptStr);

                        var aiParsed = JSON.parse(aiResponse);

                            '<span class="text-[10px] font-black ' + th.accent + ' px-2 py-1 uppercase text-center leading-tight">' + periodLabel + '</span>' +
                            '<button onclick="state.summaryOffset+=1; render();" class="' + th.inputBg + ' border px-3 py-1.5 rounded-lg text-xs font-black">Dalej ▶</button>' +
                            '</div>';
                    } else {
                        html += '<div class="' + th.card + ' p-2.5 rounded-xl border flex items-center justify-center mb-4">' +
                            '<span class="text-[10px] font-black ' + th.accent + ' uppercase">' + periodLabel + '</span>' +
                            '</div>';
                    }

                    html += '<div class="' + th.softBox + ' border p-4 rounded-xl mb-4">' +
                        '<h3 class="font-black text-base mb-3 text-center">📊 Statystyki z ' + dCount + ' dni</h3>' +
                        '<div class="grid grid-cols-2 gap-2 mb-3">' +
                        '<div class="' + th.card + ' p-3 rounded-xl border text-center"><p class="text-[9px] font-bold opacity-60 uppercase mb-1">Średnio Kcal/dzień</p><p class="text-xl font-black ' + th.accent + '">' + (dCount > 0 ? Math.round(tKcal / dCount) : 0) + '</p></div>' +
                        '<div class="' + th.card + ' p-3 rounded-xl border text-center"><p class="text-[9px] font-bold text-orange-500 uppercase mb-1">Spalone w sumie</p><p class="text-xl font-black text-orange-500">🔥 ' + tBurned + '</p></div>' +
                        '</div>' +
                        '<div class="' + th.inputBg + ' p-3 rounded-xl border grid grid-cols-3 gap-1 text-center mb-3 shadow-inner">' +
                        '<div><p class="text-[9px] font-bold opacity-60 uppercase">Śr. Białko</p><p class="font-black text-sm text-blue-600">' + (dCount > 0 ? Math.round(tP / dCount) : 0) + 'g</p></div>' +
                        '<div><p class="text-[9px] font-bold opacity-60 uppercase">Śr. Tłuszcz</p><p class="font-black text-sm text-amber-600">' + (dCount > 0 ? Math.round(tF / dCount) : 0) + 'g</p></div>' +
                        '<div><p class="text-[9px] font-bold opacity-60 uppercase">Śr. Węglo</p><p class="font-black text-sm text-emerald-600">' + (dCount > 0 ? Math.round(tC / dCount) : 0) + 'g</p></div>' +
                        '</div>' +
                        '<div class="' + th.card + ' p-3 rounded-xl border flex justify-between items-center shadow-inner mb-3">' +
                        '<div><span class="text-[10px] font-bold opacity-75 uppercase block">Bilans względem zera:</span>' +
                        '<span class="text-[9px] opacity-60">Całkowity deficyt/nadwyżka w okresie</span></div>' +
                        '<span class="text-lg font-black ' + (balanceVsZero <= 0 ? 'text-emerald-500' : 'text-rose-500') + '">' + 
                        (balanceVsZero > 0 ? '+' + Math.round(balanceVsZero) : Math.round(balanceVsZero)) + ' kcal</span></div>' +
                        '<div class="' + th.inputBg + ' p-4 rounded-xl border flex justify-between items-center"><p class="text-[10px] font-bold opacity-60 uppercase">Zmiana wagi w okresie:</p><p class="text-2xl font-black ' + (wDiff > 0 ? 'text-rose-500' : 'text-emerald-500') + '">' + wDiffStr + ' kg</p></div>' +
                        '</div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border"><h3 class="font-black text-sm mb-3">📈 Wykres Wagi (Ostatnie 14 wpisów)</h3>' + renderWeightChart() + '</div>';

                } else if (state.tab === 'kopia') {
                    if (state.statusMsg) html += '<div class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-700 text-xs font-bold p-3 rounded-xl mb-4 text-center">' + state.statusMsg + '</div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4"><h3 class="font-black mb-3 text-sm">👤 Zarządzanie Profilami</h3>' +
                        '<div class="flex space-x-2 p-1.5 rounded-lg">';
                    var profileColors = ['from-blue-500 to-indigo-500', 'from-emerald-400 to-teal-500', 'from-orange-400 to-rose-400', 'from-purple-500 to-fuchsia-500'];
                    state.users.forEach(function(u, idx) {
                        var bgClass = profileColors[idx % profileColors.length];
                        var activeCls = (state.userId === u.id) ? 'bg-gradient-to-r ' + bgClass + ' text-white ring-2 ring-offset-2 ring-blue-400 shadow-md scale-105' : 'bg-gray-200 text-gray-700 hover:bg-gray-300 border border-gray-300';
                        html += '<button onclick="switchUser(\'' + u.id + '\')" oncontextmenu="event.preventDefault(); promptRenameUser(\'' + u.id + '\');" ontouchstart="window.ptimer'+idx+'=setTimeout(function(){ promptRenameUser(\'' + u.id + '\'); }, 600);" ontouchend="clearTimeout(window.ptimer'+idx+');" onmousedown="window.ptimer'+idx+'=setTimeout(function(){ promptRenameUser(\'' + u.id + '\'); }, 600);" onmouseup="clearTimeout(window.ptimer'+idx+');" class="flex-1 py-2 rounded-xl text-xs font-black transition-all truncate ' + activeCls + '">' + u.name + '</button>';
                    });
                    html += '</div><p class="text-[9px] opacity-60 text-center mt-2 font-medium">💡 Przytrzymaj palec na profilu, aby zmienić jego imię.</p></div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4"><h3 class="font-black mb-3 text-sm">🎯 Cel Dzienny (' + user.name + ')</h3>';
                    html += '<div class="grid grid-cols-2 gap-3 mb-2">' +
                        '<div><label class="text-[10px] font-bold opacity-80 block mb-1">Kcal (limit)</label><input type="number" value="' + day.goals.kcal + '" onchange="updateGoal(\'kcal\', this.value)" class="w-full p-2 text-xs rounded-lg border font-bold text-center ' + th.inputBg + '" /></div>' +
                        '<div><label class="text-[10px] font-bold opacity-80 block mb-1">Białko (g)</label><input type="number" value="' + day.goals.p + '" onchange="updateGoal(\'p\', this.value)" class="w-full p-2 text-xs rounded-lg border font-bold text-center ' + th.inputBg + '" /></div>' +
                        '<div><label class="text-[10px] font-bold opacity-80 block mb-1">Tłuszcz (g)</label><input type="number" value="' + day.goals.f + '" onchange="updateGoal(\'f\', this.value)" class="w-full p-2 text-xs rounded-lg border font-bold text-center ' + th.inputBg + '" /></div>' +
                        '<div><label class="text-[10px] font-bold opacity-80 block mb-1">Węglo (g)</label><input type="number" value="' + day.goals.c + '" onchange="updateGoal(\'c\', this.value)" class="w-full p-2 text-xs rounded-lg border font-bold text-center ' + th.inputBg + '" /></div>' +
                        '</div></div>';

                    html += '<div class="bg-amber-50 border-2 border-amber-300 text-amber-950 p-4 rounded-xl mb-4 shadow-sm">' +
                        '<h3 class="font-black mb-1 text-sm text-center">🛡️ Tarcza Danych i Odzyskiwanie</h3>' +
                        '<p class="text-[10px] opacity-80 mb-3 text-center">Ochrona przed nadpisaniem chmury jest <b>AKTYWNA</b>. Jeśli dane zniknęły, użyj poniższych opcji ratunkowych:</p>' +
                        '<div class="grid grid-cols-1 gap-2">' +
                        '<button onclick="restoreLastAutoBackup()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl shadow text-xs">🚑 Przywróć ostatni stan przed zapisem</button>' +
                        '<button onclick="scanPhoneMemoryForHistory()" class="w-full bg-white border border-amber-400 text-amber-900 font-bold py-2 rounded-xl text-xs">🔍 Skanuj pamięć telefonu</button>' +
                        '</div></div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4">' +
                        '<h3 class="font-black mb-2 text-sm text-center">🧠 Konfiguracja AI (Gemini)</h3>' +
                        '<p class="text-[10px] text-gray-500 mb-3 text-center">Wklej swój klucz API (`AQ...`) pobrany z <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-500 underline font-bold">Google AI Studio</a>.</p>' +
                        '<input type="password" id="aiKeyInput" placeholder="AQ... lub AIzaSy..." value="' + state.geminiApiKey + '" class="w-full p-2.5 ' + th.inputBg + ' border rounded-lg text-xs font-medium outline-none mb-2 text-center" />' +
                        '<div class="grid grid-cols-2 gap-2">' +
                        '<button onclick="saveGeminiKey(document.getElementById(\'aiKeyInput\').value)" class="w-full ' + th.btn + ' font-bold py-2.5 rounded-xl shadow-md text-xs">💾 Zapisz klucz</button>' +
                        '<button onclick="testGeminiConnection()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl shadow-md text-xs">⚡ Podłącz i Testuj AI</button>' +
                        '</div></div>';

                    html += '<div class="' + th.softBox + ' border p-4 rounded-xl mb-4">' +
                        '<h3 class="font-black mb-2 text-sm text-center">☁️ Synchronizacja z Chmurą</h3>' +
                        '<div class="grid grid-cols-2 gap-2">' +
                        '<button onclick="cloudUploadOnly()" class="' + th.btn + ' font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬆️ Wyślij (Bezpiecznie)</button>' +
                        '<button onclick="cloudDownloadOnly()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬇️ Pobierz i Połącz</button>' +
                        '</div></div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4"><div><label class="text-[10px] font-bold opacity-60 uppercase block mb-1">Pierwszy dzień tyg. statystyk</label><select onchange="changeStartOfWeek(this.value)" class="w-full p-2 ' + th.inputBg + ' border rounded-lg text-xs font-bold outline-none"><option value="1" ' + (state.settings.startOfWeek === 1 ? 'selected' : '') + '>Poniedziałek</option><option value="0" ' + (state.settings.startOfWeek === 0 ? 'selected' : '') + '>Niedziela</option></select></div></div>';

                    html += '<div class="' + th.card + ' p-5 rounded-xl border text-center mb-4"><h3 class="font-black mb-2 text-sm">💾 Kopia Zapasowa Danych</h3><div class="space-y-3 mt-4">' +
                        '<button onclick="exportFullJson()" class="w-full ' + th.btn + ' font-bold py-3 rounded-xl shadow-md text-xs">📥 Pobierz wszystko do pliku (.json)</button>' +
                        '<div class="text-left space-y-2 my-2 ' + th.inputBg + ' p-2 rounded-lg border">' +
                        '<label class="flex items-center space-x-2 text-[10px] font-bold"><input type="radio" name="impMode" value="products" ' + (state.importMode === 'products' ? 'checked' : '') + ' onchange="state.importMode=\'products\'" /><span>Tylko dodaj nowe produkty</span></label>' +
                        '<label class="flex items-center space-x-2 text-[10px] font-bold"><input type="radio" name="impMode" value="full" ' + (state.importMode === 'full' ? 'checked' : '') + ' onchange="state.importMode=\'full\'" /><span>Pełna kopia (bezpiecznie łączy historię)</span></label></div>' +
                        '<textarea id="jsonArea" rows="3" placeholder="Wklej skopiowany kod JSON..." class="w-full p-2 ' + th.inputBg + ' border rounded-xl text-xs outline-none"></textarea>' +
                        '<button onclick="importFullJson()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-xs">📤 Wgraj kod JSON</button></div></div>';

                    html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4">' +
                        '<h3 class="font-black mb-3 text-sm text-center">🎨 Wybierz Szatę Graficzną</h3>' +
                        '<div class="grid grid-cols-1 gap-2">';
                    
                    Object.keys(THEMES).forEach(function(key) {
                        var t = THEMES[key];
                        var isSelected = state.theme === key;
                        var borderCls = isSelected ? 'border-2 border-pink-500 ring-2 ring-pink-300/50' : 'border opacity-85';
                        html += '<div onclick="setTheme(\'' + key + '\')" class="p-3 rounded-xl cursor-pointer flex justify-between items-center transition-all ' + th.inputBg + ' ' + borderCls + '">' +
                            '<span class="text-xs font-bold">' + t.name + '</span>' +
                            '<div class="w-6 h-6 rounded-full ' + t.header + ' flex items-center justify-center text-white text-xs shadow">' + (isSelected ? '✓' : '') + '</div>' +
                            '</div>';
                    });
                    html += '</div></div>';

                    html += '<div class="' + th.card + ' border p-4 rounded-xl text-center mb-6">' +
                        '<h4 class="font-black text-xs opacity-70 uppercase mb-1">ℹ️ Informacje o aplikacji</h4>' +
                        '<p class="text-xs font-bold ' + th.accent + '">Wersja: v69 (Pełna Baza 45 Produktów + Nudzące się Awatary)</p>' +
                        '<p class="text-[10px] opacity-60 mt-1">Ostatnia aktualizacja: 28.10.2026</p>' +
                        '</div>';
                }

                // RENDEROWANIE DRZEWKA KATEGORII (MODAL)
                if (state.catModalOpen) {
                    html += '<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end justify-center pb-6 px-2">' +
                            '<div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-[slideUp_0.2s_ease-out]">' +
                            '<div class="p-4 bg-gray-50 border-b flex justify-between items-center"><h3 class="font-black text-sm text-blue-900">🗂️ Wybierz kategorię</h3><button onclick="closeCatModal()" class="text-gray-400 hover:text-rose-500 font-black text-lg w-8 h-8 flex justify-center items-center">✕</button></div>' +
                            '<div class="max-h-[60vh] overflow-y-auto p-3 space-y-1">';
                    
                    var allCats = state.settings.categories || DEFAULT_CATEGORIES;
                    allCats.forEach(function(c) {
                        var count = state.products.filter(function(p) { return (p.category || 'Inne') === c; }).length;
                        html += '<button onclick="moveToCategory(\'' + c + '\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 border border-transparent hover:border-blue-200 transition-colors flex justify-between items-center"><span>📂 ' + c + '</span> <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + count + '</span></button>';
                    });
                    
                    var inCount = state.products.filter(function(p) { return (p.category || 'Inne') === 'Inne'; }).length;
                    html += '<button onclick="moveToCategory(\'Inne\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 border border-transparent hover:border-blue-200 transition-colors flex justify-between items-center"><span>📂 Inne (Niesklasyfikowane)</span> <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + inCount + '</span></button>';
                    
                    html += '<button onclick="addNewCategoryFromModal()" class="w-full mt-3 bg-blue-100 text-blue-700 hover:bg-blue-200 font-black p-3.5 rounded-xl text-xs shadow-sm transition-transform active:scale-95">➕ Dodaj zupełnie nową kategorię</button>';
                    
                    html += '</div></div></div>';
                }

                var tabs = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
                var icons = ['📅','🍎','💪','📊','⚙️'];
                var labels = ['Dziennik','Baza','Ciało','Podsum.','Ustaw.'];
                html += '</div><div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md backdrop-blur border-t grid grid-cols-5 p-1 z-50 ' + th.nav + '">';
                tabs.forEach(function(t, idx) {
                    var col = state.tab === t ? th.tabActive : 'opacity-50';
                    var tl = labels[idx];
                    html += '<button onclick="switchTab(\'' + t + '\')" class="flex flex-col items-center justify-center p-1.5 rounded-xl min-w-0 transition-all ' + col + '"><span class="text-xl mb-0.5">' + icons[idx] + '</span><span class="text-[9px] font-bold truncate w-full text-center">' + tl + '</span></button>';
                });
                html += '</div>';
                app.innerHTML = html;
            } catch(globalErr) {
                // GLOBAL FAIL-SAFE: Jeśli coś pójdzie nie tak, aplikacja nie zatrzyma się na ładowaniu!
                document.getElementById('app').innerHTML = '<div class="p-6 text-center text-rose-600 mt-20"><h2 class="font-black text-xl mb-2">Wystąpił błąd wyświetlania</h2><p class="text-xs mb-4">Kod zatrzymał się z powodu: ' + globalErr.message + '</p><button onclick="localStorage.clear(); location.reload();" class="bg-rose-500 text-white font-bold py-2 px-4 rounded-xl">Wyczyść pamięć i napraw</button></div>';
            }
        };

        window.switchTab = function(t) { 
            saveState(); // Zapisujemy dane np. wage wpisana "na żywo" przed opuszczeniem tabu
            if (state.tab === 'baza' && t !== 'baza' && state.isScanning) { 
                state.isScanning = false;
                if (window.html5QrCode) {
                    try { window.html5QrCode.stop().catch(function(){}); window.html5QrCode = null; } catch(e){}
                }
            } 
            state.tab = t; state.statusMsg = ''; state.prodResults = []; state.wResults = []; render(); 
        };

        var touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
        var tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
        window.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: true});
        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX; touchEndY = e.changedTouches[0].screenY;
            var diffX = touchEndX - touchStartX;
            var diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                var idx = tabsOrder.indexOf(state.tab);
                if (diffX < 0 && idx < tabsOrder.length - 1) switchTab(tabsOrder[idx + 1]);
                else if (diffX > 0 && idx > 0) switchTab(tabsOrder[idx - 1]);
            }
        }, {passive: true});

        render();
    </script>
</body>
</html>

                        if (!cDay.weight && lDay.weight) result[uid][dt].weight = lDay.weight;

        window.getDayData = function(customDate) {

            if (!state.diaries[state.userId][targetDate]) state.diaries[state.userId][targetDate] = {};

            if (!d.injuries) d.injuries = {};

            for (var i = dates.length - 1; i >= 0; i--) {

        function getPeriodInfo(view, offset, baseDateStr, allDates) {
            var parts = baseDateStr.split('-');
            var baseD = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            var dates = [];
            var label = "";

            if (view === 'ogolne') {
                dates = allDates.slice();
                label = "Od początku";
            } else if (view === 'rok') {
                var y = baseD.getFullYear() + offset;
                dates = allDates.filter(function(d) { return d.startsWith(y.toString()); });
                label = "Rok " + y;
            } else if (view === 'miesiac') {
                var mDate = new Date(baseD.getFullYear(), baseD.getMonth() + offset, 1);
                var yStr = mDate.getFullYear();
                var mStr = String(mDate.getMonth() + 1).padStart(2, '0');
                dates = allDates.filter(function(d) { return d.startsWith(yStr + '-' + mStr); });
                var months = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
                label = months[mDate.getMonth()] + " " + yStr;
            } else {
                var curr = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate());
                curr.setDate(curr.getDate() + (offset * 7));
                var dW = curr.getDay();
                var sW = parseInt(state.settings.startOfWeek);
                if (isNaN(sW)) sW = 1;
                var diff = dW - sW;
                if (diff < 0) diff += 7;
                curr.setDate(curr.getDate() - diff);
                for (var i = 0; i < 7; i++) {
                    var n = new Date(curr.getFullYear(), curr.getMonth(), curr.getDate() + i);
                    dates.push(formatDateLocal(n));
                }
                label = dates[0] + " — " + dates[6];
            }
            return { dates: dates, label: label };
        }

        async function executeGeminiFetch(fullModelName, key, promptStr) {
            var path = fullModelName.startsWith('models/') ? fullModelName : ('models/' + fullModelName);
            var url = 'https://generativelanguage.googleapis.com/v1beta/' + path + ':generateContent';
            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
            });
            if (res.ok) {
                var data = await res.json();
                return data.candidates[0].content.parts[0].text.trim();
            }
            var errObj = await res.json().catch(function() { return {}; });
            var msg = (errObj.error && errObj.error.message) ? errObj.error.message : ('Status ' + res.status);
            throw new Error(msg);
        }

        window.callGeminiSmart = async function(promptStr) {
            var key = (state.geminiApiKey || '').trim();
            if (!key) throw new Error('Wklej klucz API Gemini w zakładce Ustawienia!');

            if (state.workingModelPath) {
                try { return await executeGeminiFetch(state.workingModelPath, key, promptStr); }
                catch(e) { state.workingModelPath = ''; }
            }

            var lastError = '';
            try {
                var listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
                    method: 'GET',
                    headers: { 'x-goog-api-key': key }
                });
                if (listRes.ok) {
                    var listData = await listRes.json();
                    var supported = (listData.models || []).filter(function(m) {
                        return m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini');
                    });
                    supported.sort(function(a, b) { return (a.name.includes('flash') ? 0 : 1) - (b.name.includes('flash') ? 0 : 1); });
                    for (var i = 0; i < supported.length; i++) {
                        try {
                            var reply = await executeGeminiFetch(supported[i].name, key, promptStr);
                            if (reply) {
                                state.workingModelPath = supported[i].name;
                                try { localStorage.setItem('diet_working_model_v44', supported[i].name); } catch(e) {}
                                return reply;
                            }
                        } catch(err) { lastError = err.message; }
                    }
                }
            } catch(e) { lastError = e.message; }

            var fallbacks = ['models/gemini-2.5-flash', 'models/gemini-2.0-flash', 'models/gemini-1.5-flash'];
            for (var j = 0; j < fallbacks.length; j++) {
                try {
                    var rep = await executeGeminiFetch(fallbacks[j], key, promptStr);
                    if (rep) {
                        state.workingModelPath = fallbacks[j];
                        try { localStorage.setItem('diet_working_model_v44', fallbacks[j]); } catch(e) {}
                        return rep;
                    }
                } catch(e) { lastError = e.message; }
            }
            throw new Error(lastError || 'Nie udało się połączyć z Gemini AI.');
        };

        window.renderWeightChart = function() {
            var userDiary = state.diaries[state.userId] || {};
            var dates = Object.keys(userDiary).sort(function(a, b) { return new Date(a) - new Date(b); });
            var weights = [];
            dates.forEach(function(d) {
                var w = parseFloat(userDiary[d].weight);
                if (!isNaN(w) && w > 0) weights.push({ date: d, val: w });
            });
            if (weights.length < 2) return '<div class="text-xs opacity-60 text-center py-6 border border-dashed border-gray-300 rounded-xl">Dodaj wagę w minimum 2 dniach, aby zobaczyć wykres.</div>';

            var minWGlobal = Math.min.apply(null, weights.map(function(w) { return w.val; }));
            var maxWGlobal = Math.max.apply(null, weights.map(function(w) { return w.val; }));
            var last14 = weights.slice(-14);
            var minW = Math.min.apply(null, last14.map(function(w) { return w.val; }));
            var maxW = Math.max.apply(null, last14.map(function(w) { return w.val; }));
            var range = (maxW - minW) || 1;
            var w = 340, h = 100, padX = 20, padY = 20;
            var stepX = (w - padX * 2) / (last14.length - 1);
            var points = last14.map(function(pt, i) {
                return (padX + (i * stepX)) + ',' + (h - padY - (((pt.val - minW) / range) * (h - padY * 2)));
            }).join(' ');
            var circles = last14.map(function(pt, i) {
                var x = padX + (i * stepX);
                var y = h - padY - (((pt.val - minW) / range) * (h - padY * 2));
                var label = (i === 0 || i === last14.length - 1) ? '<text x="' + x + '" y="' + (y - 8) + '" font-size="8" font-weight="bold" fill="#ec4899" text-anchor="middle">' + pt.val + '</text>' : '';
                return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#ffffff" stroke="#ec4899" stroke-width="2" />' + label;
            }).join('');

            return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full h-auto drop-shadow-sm bg-white/80 rounded-xl border border-gray-200 p-2"><polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + (h - padY) + ' ' + w + ',' + (h - padY) + '" /><polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + padY + ' ' + w + ',' + padY + '" /><polyline fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + points + '" />' + circles + '</svg><div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-200/50 px-1"><span class="text-[10px] font-bold opacity-70 uppercase">Min: <span class="text-emerald-500 ml-1">' + minWGlobal + ' kg</span></span><span class="text-[10px] font-bold opacity-70 uppercase">Max: <span class="text-rose-500 ml-1">' + maxWGlobal + ' kg</span></span></div>';
        };

                    allCats.forEach(function(c) {
                        var count = state.products.filter(function(p) { return (p.category || 'Inne') === c; }).length;
                        html += '<button onclick="moveToCategory(\'' + escJs(c) + '\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 border border-transparent hover:border-blue-200 flex justify-between items-center"><span>📂 ' + escHtml(c) + '</span><span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + count + '</span></button>';
                    });
                    if (!allCats.includes('Inne')) {
                        var inCount = state.products.filter(function(p) { return (p.category || 'Inne') === 'Inne'; }).length;
                        html += '<button onclick="moveToCategory(\'Inne\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 flex justify-between items-center"><span>📂 Inne</span><span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + inCount + '</span></button>';
                    }
                    html += '<button onclick="addNewCategoryFromModal()" class="w-full mt-3 bg-blue-100 text-blue-700 hover:bg-blue-200 font-black p-3.5 rounded-xl text-xs shadow-sm">➕ Dodaj nową kategorię</button></div></div></div>';
                }

                html += '</div><div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md backdrop-blur border-t grid grid-cols-5 p-1 z-50 ' + th.nav + '">';
                ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'].forEach(function(t, idx) {
                    var col = state.tab === t ? th.tabActive : 'opacity-50';
                    html += '<button onclick="switchTab(\'' + t + '\')" class="flex flex-col items-center justify-center p-1.5 rounded-xl min-w-0 transition-all ' + col + '"><span class="text-xl mb-0.5">' + ['📅','🍎','💪','📊','⚙️'][idx] + '</span><span class="text-[9px] font-bold truncate w-full text-center">' + ['Dziennik','Baza','Ciało','Podsum.','Ustaw.'][idx] + '</span></button>';
                });
                html += '</div>';
                app.innerHTML = html;
            } catch(e) {
                document.getElementById('app').innerHTML = '<div class="p-6 text-center mt-20"><h2 class="font-black text-xl mb-2 text-rose-600">⚠️ Błąd wyświetlania</h2><p class="text-xs mb-4 text-gray-700">Szczegóły: <i>' + escHtml(e.message) + '</i></p><p class="text-xs mb-4 font-bold text-emerald-700">Twoje dane są bezpieczne w pamięci urządzenia.</p><div class="space-y-2"><button onclick="exportFullJson()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg">💾 Pobierz kopię zapasową JSON</button><button onclick="location.reload();" class="w-full bg-gray-200 text-gray-800 font-bold py-2 rounded-xl text-xs">Odśwież</button></div></div>';
            }
        };

        var touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
        var tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
        window.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            var diffX = touchEndX - touchStartX;
            var diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                var idx = tabsOrder.indexOf(state.tab);
                if (diffX < 0 && idx < tabsOrder.length - 1) switchTab(tabsOrder[idx + 1]);
                else if (diffX > 0 && idx > 0) switchTab(tabsOrder[idx - 1]);
            }
        }, { passive: true });

        render();
    </script>
</body>
</html>

            render();

        window.closeAiModal = function() {

        window.askGeminiForMeal = async function() {
            var query = state.aiQueryText.trim();
            if (!query) return alert('Wpisz, co zjadłeś!');
            if (!state.geminiApiKey) {
                closeAiModal(); switchTab('kopia');
                return alert('Aby używać asystenta AI, wklej swój darmowy klucz Gemini w zakładce Ustawienia.');
            }

            state.aiLoading = true;
            render();

            try {
                var promptStr = 'Jesteś profesjonalnym dietetykiem. Użytkownik zjadł posiłek opisany jako: "' + query + '". Oszacuj wagę (w gramach), kalorie oraz makroskładniki (białko, tłuszcz, węglowodany) dla tego posiłku. Zwróć odpowiedź WYŁĄCZNIE w czystym formacie JSON bez żadnych znaczników markdown: {"name": "Krótka, ładna nazwa posiłku", "weight": 350, "kcal": 550, "p": 35.0, "f": 20.0, "c": 60.0}';
                
                // UWAGA: Zmieniono model na gemini-1.5-flash
                var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + state.geminiApiKey, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                
                if (!res.ok) {
                    var errData = await res.json().catch(function(){ return {}; });
                    var errMsg = (errData.error && errData.error.message) ? errData.error.message : 'Brak szczegółów';
                    throw new Error('Odrzucono przez Google: ' + errMsg);
                }
                
                var data = await res.json();
                var textResp = data.candidates[0].content.parts[0].text.trim();
                textResp = textResp.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/, "");
                
                state.aiResultData = JSON.parse(textResp);
            } catch(err) {
                alert('Błąd API: ' + err.message);
            } finally {
                state.aiLoading = false;
                render();
            }
        };

        window.addAiMealToDiary = function() {

            getDayData().meals.push({

            state.products.unshift({

                baseKcal: res.kcal, baseP: res.p, baseF: res.f, baseC: res.c
            });

            state.statusMsg = 'Dodano posiłek szacowany przez AI!';
            closeAiModal(); saveState(); render();
        };

        window.getGeminiDailyAdvice = async function() {
            if (!state.geminiApiKey) {
                switchTab('kopia');
                return alert('Aby używać asystenta AI, wklej swój darmowy klucz Gemini w zakładce Ustawienia.');
            }

            var day = getDayData();
            var user = state.users.find(function(u) { return u.id === state.userId; }) || state.users[0];
            var eaten = 0, p = 0, f = 0, c = 0;
            day.meals.forEach(function(m) { eaten += m.kcal; p += m.p; f += m.f; c += m.c; });
            var burned = day.workouts.reduce(function(s, w) { return s + w.kcal; }, 0);

            state.aiAdviceLoading = true;
            render();

            try {
                var promptStr = 'Jesteś przyjaznym, motywującym osobistym trenerem i dietetykiem. Przeanalizuj dzisiejsze wyniki użytkownika ' + user.name + ': Cel kalorii: ' + day.goals.kcal + ' kcal. Zjedzono: ' + Math.round(eaten) + ' kcal (Białko: ' + Math.round(p) + 'g, Tłuszcz: ' + Math.round(f) + 'g, Węglowodany: ' + Math.round(c) + 'g). Spalono na treningu: ' + burned + ' kcal. Waga dzisiaj: ' + (day.weight ? day.weight + ' kg' : 'brak pomiaru') + '. Napisz krótki, zwięzły, pełen energii komentarz (2-3 zdania). Pochwal za dobre nawyki, odnieś się do treningu lub bilansu i daj jedną konstruktywną radę na resztę dnia lub jutro. Mów bezpośrednio do użytkownika w języku polskim.';
                
                // UWAGA: Zmieniono model na gemini-1.5-flash
                var res = await fetch('[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=)' + state.geminiApiKey, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                
                if (!res.ok) {
                    var errData = await res.json().catch(function(){ return {}; });
                    var errMsg = (errData.error && errData.error.message) ? errData.error.message : 'Brak szczegółów';
                    throw new Error('Odrzucono przez Google: ' + errMsg);
                }
                
                var data = await res.json();
                state.aiAdviceText = data.candidates[0].content.parts[0].text.trim();
            } catch(err) {
                state.aiAdviceText = 'Błąd AI: ' + err.message;
            } finally {
                state.aiAdviceLoading = false;
                render();
            }
        };

        // Skaner
        window.fetchProductByBarcode = function(barcode) {
            if (!barcode || !barcode.trim()) return alert('Wpisz lub zeskanuj kod kreskowy!');
            var cleanCode = barcode.trim();
            state.statusMsg = 'Pobieram dane produktu...';
            state.scannedProductData = null;
            render();

            fetch('[https://world.openfoodfacts.org/api/v0/product/](https://world.openfoodfacts.org/api/v0/product/)' + cleanCode + '.json')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.status === 1 && data.product) {
                        var p = data.product;
                        var name = (p.product_name_pl || p.product_name || 'Produkt z kodu') + (p.brands ? ' (' + p.brands + ')' : '');
                        var nut = p.nutriments || {};
                        var kcal100 = nut['energy-kcal_100g'] || nut['energy-kcal'] || 0;
                        var prot100 = nut['proteins_100g'] || 0;
                        var fat100 = nut['fat_100g'] || 0;
                        var carb100 = nut['carbohydrates_100g'] || 0;

                        var pkgWeight = 100;
                        var rawQty = p.quantity || p.product_quantity || '';
                        var match = String(rawQty).match(/(\d+)\s*g/i);
                        if (match && match[1]) {
                            pkgWeight = parseInt(match[1]);
                        } else if (kcal100 > 0) {
                            var kcalTotal = nut['energy-kcal'] || 0;
                            if (kcalTotal > 0 && kcalTotal !== kcal100) {
                                pkgWeight = Math.round((kcalTotal / kcal100) * 100);
                            }
                        }

                        var ratio = pkgWeight / 100;
                        var totalKcal = Math.round(kcal100 * ratio);
                        var totalProt = Math.round((prot100 * ratio) * 10) / 10;
                        var totalFat = Math.round((fat100 * ratio) * 10) / 10;
                        var totalCarb = Math.round((carb100 * ratio) * 10) / 10;

                        state.scannedProductData = { name: name, baseWeight: pkgWeight, baseKcal: totalKcal, baseP: totalProt, baseF: totalFat, baseC: totalCarb, addWeight: pkgWeight };
                        state.statusMsg = 'Zeskanowano pomyślnie!';
                        render();
                    } else {
                        state.statusMsg = ''; alert('Nie znaleziono w darmowej bazie. Wpisz dane ręcznie.'); render();

        window.addScannedDirectlyToDiary = function(inputWId) {
            if (!state.scannedProductData) return;

            var customW = parseFloat(document.getElementById('scannedPkgWeightInput').value) || sp.baseWeight;
            var customKcal = parseFloat(document.getElementById('scannedPkgKcalInput').value) || sp.baseKcal;
            var customP = parseFloat(document.getElementById('scannedPkgPInput').value) || sp.baseP;
            var customF = parseFloat(document.getElementById('scannedPkgFInput').value) || sp.baseF;
            var customC = parseFloat(document.getElementById('scannedPkgCInput').value) || sp.baseC;

            var eatenW = parseFloat(document.getElementById(inputWId).value) || customW;
            var r = eatenW / customW;

            var existing = state.products.find(function(prod) { return prod.name.toLowerCase() === sp.name.toLowerCase(); });
            if (!existing) {
                state.products.unshift({ id: String(Date.now()), name: sp.name, baseWeight: customW, baseKcal: customKcal, baseP: customP, baseF: customF, baseC: customC });
            } else {
                existing.baseWeight = customW; existing.baseKcal = customKcal; existing.baseP = customP; existing.baseF = customF; existing.baseC = customC;
            }

            getDayData().meals.push({
                id: Date.now(), name: sp.name, weight: eatenW,
                kcal: Math.round(customKcal * r), p: Math.round(customP * r * 10) / 10,
                f: Math.round(customF * r * 10) / 10, c: Math.round(customC * r * 10) / 10
            });

            var weightVal = parseFloat(w);

        window.getDayData = function(customDate) {
            var targetDate = customDate || state.date;
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][targetDate]) {
                state.diaries[state.userId][targetDate] = {
                    goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 },
                    meals: [], workouts: [], weight: '', water: 0, measurements: {}
                };
            }
            var d = state.diaries[state.userId][targetDate];
            if(d.water === undefined) d.water = 0;
            if(!d.measurements) d.measurements = {};
            if(!d.meals) d.meals = [];
            if(!d.workouts) d.workouts = [];
            return d;

        window.getDietDaysCounter = function() {
            var user = state.users.find(function(u) { return u.id === state.userId; }) || state.users[0];
            var diff = Math.floor((new Date(state.date) - new Date(user.startDate || state.date)) / (1000 * 60 * 60 * 24));
            return diff >= 0 ? diff + 1 : 0;
        };

        window.setDayCounter = function(val) {
            var days = parseInt(val); if(isNaN(days) || days <= 0) return;
            var current = new Date(state.date); current.setDate(current.getDate() - (days - 1));
            state.users.find(function(u) { return u.id === state.userId; }).startDate = current.toISOString().split('T')[0];
            saveState(); render();
        };

        window.getFirstActiveEntryDate = function() {
            var userDiary = state.diaries[state.userId] || {};
            var allDates = Object.keys(userDiary).sort();
            for (var i = 0; i < allDates.length; i++) {
                var d = userDiary[allDates[i]];
                if ((d.meals && d.meals.length > 0) || (d.workouts && d.workouts.length > 0)) return allDates[i];
            }
            return null;

        window.getWeekDates = function() {
            var curr = new Date(state.date); curr.setDate(curr.getDate() + (state.weekOffset * 7));
            var offset = state.settings.startOfWeek === 1 ? (curr.getDay() === 0 ? -6 : 1 - curr.getDay()) : -curr.getDay();
            var firstDay = new Date(curr.setDate(curr.getDate() + offset));
            var weekDates = [];
            for (var i = 0; i < 7; i++) { var n = new Date(firstDay); n.setDate(firstDay.getDate() + i); weekDates.push(n.toISOString().split('T')[0]); }
            return weekDates;

        window.renderWeightChart = function() {
            var userDiary = state.diaries[state.userId] || {};
            var dates = Object.keys(userDiary).sort(function(a,b) { return new Date(a) - new Date(b); });
            var weights = [];
            dates.forEach(function(d) { var w = parseFloat(userDiary[d].weight); if(w && !isNaN(w)) weights.push({ date: d, val: w }); });
            var minWGlobal = weights.length ? Math.min.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var maxWGlobal = weights.length ? Math.max.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var last14 = weights.slice(-14);
            if(last14.length < 2) return '<div class="text-xs opacity-60 text-center py-6 border border-dashed border-gray-300 rounded-xl">Dodaj wagę w minimum 2 dniach, aby zobaczyć wykres.</div>';

            var minW = Math.min.apply(null, last14.map(function(w) { return w.val; }));
            var maxW = Math.max.apply(null, last14.map(function(w) { return w.val; }));
            var range = (maxW - minW) || 1;
            var w = 340, h = 100, padX = 20, padY = 20;
            var stepX = (w - padX * 2) / (last14.length - 1);
            var points = last14.map(function(pt, i) { return (padX + (i * stepX)) + ',' + (h - padY - (((pt.val - minW) / range) * (h - padY * 2))); }).join(' ');

            var circles = last14.map(function(pt, i) {
                var x = padX + (i * stepX), y = h - padY - (((pt.val - minW) / range) * (h - padY * 2));
                var label = (i === 0 || i === last14.length - 1) ? '<text x="' + x + '" y="' + (y - 8) + '" font-size="8" font-weight="bold" fill="#ec4899" text-anchor="middle">' + pt.val + '</text>' : '';
                return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#ffffff" stroke="#ec4899" stroke-width="2" />' + label;
            }).join('');

            return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full h-auto drop-shadow-sm bg-white/80 rounded-xl border border-gray-200 p-2">' +
                '<polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + (h-padY) + ' ' + w + ',' + (h-padY) + '" />' +
                '<polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + padY + ' ' + w + ',' + padY + '" />' +
                '<polyline fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + points + '" />' + circles + '</svg>' +
                '<div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-200/50 px-1">' +
                '<span class="text-[10px] font-bold opacity-70 uppercase">Min: <span class="text-emerald-500 ml-1">' + minWGlobal + ' kg</span></span>' +
                '<span class="text-[10px] font-bold opacity-70 uppercase">Max: <span class="text-rose-500 ml-1">' + maxWGlobal + ' kg</span></span></div>';
        };

                    '<div class="' + th.inputBg + ' p-3 rounded-xl border"><p class="text-[9px] font-bold text-orange-500 uppercase mb-1">Spalone w tyg.</p><p class="text-xl font-black text-orange-500">🔥 ' + tBurned + '</p></div></div>' +
                    '<div class="' + th.inputBg + ' p-4 rounded-xl border"><p class="text-[10px] font-bold opacity-60 uppercase mb-1">Zmiana wagi (w tym tyg.)</p><p class="text-3xl font-black ' + (wDiff > 0 ? 'text-rose-500' : 'text-emerald-500') + '">' + wDiffStr + ' kg</p></div></div>' +
                    '<div class="' + th.card + ' p-4 rounded-xl border"><h3 class="font-black text-sm mb-3">📈 Wykres Wagi (Ostatnie 14 wpisów)</h3>' + renderWeightChart() + '</div>';

            } else if (state.tab === 'kopia') {
                if (state.statusMsg) html += '<div class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-700 text-xs font-bold p-3 rounded-xl mb-4 text-center">' + state.statusMsg + '</div>';

                html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4">' +
                    '<h3 class="font-black mb-2 text-sm text-center">🧠 Konfiguracja AI (Gemini)</h3>' +
                    '<p class="text-[10px] text-gray-500 mb-3 text-center">Aby AI działało, wklej tu darmowy klucz API pobrany z <a href="[https://aistudio.google.com/app/apikey](https://aistudio.google.com/app/apikey)" target="_blank" class="text-blue-500 underline font-bold">Google AI Studio</a>.</p>' +
                    '<input type="password" id="aiKeyInput" placeholder="AIzaSy... lub AQ..." value="' + state.geminiApiKey + '" class="w-full p-2.5 ' + th.inputBg + ' border rounded-lg text-xs font-medium outline-none mb-2 text-center" />' +
                    '<button onclick="saveGeminiKey(document.getElementById(\'aiKeyInput\').value)" class="w-full ' + th.btn + ' font-bold py-2.5 rounded-xl shadow-md text-xs">Zapisz klucz AI</button>' +
                    '</div>';

                html += '<div class="' + th.softBox + ' border p-4 rounded-xl mb-4">' +
                    '<h3 class="font-black mb-2 text-sm text-center">☁️ Synchronizacja z Chmurą</h3>' +
                    '<div class="grid grid-cols-2 gap-2">' +
                    '<button onclick="cloudUploadOnly()" class="' + th.btn + ' font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬆️ Wyślij dane</button>' +
                    '<button onclick="cloudDownloadOnly()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-2 rounded-xl shadow-md text-xs">⬇️ Pobierz dane</button>' +
                    '</div></div>';

                html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4"><h3 class="font-black mb-3 text-sm">👤 Ustawienia Profili</h3><div class="space-y-3 mb-4">';
                state.users.forEach(function(u, i) {
                    html += '<div><label class="text-[10px] font-bold opacity-60 uppercase block mb-1">Imię Profilu ' + (i+1) + '</label><input type="text" value="' + u.name + '" onchange="changeUserName(\'' + u.id + '\', this.value)" class="w-full p-2 ' + th.inputBg + ' border rounded-lg text-sm font-bold outline-none" /></div>';
                });
                html += '</div><div><label class="text-[10px] font-bold opacity-60 uppercase block mb-1">Pierwszy dzień tyg. statystyk</label><select onchange="changeStartOfWeek(this.value)" class="w-full p-2 ' + th.inputBg + ' border rounded-lg text-xs font-bold outline-none"><option value="1" ' + (state.settings.startOfWeek === 1 ? 'selected' : '') + '>Poniedziałek</option><option value="0" ' + (state.settings.startOfWeek === 0 ? 'selected' : '') + '>Niedziela</option></select></div></div>';

                html += '<div class="' + th.card + ' p-5 rounded-xl border text-center mb-4"><h3 class="font-black mb-2 text-sm">💾 Kopia Zapasowa Danych</h3><div class="space-y-3 mt-4">' +
                    '<button onclick="exportFullJson()" class="w-full ' + th.btn + ' font-bold py-3 rounded-xl shadow-md text-xs">📥 Pobierz wszystko do pliku (.json)</button>' +
                    '<div class="text-left space-y-2 my-2 ' + th.inputBg + ' p-2 rounded-lg border">' +
                    '<label class="flex items-center space-x-2 text-[10px] font-bold"><input type="radio" name="impMode" value="products" ' + (state.importMode === 'products' ? 'checked' : '') + ' onchange="state.importMode=\'products\'" /><span>Tylko dodaj nowe produkty</span></label>' +
                    '<label class="flex items-center space-x-2 text-[10px] font-bold"><input type="radio" name="impMode" value="full" ' + (state.importMode === 'full' ? 'checked' : '') + ' onchange="state.importMode=\'full\'" /><span>Pełna kopia (nadpisuje wszystko)</span></label></div>' +
                    '<textarea id="jsonArea" rows="3" placeholder="Wklej skopiowany kod JSON..." class="w-full p-2 ' + th.inputBg + ' border rounded-xl text-xs outline-none"></textarea>' +
                    '<button onclick="importFullJson()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-xs">📤 Wgraj kod JSON</button></div></div>';

                html += '<div class="' + th.card + ' p-4 rounded-xl border mb-4">' +
                    '<h3 class="font-black mb-3 text-sm text-center">🎨 Wybierz Szatę Graficzną</h3>' +
                    '<div class="grid grid-cols-1 gap-2">';
                
                Object.keys(THEMES).forEach(function(key) {
                    var t = THEMES[key];
                    var isSelected = state.theme === key;
                    var borderCls = isSelected ? 'border-2 border-pink-500 ring-2 ring-pink-300/50' : 'border opacity-85';
                    html += '<div onclick="setTheme(\'' + key + '\')" class="p-3 rounded-xl cursor-pointer flex justify-between items-center transition-all ' + th.inputBg + ' ' + borderCls + '">' +
                        '<span class="text-xs font-bold">' + t.name + '</span>' +
                        '<div class="w-6 h-6 rounded-full ' + t.header + ' flex items-center justify-center text-white text-xs shadow">' + (isSelected ? '✓' : '') + '</div>' +
                        '</div>';
                });
                html += '</div></div>';

                html += '<div class="' + th.card + ' border p-4 rounded-xl text-center mb-6">' +
                    '<h4 class="font-black text-xs opacity-70 uppercase mb-1">ℹ️ Informacje o aplikacji</h4>' +
                    '<p class="text-xs font-bold ' + th.accent + '">Wersja: v29 (Rozszerzone klucze AI i odczyt błędów)</p>' +
                    '<p class="text-[10px] opacity-60 mt-1">Ostatnia aktualizacja: 25.10.2026, 17:00</p>' +
                    '</div>';
            }

            var tabs = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
            var icons = ['📅','🍎','💪','📊','⚙️'];
            var labels = ['Dziennik','Baza','Ciało','Tydzień','Ustaw.'];
            html += '</div><div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md backdrop-blur border-t grid grid-cols-5 p-1 z-50 ' + th.nav + '">';
            tabs.forEach(function(t, idx) {
                var col = state.tab === t ? th.tabActive : 'opacity-50';
                html += '<button onclick="switchTab(\'' + t + '\')" class="flex flex-col items-center justify-center p-1.5 rounded-xl min-w-0 transition-all ' + col + '"><span class="text-xl mb-0.5">' + icons[idx] + '</span><span class="text-[9px] font-bold truncate w-full text-center">' + labels[idx] + '</span></button>';
            });
            html += '</div>';
            app.innerHTML = html;
        };

        window.switchTab = function(t) { if (state.tab === 'baza' && t !== 'baza' && state.isScanning) { stopBarcodeScanner(); } state.tab = t; state.statusMsg = ''; state.prodResults = []; state.wResults = []; render(); };
        window.switchUser = function(u) { state.userId = u; saveState(); render(); };
        window.changeDate = function(d) { state.date = d; render(); };
        window.changeWeight = function(w) { getDayData().weight = w; saveState(); };
        window.toggleGoals = function() { state.isEditingGoals = !state.isEditingGoals; render(); };
        window.changeStartOfWeek = function(val) { state.settings.startOfWeek = parseInt(val); saveState(); render(); };
        window.addWater = function(amount) { if (amount === 0) getDayData().water = 0; else getDayData().water = (parseFloat(day.water) || 0) + amount; saveState(); render(); };
        window.updateMeasurement = function(id, val) { getDayData().measurements[id] = val; saveState(); };
        window.promptAddMeasurement = function() { var name = prompt('Podaj nazwę nowego pomiaru (np. Łydka):'); if(name && name.trim()) { state.settings.measurements.push({ id: 'm_' + Date.now(), name: name.trim() }); saveState(); render(); } };
        window.removeMeasurement = function(id) { if(confirm('Usunąć ten pomiar?')) { state.settings.measurements = state.settings.measurements.filter(function(m) { return m.id !== id; }); saveState(); render(); } };
        window.changeUserName = function(id, newName) { var u = state.users.find(function(x) { return x.id === id; }); if (u && newName.trim()) { u.name = newName.trim(); saveState(); render(); } };

        window.addMeal = function() {
            var p = state.products.find(function(x) { return x.id === state.selectedProdId; }) || state.products.find(function(x) { return x.name.toLowerCase() === state.prodSearch.trim().toLowerCase(); });
            var w = parseFloat(state.inputWeight);
            if (!p || !w) return alert('Wybierz produkt z podpowiedzi i podaj wagę!');
            var r = w / p.baseWeight;
            getDayData().meals.push({ id: Date.now(), name: p.name, weight: w, kcal: Math.round(p.baseKcal * r), p: Math.round(p.baseP * r * 10) / 10, f: Math.round(p.baseF * r * 10) / 10, c: Math.round(p.baseC * r * 10) / 10 });
            state.prodSearch = ''; state.inputWeight = ''; state.selectedProdId = ''; saveState(); render();
        };

        window.delMeal = function(id) { getDayData().meals = getDayData().meals.filter(function(x) { return x.id !== id; }); saveState(); render(); };

        window.searchWorkout = function(val) {
            state.wSearch = val;
            if (val.trim().length > 0) state.wResults = state.workoutsDb.filter(function(w) { return w.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 5);
            else state.wResults = [];
            render(); setTimeout(function() { var el = document.getElementById('wNameInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectWorkoutDrop = function(name) {
            var w = state.workoutsDb.find(function(x) { return x.name === name; });
            if (w) { state.wSearch = w.name; state.wInputTime = w.time; state.wInputKcal = w.kcal; state.wResults = []; render(); }
        };

        window.addWorkout = function() {
            var name = state.wSearch.trim(), time = parseInt(state.wInputTime) || 0, kcal = parseInt(state.wInputKcal) || 0;
            if (!name || !kcal) return alert('Podaj nazwę i spalone kalorie!');
            if (!state.workoutsDb.find(function(w) { return w.name.toLowerCase() === name.toLowerCase(); })) state.workoutsDb.push({ name: name, time: time, kcal: kcal });
            getDayData().workouts.push({ id: Date.now(), name: name, time: time, kcal: kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = []; saveState(); render();
        };

        window.delWorkout = function(id) { getDayData().workouts = getDayData().workouts.filter(function(x) { return x.id !== id; }); saveState(); render(); };
        
        window.saveGoals = function() {
            state.isEditingGoals = false; 
            getDayData().goals = { kcal: parseFloat(document.getElementById('gKcal').value) || 0, p: parseFloat(document.getElementById('gP').value) || 0, f: parseFloat(document.getElementById('gF').value) || 0, c: parseFloat(document.getElementById('gC').value) || 0 }; 
            saveState(); render();
        };

        window.startEditProd = function(id) { 
            state.editProdId = id; 
            render(); 
            setTimeout(function() { 
                var el = document.getElementById('prodForm'); 
                if(el) el.scrollIntoView({behavior: 'smooth'}); 
            }, 100); 
        };
        window.cancelEditProd = function() { state.editProdId = null; render(); };

        window.addProd = function() {
            var name = document.getElementById('pName').value.trim();
            var w = parseFloat(document.getElementById('pW').value) || 100, p = parseFloat(document.getElementById('pP').value) || 0, f = parseFloat(document.getElementById('pF').value) || 0, c = parseFloat(document.getElementById('pC').value) || 0;
            var kcal = document.getElementById('pK').value !== '' ? parseFloat(document.getElementById('pK').value) : Math.round(p*4 + c*4 + f*9);
            if (!name) return alert('Podaj nazwę!');
            if(state.editProdId) {
                var prod = state.products.find(function(x) { return x.id === state.editProdId; });
                if(prod) { prod.name = name; prod.baseWeight = w; prod.baseKcal = kcal; prod.baseP = p; prod.baseF = f; prod.baseC = c; }
                state.editProdId = null;
            } else { state.products.unshift({ id: String(Date.now()), name: name, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c }); }
            saveState(); render();
        };

        window.delProd = function(id) { if (confirm('Usunąć ten produkt z bazy?')) { state.products = state.products.filter(function(x) { return x.id !== id; }); saveState(); render(); } };

        window.exportFullJson = function() {
            var payload = { version: 29, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, theme: state.theme };
            var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = 'dieta_' + state.date + '.json'; a.click();
            state.settings.lastBackup = new Date().toISOString().split('T')[0]; saveState(); state.statusMsg = 'Pobrano plik kopii zapasowej!'; render();
        };

        window.importFullJson = function() {
            try {
                var data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    var names = new Set(state.products.map(function(p) { return p.name.trim().toLowerCase(); })); var added = 0;
                    (data.products || []).forEach(function(p) { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = 'Wgrano ' + added + ' nowych produktów.';
                } else {
                    if (!confirm('Nadpisać całą historię?')) return;
                    if (data.products) state.products = data.products; 
                    if (data.diaries) state.diaries = data.diaries;
                    if (data.users) state.users = data.users; 
                    if (data.settings) state.settings = data.settings; 
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.theme) state.theme = data.theme;
                    state.statusMsg = 'Kopia wgrana pomyślnie!';
                }
                saveState(); render();
            } catch(e) { alert('Błąd odczytu JSON!'); }
        };

        var touchStartX = 0, touchEndX = 0, tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
        window.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, false);
        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            var threshold = 70;
            if (touchEndX < touchStartX - threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx < tabsOrder.length - 1) { switchTab(tabsOrder[idx + 1]); }
            }
            if (touchEndX > touchStartX + threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx > 0) { switchTab(tabsOrder[idx - 1]); }
            }
        }, false);

        render();
    </script>
</body>
</html>

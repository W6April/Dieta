        function initLocalDefaults() {
            if(!state.settings.categories || state.settings.categories.length === 0) {
                state.settings.categories = DEFAULT_CATEGORIES.slice();
            }
            try {
                if (!state.products || !Array.isArray(state.products)) state.products = [];

                    }
                });
                state.products.forEach(function(p) {

                });
            } catch(e) {
                state.products = FULL_PRODUCTS.slice(); 
            }
        }
        initLocalDefaults();

        function safeMergeDiaries(cloudDiaries, locDiaries) {
            var result = JSON.parse(JSON.stringify(cloudDiaries || {}));
            Object.keys(locDiaries || {}).forEach(function(uid) {
                if (!result[uid]) result[uid] = {};
                Object.keys(locDiaries[uid] || {}).forEach(function(dt) {
                    var cDay = result[uid][dt];
                    var lDay = locDiaries[uid][dt];
                    if (!cDay) {
                        result[uid][dt] = lDay;
                    } else {
                        var cMeals = (cDay.meals || []).length;
                        var lMeals = (lDay.meals || []).length;
                        if (lMeals > cMeals) result[uid][dt].meals = lDay.meals;
                        if (!cDay.weight && lDay.weight) result[uid][dt].weight = lDay.weight;
                        if (lDay.measurements) {
                            if (!cDay.measurements) cDay.measurements = {};
                            Object.keys(lDay.measurements).forEach(function(mId) {
                                if (!cDay.measurements[mId] && lDay.measurements[mId]) {
                                    cDay.measurements[mId] = lDay.measurements[mId];
                                }
                            });
                        }
                    }
                });
            });
            return result;
        }

        if (typeof db !== 'undefined') {

                    var data = doc.data();
                    if (Object.keys(state.diaries).length > 0) {
                        localStorage.setItem('diet_emergency_snapshot', JSON.stringify({

                    }
                    if (data.products && data.products.length > 0) { state.products = data.products; initLocalDefaults(); }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.diaries) {
                        state.diaries = safeMergeDiaries(data.diaries, state.diaries);
                    }
                    if (data.users) state.users = data.users;
                    if (data.settings) {
                        state.settings = data.settings;
                        if(!state.settings.categories) state.settings.categories = DEFAULT_CATEGORIES.slice();
                    }
                }

                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));

                }
            }, function(err) { 
                console.log("Błąd chmury:", err); 
                if (!state.isScanning) render();
            });

                    localStorage.setItem('diet_previous_auto_backup', prevVault);
                }
                localStorage.setItem('diet_local_diaries_vault', JSON.stringify(state.diaries));
                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));
                localStorage.setItem('diet_v15_curr_user', state.userId);
                localStorage.setItem('diet_v60_theme', state.theme);
                localStorage.setItem('diet_gemini_key', state.geminiApiKey);
            } catch(e) {}

            if (!state.isCloudSynced) return;

            if (typeof db !== 'undefined') {
                db.collection("dieta").doc("dane_wspolne").set({
                    products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, users: state.users, settings: state.settings

        async function executeGeminiFetch(fullModelName, key, promptStr) {
            var path = fullModelName.startsWith('models/') ? fullModelName : ('models/' + fullModelName);
            var url = 'https://generativelanguage.googleapis.com/v1beta/' + path + ':generateContent';

            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
            });

            if (res.ok) {
                var data = await res.json();
                return data.candidates[0].content.parts[0].text.trim();
            }

            if (res.status === 401 || res.status === 403) {
                var resB = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                if (resB.ok) {
                    var dataB = await resB.json();
                    return dataB.candidates[0].content.parts[0].text.trim();
                }
            }
            
            var errObj = await res.json().catch(function(){ return {}; });
            var msg = (errObj.error && errObj.error.message) ? errObj.error.message : ('Status ' + res.status);
            throw new Error(msg);
        }

        window.callGeminiSmart = async function(promptStr) {
            var key = state.geminiApiKey.trim();
            if (!key) throw new Error('Wklej klucz API w zakładce Ustawienia!');

            if (state.workingModelPath) {
                try {
                    return await executeGeminiFetch(state.workingModelPath, key, promptStr);
                } catch(e) {
                    state.workingModelPath = '';
                }
            }

            var lastError = '';
            try {
                var listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
                    method: 'GET',
                    headers: { 'x-goog-api-key': key }
                });
                
                if (listRes.ok) {
                    var listData = await listRes.json();
                    var models = listData.models || [];
                    var supported = models.filter(function(m) {
                        return m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini');
                    });

                    supported.sort(function(a, b) {
                        var aFlash = a.name.includes('flash') ? 0 : 1;
                        var bFlash = b.name.includes('flash') ? 0 : 1;
                        return aFlash - bFlash;
                    });

                    for (var i = 0; i < supported.length; i++) {
                        try {
                            var candidateName = supported[i].name;
                            var reply = await executeGeminiFetch(candidateName, key, promptStr);
                            if (reply) {
                                state.workingModelPath = candidateName;
                                localStorage.setItem('diet_working_model_v44', candidateName);
                                return reply;
                            }
                        } catch(err) {
                            lastError = err.message;
                        }
                    }
                }
            } catch(e) {
                lastError = e.message;
            }

            var directModels = ['models/gemini-2.5-flash', 'models/gemini-2.0-flash', 'models/gemini-1.5-flash-latest'];
            for (var j = 0; j < directModels.length; j++) {
                try {
                    var rep = await executeGeminiFetch(directModels[j], key, promptStr);
                    if (rep) {
                        state.workingModelPath = directModels[j];
                        localStorage.setItem('diet_working_model_v44', directModels[j]);
                        return rep;
                    }
                } catch(e) {
                    lastError = e.message;
                }
            }

            throw new Error(lastError || 'Nie udało się połączyć z AI.');
        };

        window.fetchProductByBarcode = async function(barcode) {
            var codeToSearch = barcode || state.scannedBarcodeInput || '';
            var inpElem = document.getElementById('barcodeInput');
            if (!codeToSearch && inpElem) codeToSearch = inpElem.value;

            if (!codeToSearch || !String(codeToSearch).trim()) {
                return alert('Wpisz lub zeskanuj kod kreskowy!');
            }
            var cleanCode = String(codeToSearch).trim();
            state.scannedBarcodeInput = cleanCode;
            state.statusMsg = '⏳ Szukam w darmowej bazie (kod: ' + cleanCode + ')...';
            state.scannedProductData = null;
            render();

            try {
                var response = await fetch('[https://pl.openfoodfacts.org/api/v0/product/](https://pl.openfoodfacts.org/api/v0/product/)' + encodeURIComponent(cleanCode) + '.json');
                var data = await response.json();

                if (data && data.status === 1 && data.product) {
                    var p = data.product;
                    var name = (p.product_name_pl || p.product_name || 'Produkt z kodu') + (p.brands ? ' (' + p.brands + ')' : '');
                    var nut = p.nutriments || {};
                    var kcal100 = parseFloat(nut['energy-kcal_100g'] || nut['energy-kcal']) || 0;
                    var prot100 = parseFloat(nut['proteins_100g']) || 0;
                    var fat100 = parseFloat(nut['fat_100g']) || 0;
                    var carb100 = parseFloat(nut['carbohydrates_100g']) || 0;

                    var pkgWeight = 100;
                    var rawQty = p.quantity || p.product_quantity || '';
                    var match = String(rawQty).match(/(\d+)\s*(g|ml)/i);
                    if (match && match[1]) {
                        pkgWeight = parseInt(match[1]);
                    } else if (kcal100 > 0) {
                        var kcalTotal = parseFloat(nut['energy-kcal']) || 0;
                        if (kcalTotal > 0 && kcalTotal !== kcal100) pkgWeight = Math.round((kcalTotal / kcal100) * 100);
                    }

                    var ratio = pkgWeight / 100;
                    var totalKcal = Math.round(kcal100 * ratio);
                    var totalProt = Math.round((prot100 * ratio) * 10) / 10;
                    var totalFat = Math.round((fat100 * ratio) * 10) / 10;
                    var totalCarb = Math.round((carb100 * ratio) * 10) / 10;

                    state.scannedProductData = { name: name, baseWeight: pkgWeight, baseKcal: totalKcal, baseP: totalProt, baseF: totalFat, baseC: totalCarb, addWeight: pkgWeight, category: "Gotowe Posiłki" };
                    state.statusMsg = '✅ Zeskanowano pomyślnie!';
                    render();
                    return;
                }
            } catch(e) {}

            if (state.geminiApiKey) {
                var prodName = prompt("Baza darmowa nie rozpoznała kodu " + cleanCode + ".\n\nWpisz nazwę tego produktu (np. 'Jogurt naturalny Zott'), a asystent AI oszacuje jego skład i dołączy do zeskanowanego kodu:");
                
                if (prodName && prodName.trim()) {
                    state.statusMsg = '🤖 Pytam AI o produkt: ' + prodName + '...';
                    render();
                    try {
                        var promptStr = 'Oszacuj wartości odżywcze dla produktu o nazwie: "' + prodName.trim() + '". Zwróć odpowiedź WYŁĄCZNIE w formacie JSON bez znaczników markdown: {"name": "' + prodName.trim() + '", "weight": 100, "kcal": 100, "p": 5.0, "f": 2.0, "c": 15.0}. Załóż standardową porcję lub domyślnie 100g, jeśli nie masz pewności.';
                        var aiResponse = await callGeminiSmart(promptStr);
                        aiResponse = aiResponse.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/, "");
                        var aiParsed = JSON.parse(aiResponse);

                        state.scannedProductData = {
                            name: aiParsed.name + ' (AI)',
                            baseWeight: aiParsed.weight || 100,
                            baseKcal: aiParsed.kcal || 100,
                            baseP: aiParsed.p || 0,
                            baseF: aiParsed.f || 0,
                            baseC: aiParsed.c || 0,
                            addWeight: aiParsed.weight || 100,
                            category: "Inne"
                        };
                        state.statusMsg = '✅ AI błyskawicznie oszacowało produkt po Twojej nazwie!';
                        render();
                        return;
                    } catch(aiErr) {
                        alert('Błąd sztucznej inteligencji: ' + aiErr.message);
                    }
                }
            }

            state.statusMsg = '⚠️ Brak w bazie. Wpisz dane ręcznie.';
            alert('Nie znaleziono produktu w bazie. Wpisz dane ręcznie (lub dodaj klucz AI w ustawieniach, aby uaktywnić inteligentne szacowanie z nazwy).');
            render();
        };

        var html5QrCode = null;
        window.startBarcodeScanner = function() {
            if (typeof Html5Qrcode === 'undefined') {
                return alert('Biblioteka skanera się ładuje. Spróbuj za sekundę.');
            }
            state.isScanning = true;
            state.statusMsg = '📷 Kieruj aparat na kod kreskowy...';
            render();

            setTimeout(function() {
                var readerEl = document.getElementById("reader");
                if (!readerEl) return;

                try {
                    if (html5QrCode) {
                        try { html5QrCode.clear(); } catch(e) {}
                    }
                    html5QrCode = new Html5Qrcode("reader");
                    var config = { fps: 10, qrbox: { width: 240, height: 120 }, aspectRatio: 1.5 };

                    html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        function(decodedText) {
                            if (!state.isScanning) return;
                            state.isScanning = false;
                            state.scannedBarcodeInput = decodedText;
                            
                            var scannerRef = html5QrCode;
                            html5QrCode = null;

                            if (scannerRef) {
                                scannerRef.stop().then(function() {
                                    try { scannerRef.clear(); } catch(e) {}
                                    fetchProductByBarcode(decodedText);
                                }).catch(function() {
                                    fetchProductByBarcode(decodedText);
                                });
                            } else {
                                fetchProductByBarcode(decodedText);
                            }
                        },
                        function(errorMessage) {}
                    ).catch(function(err) {
                        state.isScanning = false;
                        state.statusMsg = '';
                        alert('Błąd uruchamiania aparatu: ' + err);
                        render();
                    });
                } catch(err) {
                    state.isScanning = false;
                    alert('Błąd skanera: ' + err.message);
                    render();
                }
            }, 250);
        };

                var temp = state.settings.categories[idx];
                state.settings.categories[idx] = state.settings.categories[idx + 1];
                state.settings.categories[idx + 1] = temp;
            }
            saveState(); render();
        };

        window.editCat = function(idx) {
            var oldName = state.settings.categories[idx];
            var newName = prompt('Zmień nazwę kategorii:', oldName);
            if (newName !== null && newName.trim() !== '' && newName.trim() !== oldName) {
                var cName = newName.trim();
                state.settings.categories[idx] = cName;
                state.products.forEach(function(p) {
                    if (p.category === oldName) p.category = cName;
                });
                state.statusMsg = 'Zaktualizowano nazwę kategorii!';
                saveState(); render();
            }
        };

        window.delCat = function(idx) {
            var catName = state.settings.categories[idx];
            if (confirm('Czy na pewno chcesz usunąć kategorię "' + catName + '"?\n\nWszystkie produkty z tej kategorii zostaną bezpiecznie przeniesione do "Inne".')) {
                state.settings.categories.splice(idx, 1);
                state.products.forEach(function(p) {
                    if (p.category === catName) p.category = 'Inne';
                });
                state.statusMsg = 'Kategoria została usunięta.';
                saveState(); render();
            }
        };

        window.toggleMultiSelect = function() {
            state.multiSelect = !state.multiSelect;
            state.selectedProds = {};
            render();
        };

        window.toggleProdSelect = function(id) {
            if (state.selectedProds[id]) delete state.selectedProds[id];
            else state.selectedProds[id] = true;
            render();
        };

        window.promptBulkMove = function() {
            var ids = Object.keys(state.selectedProds).filter(function(id) { return state.selectedProds[id]; });
            if(ids.length === 0) return alert('Nie zaznaczono żadnych produktów.');
            openCatModal(ids);
        };

        window.getDayData = function(customDate) {
            var targetDate = customDate || state.date;
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][targetDate]) {
                state.diaries[state.userId][targetDate] = { goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 }, meals: [], workouts: [], weight: '', water: 0, measurements: {} };
            }
            var d = state.diaries[state.userId][targetDate];
            if(d.water === undefined) d.water = 0; if(!d.measurements) d.measurements = {}; if(!d.meals) d.meals = []; if(!d.workouts) d.workouts = [];
            return d;
        };

        window.updateGoal = function(key, val) {
            var day = getDayData();
            day.goals[key] = parseFloat(val) || 0;
            saveState();
        };

        window.getDietDaysCounter = function() {
            var user = state.users.find(function(u) { return u.id === state.userId; }) || state.users[0];
            var diff = Math.floor((new Date(state.date) - new Date(user.startDate || state.date)) / (1000 * 60 * 60 * 24)); return diff >= 0 ? diff + 1 : 0;
        };

        window.setDayCounter = function(val) {
            var days = parseInt(val); if(isNaN(days) || days <= 0) return;
            var parts = state.date.split('-');
            var dObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            dObj.setDate(dObj.getDate() - (days - 1));
            state.users.find(function(u) { return u.id === state.userId; }).startDate = dObj.getFullYear() + '-' + String(dObj.getMonth() + 1).padStart(2, '0') + '-' + String(dObj.getDate()).padStart(2, '0');
            saveState(); render();
        };

        window.getFirstActiveEntryDate = function() {
            var userDiary = state.diaries[state.userId] || {}; var allDates = Object.keys(userDiary).sort();
            for (var i = 0; i < allDates.length; i++) { 
                var d = userDiary[allDates[i]]; 
                if (d.meals && d.meals.length > 0) return allDates[i]; 
            }
            return null;
        };

        window.getPrevWeight = function(currDate) {
            var userDiary = state.diaries[state.userId] || {};
            var dates = Object.keys(userDiary).sort();
            var prevW = null;
            var idx = dates.indexOf(currDate);
            var startIdx = idx === -1 ? dates.length - 1 : idx - 1;
            
            for(var i = startIdx; i >= 0; i--) {
                var dObj = userDiary[dates[i]];
                if(dObj && dObj.weight) {
                    var w = parseFloat(dObj.weight);
                    if(!isNaN(w)) { prevW = w; break; }
                }
            }
            return prevW;
        };

        window.changeDateOffset = function(days) {
            var parts = state.date.split('-');
            var dObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            dObj.setDate(dObj.getDate() + days);
            state.date = dObj.getFullYear() + '-' + String(dObj.getMonth() + 1).padStart(2, '0') + '-' + String(dObj.getDate()).padStart(2, '0');
            render();
        };

        window.changeDate = function(newDateStr) {
            if (newDateStr) {
                state.date = newDateStr;
                render();
            }
        };

        window.changeWeekOffset = function(val) { state.weekOffset += val; render(); };

        window.getFormattedDayName = function(dateStr) {
            var parts = dateStr.split('-');
            var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            var days = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
            return days[d.getDay()];
        };

        window.renderWeightChart = function() {
            var userDiary = state.diaries[state.userId] || {}; var dates = Object.keys(userDiary).sort(function(a,b) { return new Date(a) - new Date(b); }); var weights = [];
            dates.forEach(function(d) { var w = parseFloat(userDiary[d].weight); if(w && !isNaN(w)) weights.push({ date: d, val: w }); });
            var minWGlobal = weights.length ? Math.min.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var maxWGlobal = weights.length ? Math.max.apply(null, weights.map(function(w) { return w.val; })) : 0;
            var last14 = weights.slice(-14);
            if(last14.length < 2) return '<div class="text-xs opacity-60 text-center py-6 border border-dashed border-gray-300 rounded-xl">Dodaj wagę w minimum 2 dniach, aby zobaczyć wykres.</div>';

            var minW = Math.min.apply(null, last14.map(function(w) { return w.val; })); 
            var maxW = Math.max.apply(null, last14.map(function(w) { return w.val; }));
            var range = (maxW - minW) || 1; var w = 340, h = 100, padX = 20, padY = 20; var stepX = (w - padX * 2) / (last14.length - 1);
            var points = last14.map(function(pt, i) { return (padX + (i * stepX)) + ',' + (h - padY - (((pt.val - minW) / range) * (h - padY * 2))); }).join(' ');

            var circles = last14.map(function(pt, i) {
                var x = padX + (i * stepX), y = h - padY - (((pt.val - minW) / range) * (h - padY * 2));
                var label = (i === 0 || i === last14.length - 1) ? '<text x="' + x + '" y="' + (y - 8) + '" font-size="8" font-weight="bold" fill="#ec4899" text-anchor="middle">' + pt.val + '</text>' : '';
                return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#ffffff" stroke="#ec4899" stroke-width="2" />' + label;
            }).join('');

            return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full h-auto drop-shadow-sm bg-white/80 rounded-xl border border-gray-200 p-2"><polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + (h-padY) + ' ' + w + ',' + (h-padY) + '" /><polyline fill="none" stroke="#e5e7eb" stroke-width="1" points="0,' + padY + ' ' + w + ',' + padY + '" /><polyline fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' + points + '" />' + circles + '</svg><div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-200/50 px-1"><span class="text-[10px] font-bold opacity-70 uppercase">Min: <span class="text-emerald-500 ml-1">' + minWGlobal + ' kg</span></span><span class="text-[10px] font-bold opacity-70 uppercase">Max: <span class="text-rose-500 ml-1">' + maxWGlobal + ' kg</span></span></div>';
        };

        window.filterProductsDropdown = function(val) {
            state.prodSearch = val; var dropdown = document.getElementById('prodDropdownList'); if (!dropdown) return;
            if (!val || val.trim().length === 0) { dropdown.innerHTML = ''; dropdown.classList.add('hidden'); return; }
            var results = state.products.filter(function(p) { return p.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 15);
            if (results.length === 0) { dropdown.innerHTML = '<div class="p-2.5 text-xs text-gray-400 text-center">Brak produktów w bazie</div>'; dropdown.classList.remove('hidden'); return; }
            var html = ''; results.forEach(function(p) { html += '<div onclick="selectProdDrop(\'' + p.id + '\')" class="p-2.5 border-b border-gray-50 text-xs cursor-pointer hover:bg-gray-100"><span class="font-bold block truncate">' + p.name + '</span><span class="text-[9px] opacity-60">' + p.baseWeight + 'g opakowanie = ' + p.baseKcal + ' kcal</span></div>'; });
            dropdown.innerHTML = html; dropdown.classList.remove('hidden');
        };

        window.selectProdDrop = function(id) {
            var p = state.products.find(function(x) { return x.id === id; });
            if (p) {
                state.selectedProdId = id; state.prodSearch = p.name; state.inputWeight = p.baseWeight;
                var input = document.getElementById('pSearchInp'); var weightInput = document.getElementById('inpW');
                if (input) input.value = p.name; if (weightInput) weightInput.value = p.baseWeight;
                var dropdown = document.getElementById('prodDropdownList'); if (dropdown) dropdown.classList.add('hidden');
            }
        };

        window.promptEditMealWeight = function(mealId) {
            var day = getDayData();
            var meal = day.meals.find(function(m) { return m.id === mealId; });
            if (!meal) return;
            var newW = prompt('Edytuj wagę dla posiłku "' + meal.name + '":\nPodaj nową wagę (g):', meal.weight);
            if (newW === null) return;
            var wVal = parseFloat(newW);
            if (isNaN(wVal) || wVal <= 0) return alert('Podaj prawidłową wagę!');

            var prod = state.products.find(function(x) { return x.name.toLowerCase() === meal.name.replace(' (AI)', '').toLowerCase(); });
            if (prod && prod.baseWeight > 0) {
                var r = wVal / prod.baseWeight;
                meal.weight = wVal;
                meal.kcal = Math.round(prod.baseKcal * r);
                meal.p = Math.round(prod.baseP * r * 10) / 10;
                meal.f = Math.round(prod.baseF * r * 10) / 10;
                meal.c = Math.round(prod.baseC * r * 10) / 10;
            } else {
                var ratio = wVal / meal.weight;
                meal.weight = wVal;
                meal.kcal = Math.round(meal.kcal * ratio);
                meal.p = Math.round(meal.p * ratio * 10) / 10;
                meal.f = Math.round(meal.f * ratio * 10) / 10;
                meal.c = Math.round(meal.c * ratio * 10) / 10;
            }
            state.statusMsg = 'Zaktualizowano wagę posiłku!';
            saveState(); render();
        };

        window.moveMeal = function(idx, dir) {
            var day = getDayData();
            if (dir === -1 && idx > 0) {
                var temp = day.meals[idx];
                day.meals[idx] = day.meals[idx - 1];
                day.meals[idx - 1] = temp;
            } else if (dir === 1 && idx < day.meals.length - 1) {
                var temp = day.meals[idx];
                day.meals[idx] = day.meals[idx + 1];
                day.meals[idx + 1] = temp;
            }
            saveState(); render();
        };

        window.changeWeight = function(w) { 
            getDayData().weight = w; 
            saveState(); 
            render(); 
        };

        window.promptRenameUser = function(uid) {
            var u = state.users.find(function(x) { return x.id === uid; });
            if (!u) return;
            var newName = prompt('Zmień imię profilu:', u.name);
            if (newName !== null && newName.trim() !== '') {
                u.name = newName.trim();
                saveState(); render();
            }
        };

        window.exportFullJson = function() {
            var payload = { version: 60, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, theme: state.theme };
            var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = 'dieta_' + state.date + '.json'; a.click();
            state.settings.lastBackup = new Date().toISOString().split('T')[0]; saveState(); state.statusMsg = 'Pobrano plik kopii zapasowej!'; render();
        };

        window.importFullJson = function() {
            try {
                var data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    var names = new Set(state.products.map(function(p) { return p.name.trim().toLowerCase(); })); var added = 0;
                    (data.products || []).forEach(function(p) { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = 'Wgrano ' + added + ' nowych produktów.';
                } else {
                    if (!confirm('Połączyć wgrywaną kopię z obecną historią?')) return;
                    if (data.products) { state.products = data.products; initLocalDefaults(); }
                    if (data.diaries) state.diaries = safeMergeDiaries(data.diaries, state.diaries);
                    if (data.users) state.users = data.users; 
                    if (data.settings) {
                        state.settings = data.settings;
                        if(!state.settings.categories) state.settings.categories = DEFAULT_CATEGORIES.slice();
                    }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.theme) state.theme = data.theme;
                    state.isCloudSynced = true;
                    state.statusMsg = 'Kopia wgrana i bezpiecznie połączona!';
                }
                saveState(); render();
            } catch(e) { alert('Błąd odczytu JSON!'); }
        };

        var touchStartX = 0, touchEndX = 0, tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
        window.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, false);
        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            var threshold = 70;
            if (touchEndX < touchStartX - threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx < tabsOrder.length - 1) { switchTab(tabsOrder[idx + 1]); }
            }
            if (touchEndX > touchStartX + threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx > 0) { switchTab(tabsOrder[idx - 1]); }
            }
        }, false);

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Dziennik Diety</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { overflow-x: hidden; width: 100%; position: relative; }
        body { -webkit-tap-highlight-color: transparent; }
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fab-gemini { position: fixed; bottom: 80px; right: 20px; z-index: 40; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24 select-none">
    <div id="app" class="max-w-md w-full mx-auto min-h-screen bg-white shadow-xl relative overflow-x-hidden flex flex-col"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
        }

        const FULL_PRODUCTS = [
            { id: "hb1", name: "Fruvita Skyr naturalny (150g)", baseWeight: 150, baseKcal: 98, baseP: 18.0, baseF: 0.0, baseC: 6.2 },
            { id: "hb2", name: "Fruvita Skyr pitny (360g)", baseWeight: 360, baseKcal: 225, baseP: 36.0, baseF: 1.0, baseC: 16.0 },
            { id: "hb3", name: "Fruvita Skyr owocowy (150g)", baseWeight: 150, baseKcal: 129, baseP: 14.4, baseF: 0.0, baseC: 18.0 },
            { id: "hb4", name: "Go Active Protein Pudding (200g)", baseWeight: 200, baseKcal: 152, baseP: 20.0, baseF: 3.0, baseC: 11.0 },
            { id: "hb5", name: "Go Active Protein Napój (350g)", baseWeight: 350, baseKcal: 215, baseP: 35.0, baseF: 0.7, baseC: 17.2 },
            { id: "hb6", name: "Go Active Protein Kaszka (200g)", baseWeight: 200, baseKcal: 160, baseP: 15.0, baseF: 3.5, baseC: 17.0 },
            { id: "hb7", name: "Go Active Protein Mousse (200g)", baseWeight: 200, baseKcal: 158, baseP: 20.0, baseF: 3.0, baseC: 12.4 },
            { id: "hb8", name: "Go Active Serek wiejski (200g)", baseWeight: 200, baseKcal: 184, baseP: 28.0, baseF: 6.0, baseC: 4.6 },
            { id: "hb9", name: "Müllermilch Protein Zero (400g)", baseWeight: 400, baseKcal: 248, baseP: 26.0, baseF: 6.8, baseC: 20.4 },
            { id: "hb10", name: "Müllermilch Protein klas. (400g)", baseWeight: 400, baseKcal: 336, baseP: 26.0, baseF: 6.4, baseC: 42.4 },
            { id: "hb11", name: "Piątnica Skyr naturalny (150g)", baseWeight: 150, baseKcal: 96, baseP: 18.0, baseF: 0.0, baseC: 6.0 },
            { id: "hb12", name: "Piątnica Skyr naturalny (450g)", baseWeight: 450, baseKcal: 288, baseP: 54.0, baseF: 0.0, baseC: 18.0 },
            { id: "hb13", name: "Piątnica Skyr waniliowy (150g)", baseWeight: 150, baseKcal: 123, baseP: 14.4, baseF: 0.0, baseC: 16.5 },
            { id: "hb14", name: "Piątn
                        function loadStorage(key, fallback) {
            try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : fallback; } 
            catch (e) { return fallback; }
        }

        const state = {
            tab: 'dziennik',
            users: loadStorage('diet_v10_users', loadStorage('diet_v9_users', [
                { id: 'u1', name: 'Ja', startDate: new Date().toISOString().split('T')[0] }, 
                { id: 'u2', name: 'Żona', startDate: new Date().toISOString().split('T')[0] }
            ])),
            userId: localStorage.getItem('diet_v10_curr_user') || localStorage.getItem('diet_v9_curr_user') || 'u1',
            products: [], 
            workoutsDb: loadStorage('diet_v10_workouts_db', loadStorage('diet_v9_workouts_db', [])),
            diaries: loadStorage('diet_v10_diaries', loadStorage('diet_v9_diaries', {})),
            settings: loadStorage('diet_v10_settings', loadStorage('diet_v9_settings', { 
                startOfWeek: 1, geminiApiKey: '', lastBackup: '', measurements: [] 
            })),
            date: new Date().toISOString().split('T')[0],
            isEditingGoals: false,
            importMode: 'full',
            statusMsg: '',
            
            prodSearch: '', prodResults: [], selectedProdId: '', inputWeight: '',
            wSearch: '', wResults: [], wInputTime: '', wInputKcal: '',
            
            chatOpen: false, chatHistory: [], chatLoading: false,
            editProdId: null
        };

        function initData() {
            let saved = loadStorage('diet_v10_products', loadStorage('diet_v9_products', []));
            const names = new Set(saved.map(p => p.name.trim().toLowerCase()));
            FULL_PRODUCTS.forEach(bp => {
                if (!names.has(bp.name.trim().toLowerCase())) { saved.push(bp); names.add(bp.name.trim().toLowerCase()); }
            });
            state.products = saved;

            if(state.settings.geminiApiKey === undefined) state.settings.geminiApiKey = '';
            if(state.settings.lastBackup === undefined) state.settings.lastBackup = '';
            if(!state.settings.measurements || state.settings.measurements.length === 0) {
                state.settings.measurements = [
                    { id: 'waist', name: 'Pas' }, { id: 'biceps', name: 'Biceps' },
                    { id: 'chest', name: 'Klatka' }, { id: 'thigh', name: 'Udo' }
                ];
            }
            
            if(state.chatHistory.length === 0) {
                state.chatHistory.push({ role: 'model', text: 'Cześć! Jestem Twoim asystentem AI. Powiedz mi co zjadłeś, a oszacuję kalorie i pozwolę Ci to dodać!' });
            }
        }
        initData();

        function saveState() {
            localStorage.setItem('diet_v10_users', JSON.stringify(state.users));
            localStorage.setItem('diet_v10_curr_user', state.userId);
            localStorage.setItem('diet_v10_products', JSON.stringify(state.products));
            localStorage.setItem('diet_v10_workouts_db', JSON.stringify(state.workoutsDb));
            localStorage.setItem('diet_v10_diaries', JSON.stringify(state.diaries));
            localStorage.setItem('diet_v10_settings', JSON.stringify(state.settings));
        }

        function getDayData() {
            if (!state.diaries[state.userId]) state.diaries[state.userId] = {};
            if (!state.diaries[state.userId][state.date]) {
                state.diaries[state.userId][state.date] = {
                    goals: state.userId === 'u1' ? { kcal: 2500, p: 170, f: 70, c: 220 } : { kcal: 2000, p: 120, f: 60, c: 180 },
                    meals: [], workouts: [], weight: '', water: 0, measurements: {}
                };
            }
            if(state.diaries[state.userId][state.date].water === undefined) state.diaries[state.userId][state.date].water = 0;
            if(state.diaries[state.userId][state.date].measurements === undefined) state.diaries[state.userId][state.date].measurements = {};
            
            return state.diaries[state.userId][state.date];
        }

        function getDietDaysCounter() {
            const user = state.users.find(u => u.id === state.userId);
            const start = new Date(user.startDate);
            const current = new Date(state.date);
            const diff = Math.floor((current - start) / (1000 * 60 * 60 * 24));
            return diff >= 0 ? diff + 1 : 0;
        }

        function renderWeightChart() {
            const userDiary = state.diaries[state.userId] || {};
            const dates = Object.keys(userDiary).sort((a,b) => new Date(a) - new Date(b));
            
            const weights = [];
            dates.forEach(d => {
                const w = parseFloat(userDiary[d].weight);
                if(w && !isNaN(w)) weights.push({ date: d, val: w });
            });
            
            const minWGlobal = weights.length ? Math.min(...weights.map(w => w.val)) : 0;
            const maxWGlobal = weights.length ? Math.max(...weights.map(w => w.val)) : 0;
            
            const last14 = weights.slice(-14);
            if(last14.length < 2) return `<div class="text-xs text-gray-400 text-center py-6 border border-dashed border-gray-200 rounded-xl">Dodaj wagę przez min. 2 dni, by wygenerować wykres.</div>`;

            const minW = Math.min(...last14.map(w => w.val));
            const maxW = Math.max(...last14.map(w => w.val));
            const range = (maxW - minW) || 1;
            
            const w = 340; const h = 100; const padX = 20; const padY = 20;
            const usableW = w - (padX * 2);
            const usableH = h - (padY * 2);
            const stepX = usableW / (last14.length - 1);

            let points = last14.map((pt, i) => {
                const x = padX + (i * stepX);
                const y = h - padY - (((pt.val - minW) / range) * usableH);
                return `${x},${y}`;
            }).join(' ');

            return `
                <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto drop-shadow-md bg-white rounded-xl border border-indigo-100 p-2">
                    <polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,${h-padY} ${w},${h-padY}" />
                    <polyline fill="none" stroke="#e0e7ff" stroke-width="1" points="0,${padY} ${w},${padY}" />
                    <polyline fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
                    ${last14.map((pt, i) => {
                        const x = padX + (i * stepX);
                        const y = h - padY - (((pt.val - minW) / range) * usableH);
                        return \`<circle cx="\${x}" cy="\${y}" r="3" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
                                \${i === 0 || i === last14.length - 1 ? \`<text x="\${x}" y="\${y - 8}" font-size="8" font-weight="bold" fill="#4f46e5" text-anchor="middle">\${pt.val}</text>\` : ''}\`;
                    }).join('')}
                </svg>
                <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100 px-1">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Min (Cała dieta): <span class="text-blue-600 ml-1">\${minWGlobal} kg</span></span>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Max (Cała dieta): <span class="text-red-500 ml-1">\${maxWGlobal} kg</span></span>
                </div>
            `;
        }

        function checkBackupReminder() {
            const now = new Date();
            const isSunday = now.getDay() === 0;
            const isAfternoon = now.getHours() >= 12;
            const todayStr = now.toISOString().split('T')[0];
            return isSunday && isAfternoon && state.settings.lastBackup !== todayStr;
        }
        function render() {
            const app = document.getElementById('app');
            const day = getDayData();
            const user = state.users.find(u => u.id === state.userId);

            let eatenKcal = 0, eatenP = 0, eatenF = 0, eatenC = 0;
            day.meals.forEach(m => { eatenKcal += m.kcal; eatenP += m.p; eatenF += m.f; eatenC += m.c; });
            const burned = day.workouts.reduce((s, w) => s + w.kcal, 0);
            
            const nettoKcal = Math.max(0, eatenKcal - burned);
            const left = day.goals.kcal - nettoKcal;
            
            let statusLabel = 'Zostało na dziś';
            let statusColor = 'text-emerald-500';
            let bgClass = 'bg-gray-50';

            if (left < 0) {
                statusLabel = 'Nadwyżka';
                statusColor = 'text-red-500';
                bgClass = 'bg-red-50 border-red-100';
            } else if (eatenKcal > day.goals.kcal && left >= 0) {
                statusLabel = 'Zostało z treningu';
                statusColor = 'text-blue-500';
                bgClass = 'bg-blue-50 border-blue-100';
            }

            const showReminder = checkBackupReminder();

            let html = \`
                \${showReminder ? \`<div class="bg-yellow-400 text-yellow-900 text-[10px] font-bold text-center py-1.5 px-4 shadow-sm z-50">⚠️ Jest niedziela po południu! Zrób tygodniową kopię zapasową w Ustawieniach.</div>\` : ''}
                <div class="bg-blue-600 text-white p-4 shadow-md w-full">
                    <div class="flex justify-between items-center mb-3">
                        <h1 class="text-xl font-bold tracking-tight">Dziennik Diety</h1>
                        <div class="flex items-center space-x-1 bg-blue-800 px-2 py-1 rounded-full shadow-inner text-xs font-bold">
                            <span>Dzień:</span>
                            <input type="number" value="\${getDietDaysCounter()}" onchange="setDayCounter(this.value)" class="w-10 bg-transparent text-white text-center outline-none border-b border-blue-400" />
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 bg-blue-700 p-1.5 rounded-lg shadow-inner">
                        <span class="text-[10px] text-blue-200 pl-2 font-bold uppercase tracking-wider">Profil:</span>
                        <div class="flex space-x-1 flex-1">
                            \${state.users.map(u => \`
                                <button onclick="switchUser('\${u.id}')" class="flex-1 py-1.5 rounded-md text-xs font-bold transition-colors truncate \${state.userId === u.id ? 'bg-white text-blue-700 shadow' : 'text-white hover:bg-blue-500'}">
                                    \${u.name}
                                </button>
                            \`).join('')}
                        </div>
                    </div>
                </div>
                <div class="p-3 w-full flex-1 overflow-x-hidden relative">
            \`;

            if (state.tab === 'dziennik') {
                html += \`
                    <div class="flex space-x-2 mb-3">
                        <div class="flex-1 bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 min-w-0">
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-0.5 block">Data</label>
                            <input type="date" value="\${state.date}" onchange="changeDate(this.value)" class="w-full text-xs font-bold text-gray-700 bg-transparent outline-none" />
                        </div>
                        <div class="w-24 bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 shrink-0">
                            <label class="text-[10px] font-bold text-gray-400 uppercase mb-0.5 block">Waga (kg)</label>
                            <input type="number" step="0.1" value="\${day.weight}" onchange="changeWeight(this.value)" class="w-full text-xs font-bold text-gray-700 text-center bg-transparent outline-none" />
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-blue-900 text-xs">🎯 Cel (\${user.name}): \${day.goals.kcal} kcal</span>
                            <button onclick="toggleGoals()" class="text-[10px] bg-blue-600 text-white px-2 py-1 rounded font-bold shadow-sm hover:bg-blue-700">
                                \${state.isEditingGoals ? 'Zamknij' : 'Edytuj'}
                            </button>
                        </div>
                        \${state.isEditingGoals ? \`
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <div><label class="text-[10px] font-bold text-blue-700">Kcal</label><input id="gKcal" type="number" value="\${day.goals.kcal}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Białko (g)</label><input id="gP" type="number" value="\${day.goals.p}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Tłuszcz (g)</label><input id="gF" type="number" value="\${day.goals.f}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                                <div><label class="text-[10px] font-bold text-blue-700">Węglo (g)</label><input id="gC" type="number" value="\${day.goals.c}" class="w-full p-1.5 text-xs rounded border border-blue-200" /></div>
                            </div>
                            <button onclick="saveGoals()" class="w-full bg-blue-600 text-white py-1.5 rounded font-bold text-xs">Zapisz cel</button>
                        \` : ''}
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-center w-1/3">
                                <p class="text-[9px] font-bold text-gray-400 uppercase">Zjedzono</p>
                                <p class="text-lg font-black text-gray-800">\${Math.round(eatenKcal)}</p>
                            </div>
                            <div class="text-center w-1/3 border-x border-gray-100">
                                <p class="text-[9px] font-bold text-orange-400 uppercase">Spalone</p>
                                <p class="text-lg font-black text-orange-500">-\${burned}</p>
                            </div>
                            <div class="text-center w-1/3">
                                <p class="text-[9px] font-bold text-blue-400 uppercase">Kcal Netto</p>
                                <p class="text-lg font-black text-blue-600">\${Math.round(nettoKcal)}</p>
                            </div>
                        </div>
                        <div class="\${bgClass} border rounded-lg p-2 flex justify-between items-center mb-3 transition-colors">
                            <span class="text-[10px] font-bold text-gray-500 uppercase">\${statusLabel}</span>
                            <span class="text-xl font-black \${statusColor}">\${Math.abs(Math.round(left))} kcal</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mb-3">
                            <div class="bg-blue-50 text-blue-800 py-1 rounded text-center text-[10px] font-bold">B: \${Math.round(eatenP)}/\${day.goals.p}g</div>
                            <div class="bg-amber-50 text-amber-800 py-1 rounded text-center text-[10px] font-bold">T: \${Math.round(eatenF)}/\${day.goals.f}g</div>
                            <div class="bg-emerald-50 text-emerald-800 py-1 rounded text-center text-[10px] font-bold">W: \${Math.round(eatenC)}/\${day.goals.c}g</div>
                        </div>
                        
                        <!-- Woda Tracker -->
                        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                            <span class="text-[10px] font-bold text-blue-400 uppercase">Wypito: <span class="text-blue-600 text-sm ml-1">\${(parseFloat(day.water) || 0).toFixed(2)} L</span></span>
                            <div class="flex space-x-1">
                                <button onclick="addWater(0.25)" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-2 py-1 rounded-lg text-[10px] font-bold transition-colors">+0.25L</button>
                                <button onclick="addWater(0.5)" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-2 py-1 rounded-lg text-[10px] font-bold transition-colors">+0.5L</button>
                                <button onclick="addWater(1.0)" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-2 py-1 rounded-lg text-[10px] font-bold transition-colors">+1L</button>
                                <button onclick="addWater(0)" class="bg-red-50 hover:bg-red-100 text-red-500 px-2 py-1 rounded-lg text-[10px] font-bold transition-colors ml-1">Reset</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
                        <h3 class="font-bold text-sm text-gray-800 mb-2 flex items-center">🍽️ Posiłki</h3>
                        <div class="flex space-x-2 mb-3 relative">
                            <div class="relative flex-1 min-w-0">
                                <input id="pSearchInp" placeholder="Wpisz (np. skyr)..." value="\${state.prodSearch}" oninput="searchProd(this.value)" autocomplete="off" class="w-full bg-gray-50 border border-gray-200 rounded-lg text-xs font-medium px-3 py-2 outline-none focus:border-blue-400" />
                                \${state.prodResults.length > 0 ? \`
                                    <div class="absolute top-full left-0 w-full mt-1 bg-white border border-gray-200 shadow-xl rounded-lg max-h-48 overflow-y-auto z-50">
                                        \${state.prodResults.map(p => \`
                                            <div onclick="selectProdDrop('\${p.id}')" class="p-2.5 border-b border-gray-50 text-xs cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition-colors">
                                                <span class="font-bold text-gray-800 block truncate">\${p.name}</span>
                                                <span class="text-[9px] text-gray-500">\${p.baseWeight}g = \${p.baseKcal} kcal</span>
                                            </div>
                                        \`).join('')}
                                    </div>
                                \` : ''}
                            </div>
                            <input id="inpW" type="number" placeholder="Waga(g)" value="\${state.inputWeight}" oninput="state.inputWeight=this.value" class="w-16 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold text-center outline-none shrink-0" />
                            <button onclick="addMeal()" class="bg-blue-600 text-white px-3 rounded-lg font-bold shadow-md active:scale-95 shrink-0">+</button>
                        </div>
                        <div class="space-y-2">
                            \${day.meals.length === 0 ? '<p class="text-[10px] text-gray-400 text-center py-2">Brak posiłków</p>' : ''}
                            \${day.meals.map(m => \`
                                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <div class="flex-1 pr-1 min-w-0">
                                        <p class="font-bold text-xs text-gray-800 truncate">\${m.name}</p>
                                        <p class="text-[9px] text-gray-500 mt-0.5">\${m.weight}g | B:\${m.p} T:\${m.f} W:\${m.c}</p>
                                    </div>
                                    <div class="flex items-center space-x-2 shrink-0">
                                        <span class="font-black text-gray-700 text-xs">\${m.kcal} <span class="font-normal text-[9px] text-gray-400">kcal</span></span>
                                        <button onclick="delMeal(\${m.id})" class="text-red-400 font-bold px-2">✕</button>
                                    </div>
                                </div>
                            \`).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100">
                        <h3 class="font-bold text-sm text-orange-600 mb-2 flex items-center">🔥 Dodaj trening (Dzisiaj)</h3>
                        <div class="flex space-x-2 mb-3 relative">
                            <div class="relative flex-1 min-w-0">
                                <input id="wNameInp" placeholder="Nazwa np. Bieganie" value="\${state.wSearch}" oninput="searchWorkout(this.value)" autocomplete="off" class="w-full bg-orange-50/50 border border-orange-100 rounded-lg text-xs px-2 py-2 outline-none focus:border-orange-300" />
                                \${state.wResults.length > 0 ? \`
                                    <div class="absolute top-full left-0 w-full mt-1 bg-white border border-orange-200 shadow-xl rounded-lg max-h-40 overflow-y-auto z-50">
                                        \${state.wResults.map(w => \`
                                            <div onclick="selectWorkoutDrop('\${w.name}')" class="p-2 border-b border-gray-50 text-xs cursor-pointer hover:bg-orange-50 active:bg-orange-100">
                                                <span class="font-bold text-orange-900 block truncate">\${w.name}</span>
                                                <span class="text-[9px] text-gray-500">\${w.time} min | \${w.kcal} kcal</span>
                                            </div>
                                        \`).join('')}
                                    </div>
                                \` : ''}
                            </div>

            const existing = state.workoutsDb.find(w => w.name.toLowerCase() === name.toLowerCase());
            if (!existing) state.workoutsDb.push({ name, time, kcal });

            getDayData().workouts.push({ id: Date.now(), name, time, kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = [];
            saveState(); render();
        };

        window.delWorkout = (id) => { getDayData().workouts = getDayData().workouts.filter(x => x.id !== id); saveState(); render(); };

        window.saveGoals = () => {
            const kcal = parseFloat(document.getElementById('gKcal').value) || 0;
            const p = parseFloat(document.getElementById('gP').value) || 0;
            const f = parseFloat(document.getElementById('gF').value) || 0;
            const c = parseFloat(document.getElementById('gC').value) || 0;
            state.isEditingGoals = false; getDayData().goals = { kcal, p, f, c };
            saveState(); render();
        };

        window.startEditProd = (id) => {
            state.editProdId = id;
            render();
            setTimeout(() => { document.getElementById('prodForm').scrollIntoView({behavior: 'smooth'}); }, 100);
        };

        window.cancelEditProd = () => {
            state.editProdId = null;
            render();
        };

        window.addProd = () => {
            const name = document.getElementById('pName').value.trim();
            const w = parseFloat(document.getElementById('pW').value) || 100;
            const p = parseFloat(document.getElementById('pP').value) || 0;
            const f = parseFloat(document.getElementById('pF').value) || 0;
            const c = parseFloat(document.getElementById('pC').value) || 0;
            const k = document.getElementById('pK').value;
            const kcal = k !== '' ? parseFloat(k) : Math.round(p*4 + c*4 + f*9);
            
            if (!name) return alert('Podaj nazwę!');
            
            if(state.editProdId) {
                const prod = state.products.find(x => x.id === state.editProdId);
                if(prod) {
                    prod.name = name; prod.baseWeight = w; prod.baseKcal = kcal;
                    prod.baseP = p; prod.baseF = f; prod.baseC = c;
                }
                state.editProdId = null;
            } else {
                state.products.unshift({ id: String(Date.now()), name, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c });
            }
            saveState(); render();
        };

        window.delProd = (id) => { if (confirm('Usunąć ten produkt z bazy?')) { state.products = state.products.filter(x => x.id !== id); saveState(); render(); } };

        window.exportFullJson = () => {
            const payload = { version: 10, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dieta_${state.date}.json`; a.click();
            
            state.settings.lastBackup = new Date().toISOString().split('T')[0];
            saveState();
            state.statusMsg = 'Pobrano plik kopii zapasowej!'; render();
        };

        window.importFullJson = () => {
            try {
                const data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    const incoming = data.products || [];
                    const names = new Set(state.products.map(p => p.name.trim().toLowerCase()));
                    let added = 0;
                    incoming.forEach(p => { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = `Wgrano ${added} nowych produktów.`;
                } else {
                    if (!confirm('Nadpisać całą historię? Opcja nieodwracalna.')) return;
                    if (data.products) state.products = data.products;
                    if (data.diaries) state.diaries = data.diaries;
                    if (data.users) state.users = data.users;
                    if (data.settings) state.settings = data.settings;
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    state.statusMsg = 'Kopia wgrana pomyślnie!';
                }
                saveState(); render();
            } catch(e) { alert('Błąd odczytu JSON! Upewnij się, że skopiowałeś cały kod z pliku.'); }
        };

        window.toggleChat = () => {
            if(!state.settings.geminiApiKey) {
                alert('Najpierw wklej klucz API z Google AI Studio w zakładce Kopia (na samym dole)!');
                switchTab('kopia'); return;
            }
            state.chatOpen = !state.chatOpen; render();
            if(state.chatOpen) setTimeout(() => document.getElementById('chatInput').focus(), 100);
        };

        window.sendChat = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            state.chatHistory.push({ role: 'user', text: text });
            state.chatLoading = true; render();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.settings.geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: "Jesteś polskim asystentem dietetycznym. Oszacuj kalorie i makro posiłku z wiadomości. Odpowiedz krótko. ZAWSZE na końcu odpowiedzi dodaj formatowany blok kodu w markdown, zawierający wyłącznie JSON. Przykład: ```json\n{\"name\":\"Kebab w tortilli\",\"kcal\":850,\"p\":40,\"f\":45,\"c\":70}\n```" }]},
                        contents: state.chatHistory.map(m => ({ role: m.role, parts: [{ text: m.text }] }))
                    })
                });
                
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let botText = data.candidates[0].content.parts[0].text;
                let parsedFood = null;

                const jsonMatch = botText.match(/```json\n([\s\S]*?)\n```/);
                if(jsonMatch) {
                    try {
                        parsedFood = JSON.parse(jsonMatch[1].trim());
                        botText = botText.replace(jsonMatch[0], '');
                    } catch(e){}
                }

                state.chatHistory.push({ role: 'model', text: botText.trim(), parsedFood });
            } catch (err) { state.chatHistory.push({ role: 'model', text: 'Błąd API Gemini: ' + err.message }); }
            
            state.chatLoading = false; render();
        };

        window.addGeminiMeal = (encodedJson) => {
            const food = JSON.parse(decodeURIComponent(encodedJson));
            getDayData().meals.push({ 
                id: Date.now(), name: food.name + " (AI)", 
                weight: 100, kcal: food.kcal, p: food.p, f: food.f, c: food.c 
            });
            saveState(); state.chatOpen = false; render();
        };

        render();
    </script>
</body>
</html>

        function initLocalDefaults() {
            if(!state.settings.categories || state.settings.categories.length === 0) {
                state.settings.categories = DEFAULT_CATEGORIES.slice();
            }
            try {
                if (!state.products || !Array.isArray(state.products)) state.products = [];
                FULL_PRODUCTS.forEach(function(bp) {
                    if (!state.products.some(function(p) { return p.name.trim().toLowerCase() === bp.name.trim().toLowerCase(); })) {
                        state.products.push(bp);
                    }
                });
                state.products.forEach(function(p) {
                    if (!p.category) p.category = 'Inne';
                });
            } catch(e) {
                state.products = FULL_PRODUCTS.slice(); 
            }
        }
        initLocalDefaults();

        function safeMergeDiaries(cloudDiaries, locDiaries) {
            var result = JSON.parse(JSON.stringify(cloudDiaries || {}));
            Object.keys(locDiaries || {}).forEach(function(uid) {
                if (!result[uid]) result[uid] = {};
                Object.keys(locDiaries[uid] || {}).forEach(function(dt) {
                    var cDay = result[uid][dt];
                    var lDay = locDiaries[uid][dt];
                    if (!cDay) {
                        result[uid][dt] = lDay;
                    } else {
                        var cMeals = (cDay.meals || []).length;
                        var lMeals = (lDay.meals || []).length;
                        if (lMeals > cMeals) result[uid][dt].meals = lDay.meals;
                        if (!cDay.weight && lDay.weight) result[uid][dt].weight = lDay.weight;
                        if (lDay.isEnded !== undefined && !cDay.isEnded) result[uid][dt].isEnded = lDay.isEnded;
                        if (lDay.measurements) {
                            if (!cDay.measurements) cDay.measurements = {};
                            Object.keys(lDay.measurements).forEach(function(mId) {
                                if (!cDay.measurements[mId] && lDay.measurements[mId]) {
                                    cDay.measurements[mId] = lDay.measurements[mId];
                                }
                            });
                        }
                    }
                });
            });
            return result;
        }

        if (typeof db !== 'undefined') {
            db.collection("dieta").doc("dane_wspolne").onSnapshot(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    if (Object.keys(state.diaries).length > 0) {
                        localStorage.setItem('diet_emergency_snapshot', JSON.stringify({
                            diaries: state.diaries, products: state.products, timestamp: new Date().toLocaleTimeString()
                        }));
                    }
                    if (data.products && data.products.length > 0) { state.products = data.products; initLocalDefaults(); }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.diaries) {
                        state.diaries = safeMergeDiaries(data.diaries, state.diaries);
                    }
                    if (data.users) state.users = data.users;
                    if (data.settings) {
                        state.settings = data.settings;
                        if(!state.settings.categories) state.settings.categories = DEFAULT_CATEGORIES.slice();
                    }
                }
                state.isCloudSynced = true;
                localStorage.setItem('diet_local_diaries_vault', JSON.stringify(state.diaries));
                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));
                if (!state.isScanning) {
                    render();
                }
            }, function(err) { 
                console.log("Błąd chmury:", err); 
                if (!state.isScanning) render();
            });
        }

        window.saveState = function() {
            try {
                var prevVault = localStorage.getItem('diet_local_diaries_vault');
                if (prevVault && prevVault.length > 50 && prevVault !== "null") {
                    localStorage.setItem('diet_previous_auto_backup', prevVault);
                }
                localStorage.setItem('diet_local_diaries_vault', JSON.stringify(state.diaries));
                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));
                localStorage.setItem('diet_v15_curr_user', state.userId);
                localStorage.setItem('diet_v56_theme', state.theme);
                localStorage.setItem('diet_gemini_key', state.geminiApiKey);
            } catch(e) {}

            if (!state.isCloudSynced) return;

            if (typeof db !== 'undefined') {
                db.collection("dieta").doc("dane_wspolne").set({
                    products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, users: state.users, settings: state.settings
                }, { merge: true }).catch(function(e){ console.log("Zapis do chmury nie powiódł się:", e); });
            }
        };

        window.restoreLastAutoBackup = function() {
            var backupStr = localStorage.getItem('diet_previous_auto_backup') || localStorage.getItem('diet_emergency_snapshot');
            if (!backupStr || backupStr === "null") return alert('Brak wcześniejszej zdrowej migawki w pamięci urządzenia.');
            if (!confirm('Czy chcesz przywrócić stan dziennika z ostatniej automatycznej migawki?')) return;
            try {
                var parsed = JSON.parse(backupStr);
                var diariesToRestore = parsed.diaries ? parsed.diaries : parsed;
                state.diaries = safeMergeDiaries(diariesToRestore, state.diaries);
                saveState();
                state.statusMsg = '✅ Przywrócono dane z migawki bezpieczeństwa!';
                render();
            } catch(e) { alert('Błąd przywracania: ' + e.message); }
        };

        window.scanPhoneMemoryForHistory = function() {
            var foundKeys = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                var val = localStorage.getItem(k);
                if (val && val !== "null" && (val.includes('meals') || val.includes('baseKcal') || val.includes('u1'))) {
                    foundKeys.push(k + ' (' + Math.round(val.length / 1024 * 10) / 10 + ' KB)');
                }
            }
            if (foundKeys.length > 0) {
                alert('Znaleziono w pamięci telefonu następujące sejfy danych:\n\n' + foundKeys.join('\n') + '\n\nDane są zintegrowane z Twoją bazą!');
            } else {
                alert('Przeskanowano pamięć przeglądarki – brak innych ukrytych kopii poza obecną.');

        async function executeGeminiFetch(fullModelName, key, promptStr) {
            var path = fullModelName.startsWith('models/') ? fullModelName : ('models/' + fullModelName);
            var url = 'https://generativelanguage.googleapis.com/v1beta/' + path + ':generateContent';

            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
            });

            if (res.ok) {
                var data = await res.json();
                return data.candidates[0].content.parts[0].text.trim();
            }

            if (res.status === 401 || res.status === 403) {
                var resB = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
                });
                if (resB.ok) {
                    var dataB = await resB.json();
                    return dataB.candidates[0].content.parts[0].text.trim();
                }
            }
            
            var errObj = await res.json().catch(function(){ return {}; });
            var msg = (errObj.error && errObj.error.message) ? errObj.error.message : ('Status ' + res.status);
            throw new Error(msg);
        }

        window.callGeminiSmart = async function(promptStr) {
            var key = state.geminiApiKey.trim();
            if (!key) throw new Error('Wklej klucz API w zakładce Ustawienia!');

            if (state.workingModelPath) {
                try {
                    return await executeGeminiFetch(state.workingModelPath, key, promptStr);
                } catch(e) {
                    state.workingModelPath = '';
                }
            }

            var lastError = '';
            try {
                var listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
                    method: 'GET',
                    headers: { 'x-goog-api-key': key }
                });
                
                if (listRes.ok) {
                    var listData = await listRes.json();
                    var models = listData.models || [];
                    var supported = models.filter(function(m) {
                        return m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && m.name.includes('gemini');
                    });

                    supported.sort(function(a, b) {
                        var aFlash = a.name.includes('flash') ? 0 : 1;
                        var bFlash = b.name.includes('flash') ? 0 : 1;
                        return aFlash - bFlash;
                    });

                    for (var i = 0; i < supported.length; i++) {
                        try {
                            var candidateName = supported[i].name;
                            var reply = await executeGeminiFetch(candidateName, key, promptStr);
                            if (reply) {
                                state.workingModelPath = candidateName;
                                localStorage.setItem('diet_working_model_v44', candidateName);
                                return reply;
                            }
                        } catch(err) {
                            lastError = err.message;
                        }
                    }
                }
            } catch(e) {
                lastError = e.message;
            }

            var directModels = ['models/gemini-2.5-flash', 'models/gemini-2.0-flash', 'models/gemini-1.5-flash-latest'];
            for (var j = 0; j < directModels.length; j++) {
                try {
                    var rep = await executeGeminiFetch(directModels[j], key, promptStr);
                    if (rep) {
                        state.workingModelPath = directModels[j];
                        localStorage.setItem('diet_working_model_v44', directModels[j]);
                        return rep;
                    }
                } catch(e) {
                    lastError = e.message;
                }
            }

            throw new Error(lastError || 'Nie udało się połączyć z AI.');
        };

        window.fetchProductByBarcode = async function(barcode) {
            var codeToSearch = barcode || state.scannedBarcodeInput || '';
            var inpElem = document.getElementById('barcodeInput');
            if (!codeToSearch && inpElem) codeToSearch = inpElem.value;

            if (!codeToSearch || !String(codeToSearch).trim()) {
                return alert('Wpisz lub zeskanuj kod kreskowy!');
            }
            var cleanCode = String(codeToSearch).trim();
            state.scannedBarcodeInput = cleanCode;
            state.statusMsg = '⏳ Szukam w darmowej bazie (kod: ' + cleanCode + ')...';
            state.scannedProductData = null;
            render();

            try {
                var response = await fetch('[https://pl.openfoodfacts.org/api/v0/product/](https://pl.openfoodfacts.org/api/v0/product/)' + encodeURIComponent(cleanCode) + '.json');
                var data = await response.json();

                if (data && data.status === 1 && data.product) {
                    var p = data.product;
                    var name = (p.product_name_pl || p.product_name || 'Produkt z kodu') + (p.brands ? ' (' + p.brands + ')' : '');
                    var nut = p.nutriments || {};
                    var kcal100 = parseFloat(nut['energy-kcal_100g'] || nut['energy-kcal']) || 0;
                    var prot100 = parseFloat(nut['proteins_100g']) || 0;
                    var fat100 = parseFloat(nut['fat_100g']) || 0;
                    var carb100 = parseFloat(nut['carbohydrates_100g']) || 0;

                    var pkgWeight = 100;
                    var rawQty = p.quantity || p.product_quantity || '';
                    var match = String(rawQty).match(/(\d+)\s*(g|ml)/i);
                    if (match && match[1]) {
                        pkgWeight = parseInt(match[1]);
                    } else if (kcal100 > 0) {
                        var kcalTotal = parseFloat(nut['energy-kcal']) || 0;
                        if (kcalTotal > 0 && kcalTotal !== kcal100) pkgWeight = Math.round((kcalTotal / kcal100) * 100);
                    }

                    var ratio = pkgWeight / 100;
                    var totalKcal = Math.round(kcal100 * ratio);
                    var totalProt = Math.round((prot100 * ratio) * 10) / 10;
                    var totalFat = Math.round((fat100 * ratio) * 10) / 10;
                    var totalCarb = Math.round((carb100 * ratio) * 10) / 10;

                    state.scannedProductData = { name: name, baseWeight: pkgWeight, baseKcal: totalKcal, baseP: totalProt, baseF: totalFat, baseC: totalCarb, addWeight: pkgWeight, category: "Gotowe Posiłki" };
                    state.statusMsg = '✅ Zeskanowano pomyślnie!';
                    render();
                    return;
                }
            } catch(e) {}

            if (state.geminiApiKey) {
                var prodName = prompt("Baza darmowa nie rozpoznała kodu " + cleanCode + ".\n\nWpisz nazwę tego produktu (np. 'Jogurt naturalny Zott'), a asystent AI oszacuje jego skład i dołączy do zeskanowanego kodu:");
                
                if (prodName && prodName.trim()) {
                    state.statusMsg = '🤖 Pytam AI o produkt: ' + prodName + '...';
                    render();
                    try {
                        var promptStr = 'Oszacuj wartości odżywcze dla produktu o nazwie: "' + prodName.trim() + '". Zwróć odpowiedź WYŁĄCZNIE w formacie JSON bez znaczników markdown: {"name": "' + prodName.trim() + '", "weight": 100, "kcal": 100, "p": 5.0, "f": 2.0, "c": 15.0}. Załóż standardową porcję lub domyślnie 100g, jeśli nie masz pewności.';
                        var aiResponse = await callGeminiSmart(promptStr);
                        aiResponse = aiResponse.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/, "");
                        var aiParsed = JSON.parse(aiResponse);

                        state.scannedProductData = {
                            name: aiParsed.name + ' (AI)',
                            baseWeight: aiParsed.weight || 100,
                            baseKcal: aiParsed.kcal || 100,
                            baseP: aiParsed.p || 0,
                            baseF: aiParsed.f || 0,
                            baseC: aiParsed.c || 0,
                            addWeight: aiParsed.weight || 100,
                            category: "Inne"
                        };
                        state.statusMsg = '✅ AI błyskawicznie oszacowało produkt po Twojej nazwie!';
                        render();
                        return;
                    } catch(aiErr) {
                        alert('Błąd sztucznej inteligencji: ' + aiErr.message);
                    }
                }
            }

            state.statusMsg = '⚠️ Brak w bazie. Wpisz dane ręcznie.';
            alert('Nie znaleziono produktu w bazie. Wpisz dane ręcznie (lub dodaj klucz AI w ustawieniach, aby uaktywnić inteligentne szacowanie z nazwy).');
            render();
        };

        var html5QrCode = null;
        window.startBarcodeScanner = function() {
            if (typeof Html5Qrcode === 'undefined') {
                return alert('Biblioteka skanera się ładuje. Spróbuj za sekundę.');
            }
            state.isScanning = true;
            state.statusMsg = '📷 Kieruj aparat na kod kreskowy...';
            render();

            setTimeout(function() {
                var readerEl = document.getElementById("reader");
                if (!readerEl) return;

                try {
                    if (html5QrCode) {
                        try { html5QrCode.clear(); } catch(e) {}
                    }
                    html5QrCode = new Html5Qrcode("reader");
                    var config = { fps: 10, qrbox: { width: 240, height: 120 }, aspectRatio: 1.5 };

                    html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        function(decodedText) {
                            if (!state.isScanning) return;
                            state.isScanning = false;
                            state.scannedBarcodeInput = decodedText;
                            
                            var scannerRef = html5QrCode;
                            html5QrCode = null;

                            if (scannerRef) {
                                scannerRef.stop().then(function() {
                                    try { scannerRef.clear(); } catch(e) {}
                                    fetchProductByBarcode(decodedText);
                                }).catch(function() {
                                    fetchProductByBarcode(decodedText);
                                });
                            } else {
                                fetchProductByBarcode(decodedText);
                            }
                        },
                        function(errorMessage) {}
                    ).catch(function(err) {
                        state.isScanning = false;
                        state.statusMsg = '';
                        alert('Błąd uruchamiania aparatu: ' + err);
                        render();
                    });
                } catch(err) {
                    state.isScanning = false;
                    alert('Błąd skanera: ' + err.message);
                    render();
                }
            }, 250);
        };

            var baseW = state.unknownWeight;
            var kcal = parseFloat(document.getElementById('unkKcal').value) || 0;
            var p = parseFloat(document.getElementById('unkP').value) || 0;
            var f = parseFloat(document.getElementById('unkF').value) || 0;
            var c = parseFloat(document.getElementById('unkC').value) || 0;

            if (!kcal) return alert('Podaj przynajmniej kalorie!');

            state.products.unshift({
                id: String(Date.now()),
                name: name,
                baseWeight: baseW,
                baseKcal: kcal,
                baseP: p,
                baseF: f,
                baseC: c,
                category: "Inne"
            });

            getDayData().meals.push({
                id: Date.now(),
                name: name,
                weight: baseW,
                kcal: kcal,
                p: p,
                f: f,
                c: c
            });

            state.unknownProductModal = false;
            state.prodSearch = ''; state.inputWeight = ''; state.selectedProdId = '';
            state.statusMsg = 'Dodano nowy produkt do bazy i dziennika!';
            saveState(); render();
        };

        window.delMeal = function(id) { getDayData().meals = getDayData().meals.filter(function(x) { return x.id !== id; }); saveState(); render(); };

        window.searchWorkout = function(val) {
            state.wSearch = val;
            if (val.trim().length > 0) state.wResults = state.workoutsDb.filter(function(w) { return w.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 5);
            else state.wResults = [];
            render(); setTimeout(function() { var el = document.getElementById('wNameInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectWorkoutDrop = function(name) {
            var w = state.workoutsDb.find(function(x) { return x.name === name; });
            if (w) { state.wSearch = w.name; state.wInputTime = w.time; state.wInputKcal = w.kcal; state.wResults = []; render(); }
        };

        window.addWorkout = function() {
            var name = state.wSearch.trim(), time = parseInt(state.wInputTime) || 0, kcal = parseInt(state.wInputKcal) || 0;
            if (!name || !kcal) return alert('Podaj nazwę i spalone kalorie!');
            if (!state.workoutsDb.find(function(w) { return w.name.toLowerCase() === name.toLowerCase(); })) state.workoutsDb.push({ name: name, time: time, kcal: kcal });
            getDayData().workouts.push({ id: Date.now(), name: name, time: time, kcal: kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = []; saveState(); render();
        };

        window.delWorkout = function(id) { getDayData().workouts = getDayData().workouts.filter(function(x) { return x.id !== id; }); saveState(); render(); };
        
        window.saveGoals = function() {
            state.isEditingGoals = false; 
            getDayData().goals = { kcal: parseFloat(document.getElementById('gKcal').value) || 0, p: parseFloat(document.getElementById('gP').value) || 0, f: parseFloat(document.getElementById('gF').value) || 0, c: parseFloat(document.getElementById('gC').value) || 0 }; 
            saveState(); render();
        };

        window.startEditProd = function(id) { 
            state.editProdId = id; 
            render(); 
            setTimeout(function() { 
                var el = document.getElementById('prodForm'); 
                if(el) el.scrollIntoView({behavior: 'smooth'}); 
            }, 100); 
        };
        window.cancelEditProd = function() { state.editProdId = null; render(); };

        window.addProd = function() {
            var nameElem = document.getElementById('pName');
            var catElem = document.getElementById('pCat');
            var wElem = document.getElementById('pW');
            var kElem = document.getElementById('pK');
            var pElem = document.getElementById('pP');
            var fElem = document.getElementById('pF');
            var cElem = document.getElementById('pC');

            var name = nameElem ? nameElem.value.trim() : '';
            var cat = catElem ? catElem.value : 'Inne';
            var w = wElem ? parseFloat(wElem.value) || 100 : 100;
            var p = pElem ? parseFloat(pElem.value) || 0 : 0;
            var fVal = fElem ? parseFloat(fElem.value) || 0 : 0;
            var cVal = cElem ? parseFloat(cElem.value) || 0 : 0;
            var kcal = (kElem && kElem.value !== '') ? parseFloat(kElem.value) : Math.round(p * 4 + cVal * 4 + fVal * 9);

            if (!name) return alert('Podaj nazwę produktu!');

            if(state.editProdId) {
                var prod = state.products.find(function(x) { return x.id === state.editProdId; });
                if(prod) { prod.name = name; prod.category = cat; prod.baseWeight = w; prod.baseKcal = kcal; prod.baseP = p; prod.baseF = fVal; prod.baseC = cVal; }
                state.editProdId = null;
                state.statusMsg = 'Zaktualizowano produkt!';
            } else { 
                state.products.unshift({ id: String(Date.now()), name: name, category: cat, baseWeight: w, baseKcal: kcal, baseP: p, baseF: fVal, baseC: cVal }); 
                state.statusMsg = 'Dodano nowy produkt do bazy!';
            }
            saveState(); render();
        };

        window.delProd = function(id) { if (confirm('Usunąć ten produkt z bazy?')) { state.products = state.products.filter(function(x) { return x.id !== id; }); saveState(); render(); } };

        window.exportFullJson = function() {
            var payload = { version: 56, users: state.users, settings: state.settings, products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, theme: state.theme };
            var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })); a.download = 'dieta_' + state.date + '.json'; a.click();
            state.settings.lastBackup = new Date().toISOString().split('T')[0]; saveState(); state.statusMsg = 'Pobrano plik kopii zapasowej!'; render();
        };

        window.importFullJson = function() {
            try {
                var data = JSON.parse(document.getElementById('jsonArea').value);
                if (!data.products && !data.diaries) return alert('Błędny kod JSON');
                if (state.importMode === 'products') {
                    var names = new Set(state.products.map(function(p) { return p.name.trim().toLowerCase(); })); var added = 0;
                    (data.products || []).forEach(function(p) { if (!names.has(p.name.trim().toLowerCase())) { state.products.push(p); added++; } });
                    state.statusMsg = 'Wgrano ' + added + ' nowych produktów.';
                } else {
                    if (!confirm('Połączyć wgrywaną kopię z obecną historią?')) return;
                    if (data.products) { state.products = data.products; initLocalDefaults(); }
                    if (data.diaries) state.diaries = safeMergeDiaries(data.diaries, state.diaries);
                    if (data.users) state.users = data.users; 
                    if (data.settings) {
                        state.settings = data.settings;
                        if(!state.settings.categories) state.settings.categories = DEFAULT_CATEGORIES.slice();
                    }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.theme) state.theme = data.theme;
                    state.isCloudSynced = true;
                    state.statusMsg = 'Kopia wgrana i bezpiecznie połączona!';
                }
                saveState(); render();
            } catch(e) { alert('Błąd odczytu JSON!'); }
        };

        var touchStartX = 0, touchEndX = 0, tabsOrder = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
        window.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, false);
        window.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            var threshold = 70;
            if (touchEndX < touchStartX - threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx < tabsOrder.length - 1) { switchTab(tabsOrder[idx + 1]); }
            }
            if (touchEndX > touchStartX + threshold) {
                var idx = tabsOrder.indexOf(state.tab); if (idx > 0) { switchTab(tabsOrder[idx - 1]); }
            }
        }, false);

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Dziennik Diety</title>
    <!-- Ładowanie Reacta i Tailwind CSS prosto z sieci -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dziennik');
            
            // Ładowanie danych z pamięci przeglądarki (Local Storage)
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('diet_products')) || []);
            const [diary, setDiary] = useState(() => JSON.parse(localStorage.getItem('diet_diary')) || {});
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('diet_settings')) || { startOfWeek: 1 }); // 1 = Poniedziałek, 0 = Niedziela
            
            const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);

            // Zapisywanie danych przy każdej zmianie
            useEffect(() => { localStorage.setItem('diet_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('diet_diary', JSON.stringify(diary)); }, [diary]);
            useEffect(() => { localStorage.setItem('diet_settings', JSON.stringify(settings)); }, [settings]);

            // Bezpieczne pobieranie danych dla bieżącego dnia
            const currentDayData = diary[currentDate] || { 
                goals: { kcal: 2000, p: 150, f: 70, c: 200 }, 
                meals: [], 
                workouts: [], 
                weight: '' 
            };

            const updateCurrentDay = (newData) => {
                setDiary(prev => ({ ...prev, [currentDate]: { ...currentDayData, ...newData } }));
            };

            // Licznik dni diety (od pierwszego wpisu do dzisiaj)
            const dietDaysCounter = useMemo(() => {
                const dates = Object.keys(diary).sort();
                if (dates.length === 0) return 0;
                const firstDate = new Date(dates[0]);
                const today = new Date();
                const diffTime = Math.abs(today - firstDate);
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            }, [diary]);

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-20">
                    {/* Pasek nawigacji górnej */}
                    <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 class="text-xl font-bold">Dziennik Diety</h1>
                        <span class="text-sm bg-blue-700 px-2 py-1 rounded">Dzień diety: {dietDaysCounter}</span>
                    </div>

                    {/* Główna zawartość */}
                    <div class="p-4">
                        {activeTab === 'dziennik' && <DailyLog currentDate={currentDate} setCurrentDate={setCurrentDate} currentDayData={currentDayData} updateCurrentDay={updateCurrentDay} products={products} />}
                        {activeTab === 'baza' && <ProductDatabase products={products} setProducts={setProducts} />}
                        {activeTab === 'podsumowanie' && <WeeklySummary diary={diary} currentDate={currentDate} settings={settings} setSettings={setSettings} />}
                    </div>

                    {/* Pasek nawigacji dolnej */}
                    <div class="fixed bottom-0 max-w-md w-full bg-white border-t flex justify-around p-3 text-sm font-semibold text-gray-500 z-10">
                        <button onClick={() => setActiveTab('dziennik')} class={activeTab === 'dziennik' ? 'text-blue-600' : ''}>📅 Dziennik</button>
                        <button onClick={() => setActiveTab('baza')} class={activeTab === 'baza' ? 'text-blue-600' : ''}>🍎 Baza Produktów</button>
                        <button onClick={() => setActiveTab('podsumowanie')} class={activeTab === 'podsumowanie' ? 'text-blue-600' : ''}>📊 Tydzień</button>
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: Dziennik Dnia ---
        function DailyLog({ currentDate, setCurrentDate, currentDayData, updateCurrentDay, products }) {
            const [selectedProduct, setSelectedProduct] = useState('');
            const [productWeight, setProductWeight] = useState('');

            // Obliczenia podsumowania dnia
            const totalEaten = currentDayData.meals.reduce((acc, meal) => {
                acc.kcal += meal.kcal; acc.p += meal.p; acc.f += meal.f; acc.c += meal.c; return acc;
            }, { kcal: 0, p: 0, f: 0, c: 0 });

            const totalBurned = currentDayData.workouts.reduce((acc, w) => acc + w.kcal, 0);
            
            // Bilans z uwzględnieniem treningów (opcjonalnie można odjąć spalone od zjedzonych)
            const kcalLeft = currentDayData.goals.kcal - totalEaten.kcal + totalBurned;

            const addMeal = () => {
                if (!selectedProduct || !productWeight) return alert('Wybierz produkt i podaj wagę!');
                const prod = products.find(p => p.id === selectedProduct);
                const multiplier = productWeight / prod.weight;
                
                const newMeal = {
                    id: Date.now(),
                    name: prod.name,
                    weight: parseFloat(productWeight),
                    kcal: Math.round(prod.kcal * multiplier),
                    p: Math.round(prod.p * multiplier),
                    f: Math.round(prod.f * multiplier),
                    c: Math.round(prod.c * multiplier)
                };
                
                updateCurrentDay({ meals: [...currentDayData.meals, newMeal] });
                setProductWeight('');
            };

            const removeMeal = (id) => {
                updateCurrentDay({ meals: currentDayData.meals.filter(m => m.id !== id) });
            };

            const addWorkout = (e) => {
                e.preventDefault();
                const name = e.target.wName.value;
                const time = e.target.wTime.value;
                const kcal = e.target.wKcal.value;
                if(!name || !time || !kcal) return;

                const newWorkout = { id: Date.now(), name, time: parseInt(time), kcal: parseInt(kcal) };
                updateCurrentDay({ workouts: [...currentDayData.workouts, newWorkout] });
                e.target.reset();
            };

            return (
                <div class="space-y-6">
                    {/* Wybór daty i wagi */}
                    <div class="flex space-x-2 items-center justify-between">
                        <input type="date" value={currentDate} onChange={(e) => setCurrentDate(e.target.value)} class="border p-2 rounded flex-1" />
                        <div class="flex items-center space-x-1">
                            <span class="text-sm text-gray-500">Waga:</span>
                            <input type="number" placeholder="kg" value={currentDayData.weight} onChange={(e) => updateCurrentDay({ weight: e.target.value })} class="border p-2 rounded w-20 text-center" />
                        </div>
                    </div>

                    {/* Pasek postępu (Zjedzone vs Cel) */}
                    <div class="bg-gray-50 p-4 rounded-lg border">
                        <div class="flex justify-between items-end mb-2">
                            <div>
                                <p class="text-xs text-gray-500 uppercase">Zjedzono</p>
                                <p class="text-2xl font-bold">{totalEaten.kcal} <span class="text-sm font-normal text-gray-500">kcal</span></p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-500 uppercase">{kcalLeft >= 0 ? 'Pozostało' : 'Nadwyżka'}</p>
                                <p class={`text-2xl font-bold ${kcalLeft < 0 ? 'text-red-500' : 'text-green-600'}`}>{Math.abs(kcalLeft)} <span class="text-sm font-normal text-gray-500">kcal</span></p>
                            </div>
                        </div>
                        {/* Paski Makro */}
                        <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs">
                            <div class="bg-blue-100 p-1 rounded">B: {totalEaten.p} / {currentDayData.goals.p}g</div>
                            <div class="bg-yellow-100 p-1 rounded">T: {totalEaten.f} / {currentDayData.goals.f}g</div>
                            <div class="bg-green-100 p-1 rounded">W: {totalEaten.c} / {currentDayData.goals.c}g</div>
                        </div>
                    </div>

                    {/* Dodawanie posiłku */}
                    <div class="border rounded-lg p-3 bg-white">
                        <h3 class="font-bold mb-2">Dodaj produkt z bazy</h3>
                        <div class="flex space-x-2">
                            <select value={selectedProduct} onChange={(e) => setSelectedProduct(e.target.value)} class="border p-2 rounded flex-1">
                                <option value="">Wybierz produkt...</option>
                                {products.map(p => <option key={p.id} value={p.id}>{p.name} ({p.kcal} kcal/{p.weight}g)</option>)}
                            </select>
                            <input type="number" placeholder="Waga (g)" value={productWeight} onChange={(e) => setProductWeight(e.target.value)} class="border p-2 rounded w-24" />
                            <button onClick={addMeal} class="bg-blue-600 text-white p-2 rounded font-bold">+</button>
                        </div>
                        {/* Lista zjedzonych */}
                        <div class="mt-4 space-y-2">
                            {currentDayData.meals.map(m => (
                                <div key={m.id} class="flex justify-between items-center text-sm border-b pb-1">
                                    <div>
                                        <p class="font-bold">{m.name}</p>
                                        <p class="text-gray-500 text-xs">{m.weight}g | B:{m.p} T:{m.f} W:{m.c}</p>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="font-bold">{m.kcal} kcal</span>
                                        <button onClick={() => removeMeal(m.id)} class="text-red-500 font-bold">X</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Treningi */}
                    <div class="border rounded-lg p-3 bg-white">
                        <h3 class="font-bold mb-2 text-orange-600">🏋️ Treningi (-{totalBurned} kcal)</h3>
                        <form onSubmit={addWorkout} class="flex space-x-1 mb-3">
                            <input name="wName" placeholder="Nazwa" class="border p-1 rounded w-full text-sm" />
                            <input name="wTime" type="number" placeholder="Min" class="border p-1 rounded w-16 text-sm" />
                            <input name="wKcal" type="number" placeholder="Kcal" class="border p-1 rounded w-16 text-sm" />
                            <button type="submit" class="bg-orange-500 text-white px-2 rounded">+</button>
                        </form>
                        {currentDayData.workouts.map(w => (
                            <div key={w.id} class="flex justify-between text-sm text-gray-600">
                                <span>{w.name} ({w.time} min)</span>
                                <span>🔥 {w.kcal} kcal</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: Baza Produktów ---
        function ProductDatabase({ products, setProducts }) {
            const addProduct = (e) => {
                e.preventDefault();
                const name = e.target.pName.value;
                const weight = parseFloat(e.target.pWeight.value) || 100;
                const p = parseFloat(e.target.pPro.value) || 0;
                const f = parseFloat(e.target.pFat.value) || 0;
                const c = parseFloat(e.target.pCarb.value) || 0;
                
                // RĘCZNE WPISYWANIE KALORII (jeśli puste, licz ze wzoru)
                let kcalInput = e.target.pKcal.value;
                let kcal = kcalInput !== "" ? parseFloat(kcalInput) : Math.round((p * 4) + (c * 4) + (f * 9));

                if (!name) return alert('Podaj nazwę produktu!');

                const newProd = { id: Date.now().toString(), name, weight, p, f, c, kcal };
                setProducts([...products, newProd]);
                e.target.reset();
            };

            const deleteProduct = (id) => {
                if(confirm('Usunąć produkt z bazy?')) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            return (
                <div>
                    <div class="bg-blue-50 p-4 rounded-lg border mb-6">
                        <h2 class="font-bold mb-3 text-lg">➕ Dodaj nowy produkt</h2>
                        <form onSubmit={addProduct} class="space-y-3 text-sm">
                            <input name="pName" placeholder="Nazwa produktu (np. Kurczak)" class="border p-2 rounded w-full font-bold" />
                            <div class="flex space-x-2">
                                <div class="w-1/2">
                                    <label class="text-xs text-gray-500">Waga porcji (g)</label>
                                    <input name="pWeight" type="number" defaultValue="100" class="border p-2 rounded w-full" />
                                </div>
                                <div class="w-1/2">
                                    <label class="text-xs text-gray-500">Kalorie (Kcal) - Opcjonalnie</label>
                                    <input name="pKcal" type="number" placeholder="Automatycznie" class="border-2 border-green-300 bg-green-50 p-2 rounded w-full" />
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div><label class="text-xs text-gray-500">Białko (g)</label><input name="pPro" type="number" step="0.1" class="border p-2 rounded w-full" /></div>
                                <div><label class="text-xs text-gray-500">Tłuszcz (g)</label><input name="pFat" type="number" step="0.1" class="border p-2 rounded w-full" /></div>
                                <div><label class="text-xs text-gray-500">Węglo (g)</label><input name="pCarb" type="number" step="0.1" class="border p-2 rounded w-full" /></div>
                            </div>
                            <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded font-bold mt-2">Zapisz w bazie</button>
                        </form>
                    </div>

                    <h3 class="font-bold text-gray-700 mb-2">Twoja baza ({products.length})</h3>
                    <div class="space-y-2">
                        {products.map(p => (
                            <div key={p.id} class="bg-white p-3 rounded shadow-sm border flex justify-between items-center">
                                <div>
                                    <p class="font-bold">{p.name} <span class="text-xs text-gray-400 font-normal">({p.weight}g)</span></p>
                                    <p class="text-xs text-gray-500">B: {p.p}g | T: {p.f}g | W: {p.c}g</p>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <span class="font-bold text-green-600">{p.kcal} kcal</span>
                                    <button onClick={() => deleteProduct(p.id)} class="text-red-300 hover:text-red-500">🗑️</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: Podsumowanie Tygodnia ---
        function WeeklySummary({ diary, currentDate, settings, setSettings }) {
            // Generowanie dni z wybranego tygodnia
            const generateWeek = () => {
                const curr = new Date(currentDate);
                const day = curr.getDay();
                // Przesunięcie dla poniedziałku (1) lub niedzieli (0)
                const offset = settings.startOfWeek === 1 ? (day === 0 ? -6 : 1 - day) : -day;
                
                const firstDay = new Date(curr.setDate(curr.getDate() + offset));
                const week = [];
                for(let i=0; i<7; i++) {
                    const next = new Date(firstDay);
                    next.setDate(firstDay.getDate() + i);
                    week.push(next.toISOString().split('T')[0]);
                }
                return week;
            };

            const weekDates = generateWeek();
            let totalKcal = 0, totalBurned = 0, daysCounted = 0;
            let weights = [];

            weekDates.forEach(date => {
                if(diary[date]) {
                    const eaten = diary[date].meals.reduce((sum, m) => sum + m.kcal, 0);
                    const burned = diary[date].workouts.reduce((sum, w) => sum + w.kcal, 0);
                    if(eaten > 0) { totalKcal += eaten; daysCounted++; }
                    totalBurned += burned;
                    if(diary[date].weight) weights.push(parseFloat(diary[date].weight));
                }
            });

            const avgKcal = daysCounted ? Math.round(totalKcal / daysCounted) : 0;
            const weightDiff = weights.length >= 2 ? (weights[weights.length-1] - weights[0]).toFixed(1) : 0;

            return (
                <div class="space-y-6">
                    <div class="flex justify-between items-center bg-white p-3 border rounded shadow-sm">
                        <span class="font-bold">Początek tygodnia:</span>
                        <select value={settings.startOfWeek} onChange={(e) => setSettings({ startOfWeek: parseInt(e.target.value)})} class="border p-1 rounded">
                            <option value={1}>Poniedziałek</option>
                            <option value={0}>Niedziela</option>
                        </select>
                    </div>

                    <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-lg">
                        <h2 class="text-center font-bold text-indigo-800 mb-4">Podsumowanie dla tygodnia:<br/><span class="text-sm font-normal">{weekDates[0]} - {weekDates[6]}</span></h2>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white p-3 rounded text-center shadow-sm">
                                <p class="text-xs text-gray-500">Średnio spożyte</p>
                                <p class="text-xl font-bold text-indigo-600">{avgKcal} kcal</p>
                            </div>
                            <div class="bg-white p-3 rounded text-center shadow-sm">
                                <p class="text-xs text-gray-500">Spalone w tyg.</p>
                                <p class="text-xl font-bold text-orange-500">🔥 {totalBurned} kcal</p>
                            </div>
                            <div class="bg-white p-3 rounded text-center shadow-sm col-span-2">
                                <p class="text-xs text-gray-500">Zmiana wagi w tym tygodniu</p>
                                <p class={`text-2xl font-bold ${weightDiff > 0 ? 'text-red-500' : 'text-green-500'}`}>
                                    {weightDiff > 0 ? '+' : ''}{weightDiff} kg
                                </p>
                                <p class="text-xs text-gray-400 mt-1">(Na podstawie pierwszego i ostatniego wpisu wagi)</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

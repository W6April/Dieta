```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DietTracker</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone (kompilator JSX w przeglądarce) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; /* slate-100 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Ukrycie strzałek w polach numerycznych dla czystszego UI */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* Chowanie paska przewijania (estetyka appki mobilnej) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Pomocnicza funkcja do obsługi dat (lokalna strefa czasowa, YYYY-MM-DD)
        const getLocalISODate = (dateObj = new Date()) => {
            const offset = dateObj.getTimezoneOffset();
            const localDate = new Date(dateObj.getTime() - (offset*60*1000));
            return localDate.toISOString().split('T')[0];
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dziennik');
            const [currentDate, setCurrentDate] = useState(getLocalISODate());

            // --- STAN Z LOCAL STORAGE ---
            // Baza produktów (przechowuje wartości na 100g)
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('dt_products_v2')) || []);
            // Dziennik posiłków i treningów
            const [diary, setDiary] = useState(() => JSON.parse(localStorage.getItem('dt_diary_v2')) || {});
            // Ustawienia aplikacji (start tygodnia)
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('dt_settings_v2')) || { startOfWeek: 1 });
            // Zapamiętane ostatnie wagi produktów: { productId: lastUsedWeight }
            const [lastWeights, setLastWeights] = useState(() => JSON.parse(localStorage.getItem('dt_lastweights_v2')) || {});

            // Zapisywanie zmian
            useEffect(() => { localStorage.setItem('dt_products_v2', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('dt_diary_v2', JSON.stringify(diary)); }, [diary]);
            useEffect(() => { localStorage.setItem('dt_settings_v2', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('dt_lastweights_v2', JSON.stringify(lastWeights)); }, [lastWeights]);

            // Dane dla wybranego dnia
            const defaultGoals = { kcal: 2500, p: 170, f: 70, c: 220 };
            const currentDayData = diary[currentDate] || { 
                goals: defaultGoals,
                meals: [], 
                workouts: [], 
                weight: '' 
            };

            const updateCurrentDay = (updates) => {
                setDiary(prev => ({ 
                    ...prev, 
                    [currentDate]: { ...currentDayData, ...updates } 
                }));
            };

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen pb-20 shadow-2xl relative overflow-hidden flex flex-col">
                    {/* Górny Pasek */}
                    <div className="bg-slate-900 text-white px-5 py-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
                        <h1 className="text-xl font-extrabold tracking-tight">FitTracker</h1>
                        <div className="bg-slate-800 text-slate-300 text-xs px-2 py-1 rounded-md font-medium">
                            {currentDate}
                        </div>
                    </div>

                    {/* Główna Zawartość */}
                    <div className="flex-1 overflow-y-auto no-scrollbar bg-slate-50">
                        {activeTab === 'dziennik' && (
                            <DailyLog 
                                currentDate={currentDate} 
                                setCurrentDate={setCurrentDate} 
                                currentDayData={currentDayData} 
                                updateCurrentDay={updateCurrentDay} 
                                products={products}
                                lastWeights={lastWeights}
                                setLastWeights={setLastWeights}
                            />
                        )}
                        {activeTab === 'baza' && (
                            <ProductDatabase 
                                products={products} 
                                setProducts={setProducts} 
                            />
                        )}
                        {activeTab === 'tydzien' && (
                            <WeeklySummary 
                                diary={diary} 
                                currentDate={currentDate} 
                                settings={settings} 
                                setSettings={setSettings} 
                            />
                        )}
                    </div>

                    {/* Dolne Menu Nawigacyjne */}
                    <div className="fixed bottom-0 max-w-md w-full bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center pb-safe shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.05)] z-30">
                        <TabButton 
                            active={activeTab === 'dziennik'} 
                            onClick={() => setActiveTab('dziennik')} 
                            label="Dziennik" 
                            icon="📓" 
                        />
                        <TabButton 
                            active={activeTab === 'baza'} 
                            onClick={() => setActiveTab('baza')} 
                            label="Baza" 
                            icon="🍎" 
                        />
                        <TabButton 
                            active={activeTab === 'tydzien'} 
                            onClick={() => setActiveTab('tydzien')} 
                            label="Tydzień" 
                            icon="📊" 
                        />
                    </div>
                </div>
            );
        }

        // --- KOMPONENT: PRZYCISK MENU ---
        function TabButton({ active, onClick, label, icon }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-20 py-2 rounded-xl transition-all duration-200 ${active ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50'}`}>
                    <span className="text-xl mb-0.5 block">{icon}</span>
                    <span className="text-[10px] tracking-wide">{label}</span>
                </button>
            );
        }

        // --- ZAKŁADKA 1: DZIENNIK ---
        function DailyLog({ currentDate, setCurrentDate, currentDayData, updateCurrentDay, products, lastWeights, setLastWeights }) {
            const [selectedProd, setSelectedProd] = useState('');
            const [weightInput, setWeightInput] = useState('');
            const [isEditingGoals, setIsEditingGoals] = useState(false);
            const [goalsForm, setGoalsForm] = useState(currentDayData.goals);

            // Aktualizacja formularza celów po zmianie dnia
            useEffect(() => {
                setGoalsForm(currentDayData.goals);
            }, [currentDate, currentDayData.goals]);

            // Zmiana daty
            const changeDate = (days) => {
                const d = new Date(currentDate);
                d.setDate(d.getDate() + days);
                setCurrentDate(getLocalISODate(d));
            };

            // Zapis edytowanych celów
            const handleSaveGoals = (e) => {
                e.preventDefault();
                updateCurrentDay({
                    goals: {
                        kcal: parseInt(goalsForm.kcal) || 0,
                        p: parseInt(goalsForm.p) || 0,
                        f: parseInt(goalsForm.f) || 0,
                        c: parseInt(goalsForm.c) || 0,
                    }
                });
                setIsEditingGoals(false);
            };

            // Obsługa wyboru produktu - sugerowanie ostatniej wagi
            const handleProductSelect = (e) => {
                const prodId = e.target.value;
                setSelectedProd(prodId);
                if (prodId && lastWeights[prodId]) {
                    setWeightInput(lastWeights[prodId]);
                } else {
                    setWeightInput('');
                }
            };

            // Dodawanie posiłku z bazy
            const handleAddMeal = (e) => {
                e.preventDefault();
                if (!selectedProd || !weightInput) return;
                
                const prod = products.find(p => p.id === selectedProd);
                const w = parseFloat(weightInput);
                if (!prod || isNaN(w) || w <= 0) return;

                // Przeliczenie na podstawie bazy (wartości na 100g)
                const ratio = w / 100;
                const meal = {
                    id: Date.now().toString(),
                    name: prod.name,
                    weight: w,
                    kcal: Math.round(prod.kcal100 * ratio),
                    p: Math.round(prod.p100 * ratio * 10) / 10,
                    f: Math.round(prod.f100 * ratio * 10) / 10,
                    c: Math.round(prod.c100 * ratio * 10) / 10
                };

                // Zapisz użytą wagę dla tego produktu
                setLastWeights(prev => ({ ...prev, [prod.id]: w }));
                
                updateCurrentDay({ meals: [...currentDayData.meals, meal] });
                setSelectedProd('');
                setWeightInput('');
            };

            // Usunięcie posiłku
            const handleRemoveMeal = (id) => {
                updateCurrentDay({ meals: currentDayData.meals.filter(m => m.id !== id) });
            };

            // Dodawanie treningu
            const handleAddWorkout = (e) => {
                e.preventDefault();
                const name = e.target.wName.value;
                const time = parseInt(e.target.wTime.value);
                const kcal = parseInt(e.target.wKcal.value);

                if (!name || isNaN(time) || isNaN(kcal)) return;

                const workout = { id: Date.now().toString(), name, time, kcal };
                updateCurrentDay({ workouts: [...currentDayData.workouts, workout] });
                e.target.reset();
            };

            const handleRemoveWorkout = (id) => {
                updateCurrentDay({ workouts: currentDayData.workouts.filter(w => w.id !== id) });
            };

            // Obliczenia podsumowania
            const eaten = currentDayData.meals.reduce((acc, m) => {
                return { kcal: acc.kcal + m.kcal, p: acc.p + m.p, f: acc.f + m.f, c: acc.c + m.c };
            }, { kcal: 0, p: 0, f: 0, c: 0 });

            const burned = currentDayData.workouts.reduce((sum, w) => sum + w.kcal, 0);
            
            // Bilans kalorii = Cel - Zjedzone + Spalone na treningu
            const remainingKcal = currentDayData.goals.kcal - eaten.kcal + burned;
            const isSurplus = remainingKcal < 0;

            return (
                <div className="p-4 space-y-5">
                    {/* Nawigacja Kalendarza i Waga */}
                    <div className="flex flex-col gap-3">
                        <div className="flex justify-between items-center bg-white p-2 rounded-xl shadow-sm border border-slate-100">
                            <button onClick={() => changeDate(-1)} className="p-2 px-3 text-slate-500 bg-slate-50 hover:bg-slate-100 rounded-lg font-bold">Wczoraj</button>
                            <input 
                                type="date" 
                                value={currentDate} 
                                onChange={(e) => setCurrentDate(e.target.value)} 
                                className="font-bold text-slate-700 bg-transparent text-center focus:outline-none"
                            />
                            <button onClick={() => changeDate(1)} className="p-2 px-3 text-slate-500 bg-slate-50 hover:bg-slate-100 rounded-lg font-bold">Jutro</button>
                        </div>
                        <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                            <span className="text-sm font-semibold text-slate-600 ml-1">Twoja waga dzisiaj:</span>
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1">
                                <input 
                                    type="number" step="0.1" placeholder="0.0" 
                                    value={currentDayData.weight} 
                                    onChange={(e) => updateCurrentDay({ weight: e.target.value })}
                                    className="w-16 bg-transparent text-right font-bold text-slate-800 outline-none"
                                />
                                <span className="ml-1 text-slate-400 text-sm">kg</span>
                            </div>
                        </div>
                    </div>

                    {/* Cele Dzienne i Podsumowanie Makro */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="bg-indigo-50 px-4 py-3 flex justify-between items-center border-b border-indigo-100">
                            <span className="font-bold text-indigo-900 text-sm">Podsumowanie dnia</span>
                            <button onClick={() => setIsEditingGoals(!isEditingGoals)} className="text-xs font-semibold text-indigo-600 bg-indigo-100 px-2 py-1 rounded-md hover:bg-indigo-200">
                                {isEditingGoals ? 'Anuluj edycję' : '⚙️ Edytuj cele'}
                            </button>
                        </div>

                        {isEditingGoals && (
                            <form onSubmit={handleSaveGoals} className="p-4 bg-indigo-50/50 border-b border-indigo-100 space-y-3">
                                <p className="text-[10px] uppercase font-bold text-slate-500">Ustaw zapotrzebowanie dla tego dnia:</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-slate-600 font-medium">Kalorie (kcal)</label>
                                        <input type="number" value={goalsForm.kcal} onChange={(e)=>setGoalsForm({...goalsForm, kcal: e.target.value})} className="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-400" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-600 font-medium">Białko (g)</label>
                                        <input type="number" value={goalsForm.p} onChange={(e)=>setGoalsForm({...goalsForm, p: e.target.value})} className="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-400" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-600 font-medium">Tłuszcz (g)</label>
                                        <input type="number" value={goalsForm.f} onChange={(e)=>setGoalsForm({...goalsForm, f: e.target.value})} className="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-400" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-600 font-medium">Węglowodany (g)</label>
                                        <input type="number" value={goalsForm.c} onChange={(e)=>setGoalsForm({...goalsForm, c: e.target.value})} className="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:border-indigo-400" required />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm">Zapisz cele na dziś</button>
                            </form>
                        )}

                        <div className="p-4 grid grid-cols-2 gap-4">
                            <div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase">Zjedzono</p>
                                <p className="text-3xl font-black text-slate-800 tracking-tight">{eaten.kcal} <span className="text-sm font-semibold text-slate-500">kcal</span></p>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] font-bold text-slate-400 uppercase">{isSurplus ? 'Nadwyżka' : 'Pozostało (z treningiem)'}</p>
                                <p className={`text-3xl font-black tracking-tight ${isSurplus ? 'text-red-500' : 'text-emerald-500'}`}>
                                    {isSurplus ? '+' : ''}{Math.abs(remainingKcal)} <span className="text-sm font-semibold opacity-70">kcal</span>
                                </p>
                            </div>
                        </div>

                        <div className="px-4 pb-4 space-y-2">
                            <MacroProgress label="Białko" current={eaten.p} goal={currentDayData.goals.p} colorClass="bg-blue-500" />
                            <MacroProgress label="Tłuszcz" current={eaten.f} goal={currentDayData.goals.f} colorClass="bg-amber-500" />
                            <MacroProgress label="Węglowodany" current={eaten.c} goal={currentDayData.goals.c} colorClass="bg-purple-500" />
                        </div>
                    </div>

                    {/* Dodawanie Posiłków */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                        <h3 className="font-bold text-slate-800 mb-3 flex items-center">🍽️ Posiłki</h3>
                        {products.length === 0 ? (
                            <div className="bg-amber-50 border border-amber-100 text-amber-700 text-sm p-3 rounded-lg text-center">
                                Twoja baza produktów jest pusta. Przejdź do zakładki "Baza" i dodaj jedzenie.
                            </div>
                        ) : (
                            <form onSubmit={handleAddMeal} className="flex gap-2">
                                <select 
                                    value={selectedProd} 
                                    onChange={handleProductSelect} 
                                    className="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 outline-none focus:border-indigo-500"
                                >
                                    <option value="">Wybierz produkt...</option>
                                    {products.map(p => (
                                        <option key={p.id} value={p.id}>{p.name} ({Math.round(p.kcal100)} kcal/100g)</option>
                                    ))}
                                </select>
                                <input 
                                    type="number" 
                                    placeholder="Waga(g)" 
                                    value={weightInput} 
                                    onChange={(e) => setWeightInput(e.target.value)} 
                                    className="w-20 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-2 py-2 text-center outline-none focus:border-indigo-500" 
                                    required 
                                />
                                <button type="submit" className="bg-indigo-600 text-white font-bold px-3 rounded-xl">+</button>
                            </form>
                        )}

                        <div className="mt-4 space-y-2">
                            {currentDayData.meals.length === 0 && <p className="text-center text-xs text-slate-400 py-2">Brak wpisanych posiłków.</p>}
                            {currentDayData.meals.map(m => (
                                <div key={m.id} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl">
                                    <div>
                                        <p className="font-bold text-slate-800 text-sm">{m.name}</p>
                                        <p className="text-[11px] text-slate-500 mt-0.5">{m.weight}g • B:{m.p} T:{m.f} W:{m.c}</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="font-black text-indigo-600 text-sm">{m.kcal} kcal</span>
                                        <button onClick={() => handleRemoveMeal(m.id)} className="text-slate-300 hover:text-red-500 text-lg">&times;</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Dodawanie Treningów */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-bold text-slate-800 flex items-center">🏋️ Treningi</h3>
                            {burned > 0 && <span className="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-1 rounded-md">Spalono: {burned} kcal</span>}
                        </div>
                        <form onSubmit={handleAddWorkout} className="flex gap-2">
                            <input name="wName" placeholder="Nazwa np. Bieg" className="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 outline-none focus:border-orange-500" required />
                            <input name="wTime" type="number" placeholder="Min" className="w-16 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-2 py-2 text-center outline-none focus:border-orange-500" required />
                            <input name="wKcal" type="number" placeholder="Kcal" className="w-16 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-2 py-2 text-center outline-none focus:border-orange-500" required />
                            <button type="submit" className="bg-orange-500 text-white font-bold px-3 rounded-xl">+</button>
                        </form>

                        <div className="mt-4 space-y-2">
                            {currentDayData.workouts.map(w => (
                                <div key={w.id} className="flex justify-between items-center p-3 bg-orange-50 border border-orange-100 rounded-xl">
                                    <div>
                                        <p className="font-bold text-slate-800 text-sm">{w.name}</p>
                                        <p className="text-[11px] text-orange-600/70 mt-0.5">Czas: {w.time} min</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="font-black text-orange-600 text-sm">🔥 {w.kcal} kcal</span>
                                        <button onClick={() => handleRemoveWorkout(w.id)} className="text-orange-300 hover:text-red-500 text-lg">&times;</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function MacroProgress({ label, current, goal, colorClass }) {
            const currentRound = Math.round(current);
            const percentage = goal > 0 ? Math.min((currentRound / goal) * 100, 100) : 0;
            const isOver = currentRound > goal;
            
            return (
                <div className="mb-2">
                    <div className="flex justify-between items-end mb-1">
                        <span className="text-[10px] font-bold text-slate-500 uppercase">{label}</span>
                        <span className={`text-[11px] font-bold ${isOver ? 'text-red-500' : 'text-slate-700'}`}>
                            {currentRound} / {goal} g
                        </span>
                    </div>
                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                        <div className={`h-full ${isOver ? 'bg-red-500' : colorClass}`} style={{ width: `${percentage}%` }}></div>
                    </div>
                </div>
            );
        }

        // --- ZAKŁADKA 2: BAZA PRODUKTÓW ---
        function ProductDatabase({ products, setProducts }) {
            const handleAddProduct = (e) => {
                e.preventDefault();
                const name = e.target.pName.value.trim();
                const weight = parseFloat(e.target.pWeight.value);
                const kcal = parseFloat(e.target.pKcal.value);
                const p = parseFloat(e.target.pPro.value) || 0;
                const f = parseFloat(e.target.pFat.value) || 0;
                const c = parseFloat(e.target.pCarb.value) || 0;

                if (!name || isNaN(weight) || weight <= 0 || isNaN(kcal)) {
                    alert("Podaj nazwę, prawidłową wagę i kalorie.");
                    return;
                }

                // PRZELICZANIE NA 100g (Ważny wymóg)
                const ratio = 100 / weight;
                const newProduct = {
                    id: Date.now().toString(),
                    name,
                    kcal100: kcal * ratio,
                    p100: p * ratio,
                    f100: f * ratio,
                    c100: c * ratio,
                };

                // Sortuj alfabetycznie przy zapisie
                const newProducts = [...products, newProduct].sort((a,b) => a.name.localeCompare(b.name));
                setProducts(newProducts);
                e.target.reset();
                e.target.pWeight.value = 100; // Reset domyślny
            };

            const handleDelete = (id) => {
                if(confirm("Czy na pewno chcesz usunąć ten produkt z bazy?")) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            return (
                <div className="p-4 space-y-6">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="font-extrabold text-slate-800 text-lg mb-1">Dodaj do bazy</h2>
                        <p className="text-[11px] text-slate-500 mb-4 leading-relaxed">
                            Wpisz wartości z etykiety dla dowolnej wagi (np. cała paczka 250g). <strong className="text-indigo-600">Aplikacja automatycznie przeliczy i zapisze je jako wartości na 100g.</strong>
                        </p>
                        
                        <form onSubmit={handleAddProduct} className="space-y-3">
                            <input name="pName" placeholder="Nazwa produktu" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold outline-none focus:border-indigo-400" required />

        // --- ZAKŁADKA 3: TYDZIEŃ ---
        function WeeklySummary({ diary, currentDate, settings, setSettings }) {
            // Kalkulacja dat dla obecnego tygodnia
            const currentWeek = useMemo(() => {
                const dateObj = new Date(currentDate);
                const day = dateObj.getDay(); // 0 = Sunday, 1 = Monday
                const startIsMonday = settings.startOfWeek === 1;
                // Oblicz offset, żeby cofnąć się do pierwszego dnia tygodnia
                const offset = startIsMonday ? (day === 0 ? -6 : 1 - day) : -day;
                
                const firstDay = new Date(dateObj);
                firstDay.setDate(dateObj.getDate() + offset);
                
                const days = [];
                for(let i=0; i<7; i++) {
                    const d = new Date(firstDay);
                    d.setDate(firstDay.getDate() + i);
                    days.push(getLocalISODate(d));
                }
                return days;
            }, [currentDate, settings.startOfWeek]);

            // Zbieranie statystyk
            const stats = useMemo(() => {
                let sumKcal = 0;
                let sumBurned = 0;
                let daysWithFood = 0;
                let weights = [];

                currentWeek.forEach(date => {
                    const dayData = diary[date];
                    if (dayData) {
                        const eaten = dayData.meals.reduce((acc, m) => acc + m.kcal, 0);
                        const burned = dayData.workouts.reduce((acc, w) => acc + w.kcal, 0);
                        
                        if (eaten > 0) {
                            sumKcal += eaten;
                            daysWithFood++;
                        }
                        sumBurned += burned;

                        if (dayData.weight) {
                            weights.push({ date, w: parseFloat(dayData.weight) });
                        }
                    }
                });

                const avgKcal = daysWithFood > 0 ? Math.round(sumKcal / daysWithFood) : 0;
                
                // Sortowanie wag chronologicznie żeby policzyć różnicę
                weights.sort((a, b) => a.date.localeCompare(b.date));
                let weightChangeStr = "Brak danych";
                let changeVal = 0;
                if (weights.length >= 2) {
                    changeVal = weights[weights.length - 1].w - weights[0].w;
                    weightChangeStr = `${changeVal > 0 ? '+' : ''}${changeVal.toFixed(1)} kg`;
                } else if (weights.length === 1) {
                    weightChangeStr = "1 pomiar";
                }

                return { avgKcal, sumBurned, weightChangeStr, changeVal };
            }, [currentWeek, diary]);

            return (
                <div className="p-4 space-y-6">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <span className="text-sm font-bold text-slate-700">Początek tygodnia:</span>
                        <select 
                            value={settings.startOfWeek} 
                            onChange={(e) => setSettings({ startOfWeek: parseInt(e.target.value) })}
                            className="bg-slate-50 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl px-3 py-2 outline-none focus:border-indigo-500 cursor-pointer"
                        >
                            <option value={1}>Poniedziałek</option>
                            <option value={0}>Niedziela</option>
                        </select>
                    </div>

                    <div className="bg-gradient-to-br from-indigo-500 to-blue-600 p-6 rounded-3xl shadow-lg text-white">
                        <h2 className="text-xl font-extrabold mb-1">Podsumowanie Tygodnia</h2>
                        <p className="text-indigo-100 text-xs font-medium mb-6">{currentWeek[0]}  &rarr;  {currentWeek[6]}</p>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white/10 backdrop-blur-sm p-4 rounded-2xl border border-white/10">
                                <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-wider">Średnie Spożycie</p>
                                <p className="text-2xl font-black mt-1">{stats.avgKcal} <span className="text-sm font-medium opacity-80 text-indigo-100">kcal</span></p>
                            </div>
                            <div className="bg-white/10 backdrop-blur-sm p-4 rounded-2xl border border-white/10">
                                <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-wider">Suma Spalonych</p>
                                <p className="text-2xl font-black mt-1 text-orange-200">🔥 {stats.sumBurned}</p>
                            </div>
                            <div className="col-span-2 bg-white/10 backdrop-blur-sm p-4 rounded-2xl border border-white/10 flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] uppercase font-bold text-indigo-200 tracking-wider">Zmiana Wagi</p>
                                    <p className="text-[10px] text-indigo-100 mt-0.5">(Pierwszy vs Ostatni pomiar)</p>
                                </div>
                                <div className={`text-xl font-black px-4 py-2 rounded-xl ${stats.changeVal > 0 ? 'bg-red-500/30 text-red-100' : (stats.changeVal < 0 ? 'bg-emerald-500/30 text-emerald-100' : 'bg-white/10')}`}>
                                    {stats.weightChangeStr}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
